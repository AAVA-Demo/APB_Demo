<div class="row"><div class="col-md-12"><h2>My Credit Cards</h2><p class="text-muted">Manage and monitor all your credit cards</p></div></div><div ng-if="vm.loading" class="row"><div class="col-md-12 text-center"><p>Loading cards...</p></div></div><div ng-if="!vm.loading" class="row"><div class="col-md-4"><h4>Card List ({{vm.cards.length}})</h4><card-switcher cards="vm.cards" selected-card="vm.selectedCard" on-select="vm.selectCard(card)"></card-switcher></div><div class="col-md-8"><card-details card="vm.selectedCard" analytics="vm.selectedCardAnalytics"></card-details></div></div>
