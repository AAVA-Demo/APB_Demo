<div class="card-management-container">
  <div class="page-header">
    <h2>My Credit Cards</h2>
    <p class="text-muted">Manage and view all your registered credit cards</p>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <i class="fa fa-spinner fa-spin fa-3x"></i>
    <p>Loading cards...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger" role="alert">
    <i class="fa fa-exclamation-triangle"></i> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <card-list cards="vm.cards" on-select="vm.selectCard(cardId)"></card-list>
  </div>
</div>
