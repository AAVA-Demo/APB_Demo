<div class="dashboard-container">
  <div class="page-header">
    <h1>Credit Card Dashboard</h1>
    <button class="btn btn-primary" ng-click="vm.refreshData()" ng-disabled="vm.loading">
      <i class="glyphicon glyphicon-refresh"></i> Refresh
    </button>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-md-3">
      <kpi-widget label="Monthly Spend" value="vm.kpiData.monthlySpend" icon="glyphicon-credit-card"></kpi-widget>
    </div>
    <div class="col-md-3">
      <kpi-widget label="Total Credit Limit" value="vm.kpiData.totalCreditLimit" icon="glyphicon-stats"></kpi-widget>
    </div>
    <div class="col-md-3">
      <kpi-widget label="Available Credit" value="vm.kpiData.availableCredit" icon="glyphicon-ok-circle"></kpi-widget>
    </div>
    <div class="col-md-3">
      <kpi-widget label="Outstanding Amount" value="vm.kpiData.outstandingAmount" icon="glyphicon-exclamation-sign"></kpi-widget>
    </div>
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row" style="margin-top: 20px;">
    <div class="col-md-12">
      <div class="panel panel-info">
        <div class="panel-heading">
          <h3 class="panel-title">Credit Utilization</h3>
        </div>
        <div class="panel-body">
          <h2>{{vm.kpiData.creditUtilization}}%</h2>
          <div class="progress">
            <div class="progress-bar" role="progressbar" ng-style="{'width': vm.kpiData.creditUtilization + '%'}" aria-valuenow="{{vm.kpiData.creditUtilization}}" aria-valuemin="0" aria-valuemax="100">
              {{vm.kpiData.creditUtilization}}%
            </div>
          </div>
          <p class="text-muted">Last updated: {{vm.kpiData.lastUpdated | date:'short'}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
