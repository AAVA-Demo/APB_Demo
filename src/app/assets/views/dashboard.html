<div class="dashboard-container">
  <div class="page-header">
    <h2>Credit Card Dashboard</h2>
    <p class="text-muted" ng-if="vm.lastUpdated">Last updated: {{vm.lastUpdated | date:'medium'}}</p>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <i class="fa fa-spinner fa-spin fa-3x"></i>
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger" role="alert">
    <i class="fa fa-exclamation-triangle"></i> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error && vm.kpis" class="kpi-grid">
    <div class="row">
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="Monthly Spend" value="vm.kpis.monthlySpend" icon="fa-credit-card" color="kpi-blue"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="fa-money" color="kpi-green"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="Available Credit" value="vm.kpis.availableCredit" icon="fa-check-circle" color="kpi-purple"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="fa-exclamation-circle" color="kpi-red"></kpi-card>
      </div>
    </div>
    <div class="row" style="margin-top: 20px;">
      <div class="col-xs-12 col-md-6">
        <div class="info-panel">
          <h4>Total Cards</h4>
          <p class="info-value">{{vm.kpis.cardCount}}</p>
        </div>
      </div>
      <div class="col-xs-12 col-md-6">
        <div class="info-panel">
          <h4>Top Spending Category</h4>
          <p class="info-value">{{vm.kpis.topSpendingCategory}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
