<div class="analytics-container">
  <div class="page-header">
    <h1>Spending Analytics</h1>
    <div class="btn-group">
      <button class="btn btn-default" ng-click="vm.updateTimeRange(3)">3 Months</button>
      <button class="btn btn-default" ng-click="vm.updateTimeRange(6)">6 Months</button>
      <button class="btn btn-default" ng-click="vm.updateTimeRange(12)">12 Months</button>
    </div>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <i class="glyphicon glyphicon-refresh spinning"></i> Loading analytics...
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">Total Spend: {{vm.analyticsData.totalSpend | currency}}</h3>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-primary">
          <div class="panel-heading">
            <h3 class="panel-title">Monthly Spend Trends</h3>
          </div>
          <div class="panel-body" style="height: 400px;">
            <spending-chart data="vm.analyticsData"></spending-chart>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-success">
          <div class="panel-heading">
            <h3 class="panel-title">Category-Wise Spending Breakdown</h3>
          </div>
          <div class="panel-body" style="height: 400px;">
            <category-breakdown data="vm.analyticsData"></category-breakdown>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-info">
          <div class="panel-heading">
            <h3 class="panel-title">Category Details</h3>
          </div>
          <div class="panel-body">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Amount</th>
                  <th>Percentage</th>
                </tr>
              </thead>
              <tbody>
                <tr ng-repeat="cat in vm.analyticsData.categoryBreakdown">
                  <td>{{cat.category}}</td>
                  <td>{{cat.amount | currency}}</td>
                  <td>{{cat.percentage}}%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
