<div class="card-detail-container">
  <div class="page-header">
    <button class="btn btn-default" ng-click="vm.goBack()">
      <i class="fa fa-arrow-left"></i> Back to Cards
    </button>
    <h2>Card Details</h2>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <i class="fa fa-spinner fa-spin fa-3x"></i>
    <p>Loading card details...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger" role="alert">
    <i class="fa fa-exclamation-triangle"></i> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <card-detail card="vm.cardDetail"></card-detail>
  </div>
</div>
