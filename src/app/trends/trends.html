<div class="trends-container">
<h2>Monthly Spend Trends</h2>
<div class="filter-panel">
<div class="row">
<div class="col-md-3 col-sm-6">
<label>Start Date</label>
<input type="date" class="form-control" ng-model="vm.startDate" ng-change="vm.onFilterChange()">
</div>
<div class="col-md-3 col-sm-6">
<label>End Date</label>
<input type="date" class="form-control" ng-model="vm.endDate" ng-change="vm.onFilterChange()">
</div>
<div class="col-md-3 col-sm-6">
<label>Filter by Card</label>
<select class="form-control" ng-model="vm.selectedCard" ng-change="vm.onFilterChange()">
<option value="">All Cards</option>
<option ng-repeat="card in vm.creditCards" value="{{card.cardId}}">{{card.cardName}}</option>
</select>
</div>
</div>
</div>
<div ng-if="vm.loading" class="text-center">
<p>Loading trend data...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">
<strong>Error:</strong> {{vm.error}}
</div>
<div ng-if="!vm.loading && !vm.error" class="chart-container">
<div style="height:400px">
<spend-trend-chart trend-data="vm.trendData" chart-type="line"></spend-trend-chart>
</div>
</div>
</div>
