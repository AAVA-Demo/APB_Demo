<div class="panel panel-primary kpi-card">
  <div class="panel-heading">
    <h3 class="panel-title">
      <span class="glyphicon" ng-class="$ctrl.icon"></span>
      {{$ctrl.title}}
    </h3>
  </div>
  <div class="panel-body">
    <h2 ng-if="$ctrl.value !== 'N/A'">${{$ctrl.value | number:2}}</h2>
    <h2 ng-if="$ctrl.value === 'N/A'">{{$ctrl.value}}</h2>
  </div>
</div>
