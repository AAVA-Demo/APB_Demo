<div class="row"><div class="col-md-12"><h2>Spending Insights</h2><div ng-if="vm.loading"><p>Loading insights...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error && vm.insightsData"><div class="row"><div class="col-md-12"><div class="kpi-card"><h4>Top Spending Categories</h4><p ng-repeat="cat in vm.insightsData.topSpendingCategories">{{cat}}</p><p><em>{{vm.insightsData.spendingPatterns}}</em></p></div></div></div><div class="row"><div class="col-md-12"><visualization data="vm.insightsData.monthlyTrends" chart-type="line" title="Monthly Spend Trends" on-drill-down="vm.drillDown(category)"></visualization></div></div><div class="row"><div class="col-md-12"><visualization data="vm.insightsData.categoryBreakdown" chart-type="pie" title="Category-wise Spending Breakdown" on-drill-down="vm.drillDown(category)"></visualization></div></div><div ng-if="vm.selectedCategory" class="row"><div class="col-md-12"><div class="alert alert-info">Drill-down for category: <strong>{{vm.selectedCategory}}</strong></div></div></div></div></div></div>
