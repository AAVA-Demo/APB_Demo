<div class="row">
<div class="col-md-12">
<h2>My Credit Cards</h2>
<div ng-if="vm.loading" class="loading-spinner">
<i class="glyphicon glyphicon-refresh spinning"></i> Loading cards...
</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error">
<div class="row">
<div class="col-md-4" ng-repeat="card in vm.cards track by card.cardId">
<card-summary card="card" on-select="vm.selectCard(cardId)"></card-summary>
</div>
</div>
</div>
</div>
</div>
