<div class="card-list-container">
<div class="page-header">
<h1>My Credit Cards</h1>
</div>
<div ng-if="vm.loading" class="text-center"><p>Loading credit cards...</p></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error">
<div class="row" style="margin-bottom:20px;">
<div class="col-md-6">
<input type="text" class="form-control" placeholder="Search cards..." ng-model="vm.filterText">
</div>
<div class="col-md-3">
<select class="form-control" ng-model="vm.sortBy">
<option value="cardHolderName">Sort by Name</option>
<option value="creditLimit">Sort by Credit Limit</option>
<option value="currentBalance">Sort by Balance</option>
</select>
</div>
<div class="col-md-3">
<p class="text-right"><strong>Total Cards:</strong> {{vm.filteredCards.length}}</p>
</div>
</div>
<div class="row">
<div class="col-md-12">
<div class="alert alert-info">
<strong>Portfolio Summary:</strong> Total Credit Limit: ${{vm.portfolio.totalCreditLimit | number:2}} | Total Outstanding: ${{vm.portfolio.totalOutstanding | number:2}}
</div>
</div>
</div>
<div class="row">
<div class="col-md-4" ng-repeat="card in vm.filteredCards track by card.cardId">
<card-list-item card="card"></card-list-item>
</div>
</div>
<div ng-if="vm.filteredCards.length===0" class="text-center">
<p>No credit cards found.</p>
</div>
</div>
</div>
