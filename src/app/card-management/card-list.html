<div class="card-list-container"><h2>My Credit Cards</h2><div ng-if="vm.loading" class="text-center"><p>Loading cards...</p></div><div ng-if="vm.error" class="alert alert-danger alert-custom">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error" class="row"><div class="col-md-4 col-sm-6" ng-repeat="card in vm.cards"><card-tile card="card" on-select="vm.selectCard(card.cardId)"></card-tile></div></div><div ng-if="!vm.loading&&!vm.error&&vm.cards.length===0" class="text-center"><p>No credit cards found.</p></div></div>
