<div class="row">
  <div class="col-md-12">
    <h2>My Credit Cards</h2>
    <p class="text-muted">Manage all your credit cards in one place</p>
  </div>
</div>
<div ng-if="vm.loading" class="loading-spinner">
  <i class="glyphicon glyphicon-refresh spinning"></i> Loading cards...
</div>
<div ng-if="vm.error && !vm.loading" class="alert alert-danger error-alert">
  <strong>Error!</strong> Unable to load credit cards. Please try again later.
</div>
<div ng-if="!vm.loading && !vm.error" class="row">
  <div class="col-md-12">
    <card-selector cards="vm.cards" selected-card="vm.selectedCard" on-select="vm.selectCard(card)"></card-selector>
  </div>
</div>
