<div><h2>My Credit Cards</h2><div ng-if="vm.isLoading" class="loading">Loading cards...</div><div ng-if="vm.error" class="error">{{vm.error}}</div><div ng-if="!vm.isLoading&&!vm.error"><div class="row" style="margin-bottom:20px"><div class="col-md-6"><div class="kpi-card"><h3>${{vm.portfolio.totalCreditLimit|number:2}}</h3><p>Total Credit Limit</p></div></div><div class="col-md-6"><div class="kpi-card"><h3>${{vm.portfolio.totalOutstanding|number:2}}</h3><p>Total Outstanding</p></div></div></div><div card-item ng-repeat="card in vm.portfolio.cards" card-data="card" on-select="vm.selectCard(card.id)"></div></div></div>
