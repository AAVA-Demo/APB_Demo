<div class="row"><div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in cards"><div class="card-item" ng-click="onSelect({card:card})"><h4>{{card.bankName}} {{card.cardType}}</h4><p><strong>****{{card.cardNumber.slice(-4)}}</strong></p><div class="row"><div class="col-xs-6"><small class="text-muted">Balance</small><br><strong>${{card.outstandingAmount|number:2}}</strong></div><div class="col-xs-6"><small class="text-muted">Available</small><br><strong>${{card.availableCredit|number:2}}</strong></div></div></div></div></div>
