<div class="row">
  <div class="col-xs-12">
    <button class="btn btn-default" ng-click="vm.backToList()">
      <span class="glyphicon glyphicon-arrow-left"></span> Back to Cards
    </button>
  </div>
</div>
<div class="row" style="margin-top: 20px;">
  <div class="col-xs-12 col-md-6">
    <card-detail card="vm.selectedCard"></card-detail>
  </div>
  <div class="col-xs-12 col-md-6">
    <div class="kpi-card">
      <h4>Utilization Rate</h4>
      <div class="progress" style="height: 30px;">
        <div class="progress-bar" role="progressbar" 
             ng-style="{width: vm.selectedCard.utilizationRate + '%'}" 
             ng-class="{'progress-bar-success': vm.selectedCard.utilizationRate < 30, 'progress-bar-warning': vm.selectedCard.utilizationRate >= 30 && vm.selectedCard.utilizationRate < 70, 'progress-bar-danger': vm.selectedCard.utilizationRate >= 70}">
          {{ vm.selectedCard.utilizationRate }}%
        </div>
      </div>
    </div>
    <div class="kpi-card" style="margin-top: 20px;">
      <h4>Recent Transactions</h4>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Date</th>
            <th>Merchant</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="txn in vm.selectedCard.recentTransactions">
            <td>{{ txn.date | date:'short' }}</td>
            <td>{{ txn.merchant }}</td>
            <td>{{ txn.amount | currency:"₹":0 }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
