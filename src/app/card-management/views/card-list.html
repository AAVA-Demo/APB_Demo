<div class="row">
  <div class="col-xs-12">
    <h2>My Credit Cards</h2>
    <p class="text-muted">View and manage all your credit cards</p>
  </div>
</div>
<div ng-if="vm.loading" class="row">
  <div class="col-xs-12 text-center">
    <p>Loading cards...</p>
  </div>
</div>
<div ng-if="vm.error" class="row">
  <div class="col-xs-12">
    <div class="alert alert-danger">{{ vm.error }}</div>
  </div>
</div>
<div ng-if="!vm.loading && !vm.error" class="row">
  <div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in vm.cards track by card.cardId">
    <div class="card-item" ng-click="vm.selectCard(card.cardId)">
      <h4>{{ card.issuer }}</h4>
      <p class="masked-number">{{ card.maskedCardNumber }}</p>
      <p><small>{{ card.cardType }} • Exp: {{ card.expiryDate }}</small></p>
      <hr>
      <div class="row">
        <div class="col-xs-6">
          <small><strong>Limit:</strong></small><br>
          <span>{{ card.creditLimit | currency:"₹":0 }}</span>
        </div>
        <div class="col-xs-6">
          <small><strong>Available:</strong></small><br>
          <span>{{ card.availableCredit | currency:"₹":0 }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
