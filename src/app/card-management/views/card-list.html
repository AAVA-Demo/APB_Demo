<div class="card-list-container"><h2>My Credit Cards</h2><div ng-if="vm.loading" class="text-center"><p>Loading your credit cards...</p></div><div ng-if="vm.error" class="error-message">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><div class="row"><div class="col-md-4 col-sm-6" ng-repeat="card in vm.cards"><card-tile card="card" on-select="vm.selectCard(cardId)"></card-tile></div></div><div ng-if="vm.cards.length===0" class="alert alert-info">No credit cards found. Please add a card to get started.</div></div></div>
