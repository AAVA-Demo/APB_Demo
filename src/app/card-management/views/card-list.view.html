<div class="row">
  <div class="col-md-12">
    <h2>My Credit Cards</h2>
    <p class="text-muted">Manage and view all your registered credit cards</p>
  </div>
</div>
<div ng-if="vm.loading" class="loading">
  <div class="spinner"><i class="glyphicon glyphicon-refresh glyphicon-spin"></i> Loading cards...</div>
</div>
<div ng-if="vm.error" class="alert alert-danger">{{ vm.error }}</div>
<div ng-if="!vm.loading && !vm.error">
  <card-list cards="vm.cards" on-select="vm.selectCard(cardId)"></card-list>
</div>
