<h2>My Credit Cards</h2><card-filter filters="vm.filters" on-change="vm.onFilterChange()"></card-filter><div ng-if="vm.loading" class="text-center"><h3>Loading cards...</h3></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error" class="row"><div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in vm.filteredCards track by card.cardId"><card-tile card="card" on-select="vm.onCardSelect(cardId)"></card-tile></div><div ng-if="vm.filteredCards.length===0" class="col-xs-12"><p class="text-center">No cards found matching your filters.</p></div></div>
