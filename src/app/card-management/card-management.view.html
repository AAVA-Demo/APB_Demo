<div ng-if="vm.loading" class="loading-spinner"><i class="glyphicon glyphicon-refresh spinning"></i> Loading cards...</div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><div ng-if="!vm.selectedCard"><h2>My Credit Cards</h2><card-list-view cards="vm.cards" on-select="vm.selectCard(card)"></card-list-view></div><div ng-if="vm.selectedCard"><card-details-view card="vm.selectedCard" on-back="vm.backToList()"></card-details-view></div></div>
