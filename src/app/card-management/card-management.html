<div class="card-management-container">
  <div class="row">
    <div class="col-md-12">
      <h2>My Credit Cards</h2>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6">
      <input type="text" class="form-control" placeholder="Search by card name or last 4 digits" ng-model="vm.searchText">
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">{{ vm.error }}</div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading cards...</p>
  </div>
  <div ng-if="!vm.loading && vm.cards.length === 0" class="alert alert-info">
    No credit cards found.
  </div>
  <div ng-if="!vm.loading && vm.cards.length > 0" class="row card-list">
    <div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in vm.cards | cardFilter:vm.searchText track by card.cardId">
      <card-list-item card="card" on-select="vm.selectCard(card.cardId)"></card-list-item>
    </div>
  </div>
</div>
