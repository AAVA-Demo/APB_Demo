<div class="row">
  <div class="col-md-12">
    <h2>My Credit Cards</h2>
    <p class="text-muted">Manage and monitor all your credit cards</p>
    <button class="btn btn-primary" ng-click="vm.toggleComparison()">{{vm.comparisonMode ? 'Exit Comparison' : 'Compare Cards'}}</button>
  </div>
</div>
<div class="row" style="margin-top: 20px;">
  <div class="col-md-4">
    <card-switcher cards="vm.cards" selected-card="vm.selectedCard" on-select="vm.selectCard" comparison-mode="vm.comparisonMode" selected-for-comparison="vm.selectedForComparison"></card-switcher>
    <button class="btn btn-success btn-block" ng-if="vm.comparisonMode && vm.selectedForComparison.length >= 2" ng-click="vm.compareSelected()">Compare Selected</button>
  </div>
  <div class="col-md-8">
    <card-detail card="vm.selectedCard" spending="vm.cardSpending" ng-if="vm.selectedCard && !vm.comparisonMode"></card-detail>
    <div ng-if="vm.comparisonMode && vm.comparisonResults.length > 0">
      <h3>Card Comparison</h3>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Card</th>
            <th>Utilization Rate</th>
            <th>Monthly Spend</th>
            <th>Available Credit</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="result in vm.comparisonResults">
            <td>{{result.cardName}}</td>
            <td>{{result.utilizationRate}}%</td>
            <td>{{result.monthlySpend | currency:'₹'}}</td>
            <td>{{result.availableCredit | currency:'₹'}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
