<div class="row">
  <div class="col-md-4 col-sm-6" ng-repeat="card in cards | filter:filter() track by card.cardId">
    <div class="card-item" ng-click="onSelect({cardId: card.cardId})">
      <div class="card-number">{{card.cardNumber}}</div>
      <p><strong>{{card.cardType}}</strong> - {{card.issuerName}}</p>
      <p>Credit Limit: <strong>{{card.creditLimit | currency}}</strong></p>
      <p>Balance: <strong>{{card.currentBalance | currency}}</strong></p>
    </div>
  </div>
</div>
