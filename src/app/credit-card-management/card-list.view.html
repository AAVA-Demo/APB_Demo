<div class="row">
  <div class="col-md-12">
    <h2>My Credit Cards</h2>
    <p class="text-muted">Manage and view all your credit cards</p>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="filter-section">
      <input type="text" class="form-control" placeholder="Search by card number, type, or holder name..." ng-model="vm.searchText">
    </div>
  </div>
</div>
<div ng-if="vm.loading" class="loading-spinner">
  <i class="glyphicon glyphicon-refresh glyphicon-spin" style="font-size:48px;"></i>
  <p>Loading cards...</p>
</div>
<div ng-if="vm.error" class="error-message">
  <strong>Error:</strong> {{vm.error}}
</div>
<div ng-if="!vm.loading && !vm.error" class="row">
  <div class="col-md-4 col-sm-6" ng-repeat="card in vm.filteredCards track by card.cardId">
    <card-tile card="card" on-select="vm.selectCard(cardId)"></card-tile>
  </div>
  <div class="col-md-12" ng-if="vm.filteredCards.length === 0">
    <p class="text-center text-muted">No cards found matching your search.</p>
  </div>
</div>
