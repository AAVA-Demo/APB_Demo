<div class="card-details-container">
  <div class="page-header">
    <h1>Card Details</h1>
    <a href="#/cards" class="btn btn-default">Back to Card List</a>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner">
      <i class="glyphicon glyphicon-refresh spinning"></i> Loading card details...
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger" role="alert">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <card-details-view card="vm.selectedCard" spending="vm.cardSpending" ng-if="!vm.loading && !vm.error"></card-details-view>
</div>
