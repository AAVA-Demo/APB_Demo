<div class="portfolio-view"><div class="row"><div class="col-md-12"><h1>Credit Card Portfolio</h1></div></div><div ng-if="vm.loading" class="loading-overlay"><div class="spinner"></div></div><div ng-if="vm.error" class="error-message">{{vm.error}}</div><div ng-if="vm.portfolioData && !vm.loading"><div class="row"><div class="col-md-12"><div class="kpi-card"><h3>Portfolio Summary</h3><div class="row"><div class="col-sm-4"><p><strong>Total Credit Limit:</strong> {{vm.portfolioData.totalCreditLimit|currency}}</p></div><div class="col-sm-4"><p><strong>Total Available Credit:</strong> {{vm.portfolioData.totalAvailableCredit|currency}}</p></div><div class="col-sm-4"><p><strong>Total Outstanding:</strong> {{vm.portfolioData.totalOutstanding|currency}}</p></div></div></div></div></div><div class="row"><div class="col-md-4" ng-repeat="card in vm.portfolioData.cards"><card-details-card card="card" spending="vm.getCardSpending(card.cardId)" on-select="vm.toggleCardSelection(card)" selected="vm.isCardSelected(card)"></card-details-card></div></div><div class="row" ng-if="vm.comparisonMode"><div class="col-md-12"><card-comparison-widget cards="vm.selectedCards" spending="vm.portfolioData.cardSpending"></card-comparison-widget></div></div></div></div>
