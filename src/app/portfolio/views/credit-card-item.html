<div class="card-item"><h4>{{card.cardName}}</h4><div class="card-number">{{card.cardNumber}}</div><p><strong>Type:</strong> {{card.cardType}}</p><p><strong>Credit Limit:</strong> ${{card.creditLimit|number:2}}</p><p><strong>Available:</strong> ${{card.availableCredit|number:2}}</p><p><strong>Outstanding:</strong> ${{card.outstandingBalance|number:2}}</p><p><strong>Status:</strong> <span class="label" ng-class="{'label-success':card.status==='Active','label-danger':card.status==='Blocked'}">{{card.status}}</span></p></div>
