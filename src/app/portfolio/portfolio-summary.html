<div class="panel panel-info">
<div class="panel-heading"><h4>Portfolio Summary</h4></div>
<div class="panel-body">
<div class="row">
<div class="col-sm-3"><strong>Total Cards:</strong> {{summary.totalCards}}</div>
<div class="col-sm-3"><strong>Total Limit:</strong> ${{summary.totalCreditLimit}}</div>
<div class="col-sm-3"><strong>Available:</strong> ${{summary.totalAvailableCredit}}</div>
<div class="col-sm-3"><strong>Outstanding:</strong> ${{summary.totalOutstandingAmount}}</div>
</div>
<div class="row" style="margin-top:10px;">
<div class="col-sm-12"><strong>Utilization Rate:</strong> {{summary.utilizationRate}}%</div>
</div>
</div>
</div>
