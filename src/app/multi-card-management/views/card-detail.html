<div class="row"><div class="col-md-12"><h2>Card Details</h2></div></div><div class="row" ng-if="!vm.loading&&vm.card"><div class="col-md-6"><card-detail-card card="vm.card"></card-detail-card></div><div class="col-md-6" ng-if="vm.spendAnalysis"><h3>Spending Analysis</h3><p><strong>Total Spend:</strong> {{vm.spendAnalysis.totalSpend|currency}}</p><h4>Category Breakdown</h4><ul><li ng-repeat="cat in vm.spendAnalysis.categoryBreakdown">{{cat.category}}: {{cat.amount|currency}}</li></ul></div></div><div class="row" ng-if="vm.loading"><div class="col-md-12 text-center"><p>Loading card details...</p></div></div>
