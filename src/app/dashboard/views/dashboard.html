<div class="dashboard-container">
  <h2>Credit Card Dashboard</h2>
  <div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Monthly Spend" value="{{vm.kpis.monthlySpend | currencyFormat}}" icon="glyphicon-shopping-cart"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Total Credit Limit" value="{{vm.kpis.totalCreditLimit | currencyFormat}}" icon="glyphicon-credit-card"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Available Credit" value="{{vm.kpis.availableCredit | currencyFormat}}" icon="glyphicon-ok-circle"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Outstanding Amount" value="{{vm.kpis.outstandingAmount | currencyFormat}}" icon="glyphicon-exclamation-sign"></kpi-card>
    </div>
  </div>
  <div class="row" style="margin-top:20px;">
    <div class="col-xs-12">
      <p class="text-muted">Last updated: {{vm.kpis.lastUpdated | date:'short'}}</p>
    </div>
  </div>
</div>
