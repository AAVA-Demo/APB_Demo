<div class="dashboard-view">
<div class="row">
<div class="col-md-12">
<h2>Dashboard
<button class="btn btn-primary btn-sm pull-right refresh-btn" ng-click="vm.refresh()" ng-disabled="vm.loading">
<span class="glyphicon glyphicon-refresh" ng-class="{'glyphicon-refresh-animate':vm.loading}"></span>
Refresh
</button>
</h2>
</div>
</div>
<div class="alert alert-danger" ng-if="vm.error">
{{vm.error}}
</div>
<div class="row" ng-if="!vm.loading&&vm.kpis">
<div class="col-md-3 col-sm-6">
<kpi-widget label="Monthly Spend" value="vm.kpis.monthlySpend" icon="glyphicon-shopping-cart" format="currency"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="glyphicon-credit-card" format="currency"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget label="Available Credit" value="vm.kpis.availableCredit" icon="glyphicon-ok-circle" format="currency"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget label="Outstanding Amount" value="vm.kpis.totalOutstanding" icon="glyphicon-exclamation-sign" format="currency"></kpi-widget>
</div>
</div>
<div class="row" ng-if="vm.loading">
<div class="col-md-12 text-center">
<p><span class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></span> Loading dashboard...</p>
</div>
</div>
<div class="row" ng-if="!vm.loading&&vm.kpis">
<div class="col-md-12">
<p class="text-muted text-right"><small>Last updated: {{vm.kpis.lastUpdated|date:'medium'}}</small></p>
</div>
</div>
</div>
