<div class="dashboard-container">
  <h2>Credit Card Dashboard</h2>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="row kpi-section">
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" icon="glyphicon-credit-card" format="currency"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="glyphicon-piggy-bank" format="currency"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card label="Available Credit" value="vm.kpis.availableCredit" icon="glyphicon-ok-circle" format="currency"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="glyphicon-exclamation-sign" format="currency"></kpi-card>
      </div>
    </div>
    <div class="row cards-section">
      <div class="col-xs-12">
        <h3>Your Credit Cards</h3>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in vm.cards track by card.cardId">
        <card-summary card="card"></card-summary>
      </div>
    </div>
  </div>
</div>
