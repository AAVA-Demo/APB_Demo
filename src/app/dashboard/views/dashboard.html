<div class="dashboard-container"><h2>Credit Card Dashboard</h2><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="vm.error" class="error-message">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><div class="row"><div class="col-md-3 col-sm-6"><kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" icon="glyphicon-shopping-cart" format="currency"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="glyphicon-credit-card" format="currency"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Available Credit" value="vm.kpis.availableCredit" icon="glyphicon-ok-circle" format="currency"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="glyphicon-exclamation-sign" format="currency"></kpi-card></div></div><div class="row"><div class="col-md-12"><div class="kpi-card"><h4>Credit Utilization</h4><div class="progress" style="height:30px"><div class="progress-bar" ng-class="{'progress-bar-success':vm.kpis.utilizationRate<30,'progress-bar-warning':vm.kpis.utilizationRate>=30&&vm.kpis.utilizationRate<70,'progress-bar-danger':vm.kpis.utilizationRate>=70}" role="progressbar" ng-style="{width:vm.kpis.utilizationRate+'%'}">{{vm.kpis.utilizationRate}}%</div></div></div></div></div><div class="text-right text-muted" ng-if="vm.lastUpdated"><small>Last updated: {{vm.lastUpdated|date:'short'}}</small></div></div></div>
