<div class="row"><div class="col-md-12"><h2>Financial Dashboard</h2><p class="text-muted">Real-time overview of your credit card portfolio</p></div></div><div ng-if="vm.loading" class="row"><div class="col-md-12 text-center"><p>Loading dashboard...</p></div></div><div ng-if="!vm.loading" class="row"><div class="col-md-3 col-sm-6"><kpi-widget title="Monthly Spend" value="vm.kpi.monthlySpend" format="currency"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget title="Total Credit Limit" value="vm.kpi.totalCreditLimit" format="currency"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget title="Available Credit" value="vm.kpi.availableCredit" format="currency"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget title="Outstanding Amount" value="vm.kpi.outstandingAmount" format="currency"></kpi-widget></div></div><div ng-if="!vm.loading" class="row" style="margin-top:20px;"><div class="col-md-12"><div class="kpi-widget"><h3>Credit Utilization</h3><div class="progress" style="height:30px;margin-top:10px;"><div class="progress-bar" role="progressbar" ng-style="{width:vm.kpi.creditUtilization+'%'}" aria-valuenow="{{vm.kpi.creditUtilization}}" aria-valuemin="0" aria-valuemax="100">{{vm.kpi.creditUtilization}}%</div></div></div></div></div>
