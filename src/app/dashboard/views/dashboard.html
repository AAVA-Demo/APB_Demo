<div class="dashboard-view"><div class="row"><div class="col-md-12"><h1>Credit Card Dashboard</h1><dashboard-refresh on-refresh="vm.refresh()"></dashboard-refresh></div></div><div ng-if="vm.loading" class="loading-overlay"><div class="spinner"></div></div><div ng-if="vm.error" class="error-message">{{vm.error}}</div><div ng-if="vm.kpiData && !vm.loading"><div class="row"><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Monthly Spend" value="vm.kpiData.monthlySpend" format="currency" icon="glyphicon-usd"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Total Credit Limit" value="vm.kpiData.totalCreditLimit" format="currency" icon="glyphicon-credit-card"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Available Credit" value="vm.kpiData.availableCredit" format="currency" icon="glyphicon-ok-circle"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Outstanding Amount" value="vm.kpiData.totalOutstanding" format="currency" icon="glyphicon-exclamation-sign"></kpi-card></div></div><div class="row"><div class="col-md-12"><div class="kpi-card"><h3>Credit Utilization</h3><div class="progress" style="height:30px;margin-top:15px"><div class="progress-bar" ng-class="{'progress-bar-success':vm.kpiData.creditUtilization<30,'progress-bar-warning':vm.kpiData.creditUtilization>=30&&vm.kpiData.creditUtilization<70,'progress-bar-danger':vm.kpiData.creditUtilization>=70}" role="progressbar" ng-style="{width:vm.kpiData.creditUtilization+'%'}">{{vm.kpiData.creditUtilization}}%</div></div><p style="margin-top:10px;color:#666">Last Updated: {{vm.kpiData.lastUpdated|date:'short'}}</p></div></div></div></div></div>
