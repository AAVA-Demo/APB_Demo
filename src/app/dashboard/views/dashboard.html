<div class="dashboard-container">
  <div class="page-header">
    <h1>Credit Card Dashboard</h1>
    <p class="text-muted">Monitor your credit card portfolio and key financial metrics</p>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner">
      <i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger" role="alert">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <dashboard-summary kpi-data="vm.kpiData" ng-if="!vm.loading && !vm.error"></dashboard-summary>
</div>
