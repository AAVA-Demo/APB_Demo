<div class="dashboard-container">
  <h2>Credit Card Dashboard</h2>
  <div ng-if="vm.loading" class="loading-spinner">
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="error-message">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" icon="💳"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="💰"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Available Credit" value="vm.kpis.availableCredit" icon="✓"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="⚠"></kpi-card>
    </div>
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-md-12">
      <div class="kpi-card">
        <p><strong>Credit Utilization:</strong> {{vm.kpis.utilizationPercentage}}%</p>
        <p><small>Last updated: {{vm.kpis.lastUpdated | date:'short'}}</small></p>
      </div>
    </div>
  </div>
</div>
