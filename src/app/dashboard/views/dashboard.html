<div><h2>Credit Card Dashboard</h2><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="vm.kpis" class="row"><div class="col-md-3 col-sm-6"><kpi-card label="Monthly Spend" value="₹{{vm.kpis.monthlySpend | number:0}}"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Total Credit Limit" value="₹{{vm.kpis.totalCreditLimit | number:0}}"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Available Credit" value="₹{{vm.kpis.availableCredit | number:0}}"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Outstanding Amount" value="₹{{vm.kpis.outstandingAmount | number:0}}"></kpi-card></div></div><div ng-if="vm.kpis" class="row"><div class="col-md-12"><div class="kpi-card"><h3>Additional Metrics</h3><p><strong>Credit Utilization:</strong> {{vm.kpis.creditUtilization}}%</p><p><strong>Total Cards:</strong> {{vm.kpis.totalCards}}</p><p><strong>Last Updated:</strong> {{vm.kpis.lastRefreshTimestamp | date:'medium'}}</p></div></div></div><div class="row" style="margin-top:20px"><div class="col-md-6"><a href="#!/cards" class="btn btn-primary btn-block">Manage Cards</a></div><div class="col-md-6"><a href="#!/analytics" class="btn btn-info btn-block">View Analytics</a></div></div></div>
