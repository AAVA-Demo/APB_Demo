<div class="row"><div class="col-md-12"><h1 class="page-header">Credit Card Dashboard</h1></div></div><div ng-if="vm.loading" class="loading-spinner"><i class="fa fa-spinner fa-spin"></i> Loading...</div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-3 col-sm-6"><kpi-widget label="Monthly Spend" value="vm.kpis.totalMonthlySpend" icon="fa-credit-card" format="currency"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="fa-bank" format="currency"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget label="Available Credit" value="vm.kpis.totalAvailableCredit" icon="fa-money" format="currency"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget label="Outstanding Amount" value="vm.kpis.totalOutstanding" icon="fa-exclamation-circle" format="currency"></kpi-widget></div></div><div class="row"><div class="col-md-12"><credit-card-summary cards="vm.cards"></credit-card-summary></div></div></div>
