<div class="row"><div class="col-md-12"><h2>Credit Card Dashboard</h2></div></div><div class="row" ng-if="!vm.loading&&vm.kpiData"><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Monthly Spend" value="vm.kpiData.monthlySpend"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Total Credit Limit" value="vm.kpiData.totalCreditLimit"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Available Credit" value="vm.kpiData.availableCredit"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card title="Outstanding Amount" value="vm.kpiData.outstandingAmount"></kpi-card></div></div><div class="row" ng-if="vm.loading"><div class="col-md-12 text-center"><p>Loading dashboard data...</p></div></div><div class="row" ng-if="!vm.loading&&vm.kpiData"><div class="col-md-12"><h3>My Credit Cards</h3><div ng-repeat="card in vm.kpiData.cards" class="card-item"><strong>{{card.cardType}}</strong> - {{card.cardNumber}}<br><small>Limit: {{card.creditLimit|currency}} | Available: {{card.availableCredit|currency}}</small></div></div></div>
