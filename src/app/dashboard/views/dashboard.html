<div class="dashboard-container">
  <div ng-if="vm.loading" class="text-center">
    <h3>Loading dashboard...</h3>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{vm.error}}
    <button class="btn btn-sm btn-primary pull-right" ng-click="vm.retry()">Retry</button>
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <h2>Credit Card Portfolio Dashboard</h2>
    <div class="row">
      <div class="col-lg-3 col-md-6 col-sm-12">
        <kpi-widget title="'Monthly Spend'" value="vm.kpis.monthlySpend" format="'currency'"></kpi-widget>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <kpi-widget title="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" format="'currency'"></kpi-widget>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <kpi-widget title="'Available Credit'" value="vm.kpis.totalAvailableCredit" format="'currency'"></kpi-widget>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <kpi-widget title="'Outstanding Amount'" value="vm.kpis.totalOutstanding" format="'currency'"></kpi-widget>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <h3>Your Credit Cards</h3>
        <credit-card-list cards="vm.cards"></credit-card-list>
      </div>
    </div>
  </div>
</div>
