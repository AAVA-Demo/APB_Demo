<div ng-if="vm.loading" class="loading-spinner">
  <i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...
</div>
<div ng-if="vm.error" class="error-message">
  <i class="glyphicon glyphicon-exclamation-sign"></i> {{vm.error}}
</div>
<div ng-if="!vm.loading && !vm.error">
  <h2>Dashboard KPIs</h2>
  <div class="row">
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Monthly Spend" value="{{vm.kpis.monthlySpend | currency:'₹'}}" icon="glyphicon-shopping-cart"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Total Credit Limit" value="{{vm.kpis.totalCreditLimit | currency:'₹'}}" icon="glyphicon-credit-card"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Available Credit" value="{{vm.kpis.availableCredit | currency:'₹'}}" icon="glyphicon-ok-circle"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Outstanding Amount" value="{{vm.kpis.outstandingAmount | currency:'₹'}}" icon="glyphicon-warning-sign"></kpi-card>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <credit-utilization utilization="{{vm.kpis.creditUtilization}}"></credit-utilization>
    </div>
  </div>
  <p class="text-muted text-center">Last updated: {{vm.kpis.lastUpdated | date:'medium'}}</p>
</div>
