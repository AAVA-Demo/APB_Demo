<div><h2>Dashboard Overview</h2><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="!vm.loading" class="row"><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Monthly Spend" value="vm.kpis.monthlySpend"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Total Credit Limit" value="vm.kpis.totalCreditLimit"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Available Credit" value="vm.kpis.totalAvailableCredit"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Outstanding Amount" value="vm.kpis.totalOutstanding"></kpi-widget></div></div><div ng-if="!vm.loading" class="row"><div class="col-md-12"><div class="panel panel-default"><div class="panel-heading"><h4>Credit Health Summary</h4></div><div class="panel-body"><p><strong>Total Cards:</strong> {{vm.kpis.cardCount}}</p><p><strong>Last Updated:</strong> {{vm.kpis.lastRefreshed|date:'medium'}}</p></div></div></div></div></div>
