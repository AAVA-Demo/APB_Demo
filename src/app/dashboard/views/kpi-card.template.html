<div class="kpi-card panel panel-default">
  <div class="panel-body">
    <div class="kpi-icon">
      <i class="glyphicon" ng-class="icon"></i>
    </div>
    <div class="kpi-content">
      <h4 class="kpi-label">{{label}}</h4>
      <h2 class="kpi-value">{{formattedValue()}}</h2>
    </div>
  </div>
</div>
