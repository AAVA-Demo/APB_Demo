<div ng-controller="dashboardController as vm">
<h2>Dashboard Overview</h2>
<div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div>
<div ng-if="!vm.loading" class="row">
<div class="col-lg-3 col-md-6 col-sm-6">
<kpi-widget title="Total Credit Limit" value="₹{{vm.kpis.totalCreditLimit | number:0}}"></kpi-widget>
</div>
<div class="col-lg-3 col-md-6 col-sm-6">
<kpi-widget title="Total Outstanding" value="₹{{vm.kpis.totalOutstanding | number:0}}"></kpi-widget>
</div>
<div class="col-lg-3 col-md-6 col-sm-6">
<kpi-widget title="Available Credit" value="₹{{vm.kpis.totalAvailableCredit | number:0}}"></kpi-widget>
</div>
<div class="col-lg-3 col-md-6 col-sm-6">
<kpi-widget title="Monthly Spend" value="₹{{vm.kpis.totalMonthlySpend | number:0}}"></kpi-widget>
</div>
</div>
<div ng-if="!vm.loading" class="row">
<div class="col-md-12">
<div class="kpi-widget">
<h3>Portfolio Summary</h3>
<p>Total Cards: {{vm.kpis.cardCount}}</p>
<p>Credit Utilization: {{((vm.kpis.totalOutstanding/vm.kpis.totalCreditLimit)*100) | number:1}}%</p>
</div>
</div>
</div>
</div>
