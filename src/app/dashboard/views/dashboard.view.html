<div><div class="page-header"><h2>Credit Card Dashboard <button class="btn btn-sm btn-primary pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading"><i class="fa fa-refresh" ng-class="{'fa-spin': vm.loading}"></i> Refresh</button></h2></div><div ng-if="vm.error" class="alert alert-danger alert-dismissible"><button type="button" class="close" ng-click="vm.error=null">&times;</button>{{vm.error}} <button class="btn btn-sm btn-default" ng-click="vm.loadDashboard()">Retry</button></div><div ng-if="vm.loading && !vm.kpis.monthlySpend" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading dashboard...</p></div><div ng-if="!vm.loading || vm.kpis.monthlySpend"><h3>Key Performance Indicators</h3><div class="row"><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card label="Monthly Spend" value="{{vm.kpis.monthlySpend}}" icon="fa-credit-card"></kpi-card></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card label="Total Credit Limit" value="{{vm.kpis.totalCreditLimit}}" icon="fa-bank"></kpi-card></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card label="Available Credit" value="{{vm.kpis.availableCredit}}" icon="fa-money"></kpi-card></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card label="Outstanding Amount" value="{{vm.kpis.outstandingAmount}}" icon="fa-exclamation-triangle"></kpi-card></div></div><div class="row"><div class="col-md-12"><div class="kpi-card"><h4>Credit Utilization</h4><div class="progress" style="height: 30px;"><div class="progress-bar" ng-class="vm.getUtilizationClass()" role="progressbar" style="width: {{vm.kpis.rawData.utilizationPercentage}}%;">{{vm.kpis.utilizationPercentage}}</div></div></div></div></div><h3>Credit Cards Overview</h3><div class="row"><div class="col-md-6" ng-repeat="card in vm.cards track by card.cardId"><creditcard-summary card="card"></creditcard-summary></div></div><div ng-if="vm.cards.length === 0 && !vm.loading" class="alert alert-info">No credit cards found.</div></div></div>
