<div class="dashboard-container">
<h2>Credit Card Dashboard</h2>
<div ng-if="vm.loading" class="text-center">
<i class="fa fa-spinner fa-spin fa-3x"></i>
<p>Loading dashboard...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">
{{vm.error}}
</div>
<div ng-if="!vm.loading && !vm.error">
<div class="row">
<div class="col-md-3 col-sm-6">
<kpi-card kpi-value="vm.kpis.monthlySpend" kpi-label="Monthly Spend" kpi-currency="vm.kpis.currency"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card kpi-value="vm.kpis.totalCreditLimit" kpi-label="Total Credit Limit" kpi-currency="vm.kpis.currency"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card kpi-value="vm.kpis.availableCredit" kpi-label="Available Credit" kpi-currency="vm.kpis.currency"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card kpi-value="vm.kpis.outstandingAmount" kpi-label="Outstanding Amount" kpi-currency="vm.kpis.currency"></kpi-card>
</div>
</div>
<div class="row">
<div class="col-md-12">
<h3>Your Credit Cards</h3>
<credit-card-list cards="vm.cards"></credit-card-list>
</div>
</div>
<div class="row">
<div class="col-md-12">
<p class="text-muted text-right"><small>Last updated: {{vm.kpis.lastUpdated | date:'short'}}</small></p>
</div>
</div>
</div>
</div>
