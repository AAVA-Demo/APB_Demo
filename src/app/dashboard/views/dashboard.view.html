<div class="row">
  <div class="col-md-12">
    <h2>Credit Card Dashboard</h2>
    <p class="text-muted">Real-time overview of your credit card portfolio</p>
  </div>
</div>
<div ng-if="vm.loading" class="loading">
  <div class="spinner"><i class="glyphicon glyphicon-refresh glyphicon-spin"></i> Loading...</div>
</div>
<div ng-if="vm.error" class="alert alert-danger">{{ vm.error }}</div>
<div ng-if="!vm.loading && !vm.error" class="row">
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Available Credit" value="vm.kpis.availableCredit"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount"></kpi-card>
  </div>
</div>
<div ng-if="!vm.loading" class="row">
  <div class="col-md-12">
    <p class="text-right text-muted"><small>Last updated: {{ vm.kpis.lastUpdated | date:'short' }}</small></p>
  </div>
</div>
