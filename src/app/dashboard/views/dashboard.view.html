<div ng-controller="DashboardController as vm">
  <div ng-if="vm.loading" class="loading-spinner">
    <span class="glyphicon glyphicon-refresh glyphicon-spin" style="font-size:48px;"></span>
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error">
    <h2>Dashboard Overview</h2>
    <div class="row">
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card label="Monthly Spend" value="{{vm.kpis.monthlySpend}}" icon="glyphicon-shopping-cart" currency="$"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card label="Total Credit Limit" value="{{vm.kpis.totalCreditLimit}}" icon="glyphicon-credit-card" currency="$"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card label="Available Credit" value="{{vm.kpis.availableCredit}}" icon="glyphicon-ok-circle" currency="$"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card label="Outstanding Amount" value="{{vm.kpis.totalOutstanding}}" icon="glyphicon-exclamation-sign" currency="$"></kpi-card>
      </div>
    </div>
    <h3>Your Credit Cards</h3>
    <div class="row">
      <div class="col-md-4 col-sm-6 col-xs-12" ng-repeat="card in vm.cards track by card.cardId">
        <credit-card-summary card="card"></credit-card-summary>
      </div>
    </div>
  </div>
</div>
