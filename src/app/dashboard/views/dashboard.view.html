<div ng-controller="DashboardController as vm"><h2>Credit Card Dashboard</h2><div ng-if="vm.error" class="alert alert-danger alert-banner">{{vm.error}}</div><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="!vm.loading"><h3>Key Performance Indicators</h3><div class="row"><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card metric-name="Monthly Spend" metric-value="{{vm.kpis.monthlySpend | currency}}"></kpi-card></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card metric-name="Total Credit Limit" metric-value="{{vm.kpis.totalCreditLimit | currency}}"></kpi-card></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card metric-name="Available Credit" metric-value="{{vm.kpis.totalAvailableCredit | currency}}"></kpi-card></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-card metric-name="Outstanding Amount" metric-value="{{vm.kpis.totalOutstandingAmount | currency}}"></kpi-card></div></div><h3>Your Credit Cards</h3><card-list cards="vm.cards"></card-list></div></div>
