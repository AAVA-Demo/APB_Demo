<div class="row">
<div class="col-md-12">
<h2>Credit Card Dashboard</h2>
<p class="text-muted">Monitor your credit card portfolio and key financial metrics</p>
</div>
</div>
<div ng-if="vm.loading" class="loading">
<i class="fa fa-spinner fa-spin fa-3x"></i>
<p>Loading dashboard...</p>
</div>
<div ng-if="!vm.loading&&vm.kpis" class="row">
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card icon="fa-credit-card" label="Total Credit Limit" value="{{vm.kpis.totalCreditLimit}}" prefix="$"></kpi-card>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card icon="fa-money" label="Available Credit" value="{{vm.kpis.totalAvailableCredit}}" prefix="$"></kpi-card>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card icon="fa-exclamation-circle" label="Outstanding Amount" value="{{vm.kpis.totalOutstanding}}" prefix="$"></kpi-card>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card icon="fa-calendar" label="Monthly Spend" value="{{vm.kpis.monthlySpend}}" prefix="$"></kpi-card>
</div>
</div>
<div ng-if="!vm.loading&&vm.kpis" class="row">
<div class="col-md-12">
<div class="kpi-card">
<h4>Credit Utilization</h4>
<div class="progress" style="height:30px;margin-top:15px">
<div class="progress-bar" ng-class="{'progress-bar-success':vm.kpis.utilizationPercentage<30,'progress-bar-warning':vm.kpis.utilizationPercentage>=30&&vm.kpis.utilizationPercentage<70,'progress-bar-danger':vm.kpis.utilizationPercentage>=70}" role="progressbar" ng-style="{width:vm.kpis.utilizationPercentage+'%'}">
<span style="font-size:16px;font-weight:bold">{{vm.kpis.utilizationPercentage}}%</span>
</div>
</div>
<p class="text-muted" style="margin-top:10px">Last updated: {{vm.kpis.lastUpdated|date:'short'}}</p>
</div>
</div>
</div>
