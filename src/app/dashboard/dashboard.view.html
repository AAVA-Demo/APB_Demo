<div class="row"><div class="col-md-12"><h2>Credit Card Dashboard</h2><div ng-if="vm.loading"><p>Loading dashboard...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error && vm.kpis"><div class="row"><div class="col-md-3"><kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" format="currency"></kpi-card></div><div class="col-md-3"><kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" format="currency"></kpi-card></div><div class="col-md-3"><kpi-card label="Available Credit" value="vm.kpis.totalAvailableCredit" format="currency"></kpi-card></div><div class="col-md-3"><kpi-card label="Outstanding Amount" value="vm.kpis.totalOutstandingAmount" format="currency"></kpi-card></div></div><div class="row" style="margin-top:20px"><div class="col-md-12"><h3>Your Credit Cards</h3><div class="row"><div class="col-md-4" ng-repeat="card in vm.cards track by card.cardId"><div class="card-tile"><div class="card-number">{{card.cardType}} ****{{card.cardNumber.slice(-4)}}</div><div>Limit: ${{card.creditLimit | number:2}}</div><div>Available: ${{card.availableCredit | number:2}}</div></div></div></div></div></div></div></div></div>
