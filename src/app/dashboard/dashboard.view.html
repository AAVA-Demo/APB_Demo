<div class="dashboard-container"><h2>Credit Card Dashboard</h2><button class="btn btn-primary" ng-click="vm.refresh()">Refresh</button><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && vm.dashboardData" class="dashboard-content"><div class="row kpi-row"><div class="col-md-3"><kpi-card title="Monthly Spend" value="{{vm.dashboardData.monthlySpend | currencyFormat}}"></kpi-card></div><div class="col-md-3"><kpi-card title="Total Credit Limit" value="{{vm.dashboardData.totalCreditLimit | currencyFormat}}"></kpi-card></div><div class="col-md-3"><kpi-card title="Available Credit" value="{{vm.dashboardData.availableCredit | currencyFormat}}"></kpi-card></div><div class="col-md-3"><kpi-card title="Outstanding Amount" value="{{vm.dashboardData.outstandingAmount | currencyFormat}}"></kpi-card></div></div><div class="row"><div class="col-md-12"><h3>Your Credit Cards</h3><creditcard-summary cards="vm.dashboardData.cards"></creditcard-summary></div></div></div></div>
