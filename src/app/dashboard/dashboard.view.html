<div ng-if="vm.loading" class="loading-spinner"><i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...</div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="vm.kpiData&&!vm.loading"><dashboard-layout><div class="col-xs-12 col-sm-6 col-md-3"><kpi-widget label="Monthly Spend" value="vm.kpiData.monthlySpend" format="currency"></kpi-widget></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-widget label="Total Credit Limit" value="vm.kpiData.totalCreditLimit" format="currency"></kpi-widget></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-widget label="Available Credit" value="vm.kpiData.availableCredit" format="currency"></kpi-widget></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-widget label="Outstanding Amount" value="vm.kpiData.outstandingAmount" format="currency"></kpi-widget></div></dashboard-layout><div class="row"><div class="col-xs-12"><div class="kpi-widget"><h4>Credit Utilization</h4><div class="progress"><div class="progress-bar" role="progressbar" ng-style="{width:vm.kpiData.utilizationRate+'%'}" aria-valuenow="{{vm.kpiData.utilizationRate}}" aria-valuemin="0" aria-valuemax="100">{{vm.kpiData.utilizationRate|number:2}}%</div></div></div></div></div><div class="row"><div class="col-xs-12"><p class="text-muted text-right"><small>Last updated: {{vm.kpiData.lastUpdated|date:'short'}}</small></p></div></div></div>
