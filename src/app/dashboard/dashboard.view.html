<div ng-if="vm.loading" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading dashboard...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><h2>Credit Card Portfolio Dashboard</h2><div class="row"><div class="col-md-3"><kpi-card title="Total Credit Limit" value="vm.dashboard.totalCreditLimit" icon="fa-credit-card"></kpi-card></div><div class="col-md-3"><kpi-card title="Outstanding Amount" value="vm.dashboard.totalOutstandingAmount" icon="fa-exclamation-circle"></kpi-card></div><div class="col-md-3"><kpi-card title="Available Credit" value="vm.dashboard.totalAvailableCredit" icon="fa-check-circle"></kpi-card></div><div class="col-md-3"><kpi-card title="Monthly Spend" value="vm.dashboard.totalMonthlySpend" icon="fa-line-chart"></kpi-card></div></div><h3>Your Credit Cards</h3><div ng-repeat="card in vm.dashboard.cards"><creditcard-summary card="card"></creditcard-summary></div></div>
