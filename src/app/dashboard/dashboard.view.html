<div class="row"><div class="col-md-12"><h2>Dashboard</h2></div></div><div ng-if="vm.loading" class="row"><div class="col-md-12"><p>Loading dashboard...</p></div></div><div ng-if="vm.error" class="row"><div class="col-md-12"><div class="alert alert-danger">{{vm.error}}</div></div></div><div ng-if="!vm.loading && vm.kpiData" class="row"><div class="col-md-3" ng-repeat="kpi in vm.kpiData.kpis"><kpi-widget kpi="kpi"></kpi-widget></div></div><div ng-if="!vm.loading && vm.kpiData" class="row"><div class="col-md-12"><p class="text-muted">Last updated: {{vm.kpiData.lastUpdated | date:'short'}}</p></div></div>
