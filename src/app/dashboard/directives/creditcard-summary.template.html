<div class="creditcard-summary"><div class="panel panel-info" ng-repeat="card in cards"><div class="panel-heading"><h4>{{card.cardName}} - {{card.cardNumber}}</h4></div><div class="panel-body"><div class="row"><div class="col-md-3"><strong>Credit Limit:</strong> {{card.creditLimit | currencyFormat}}</div><div class="col-md-3"><strong>Available:</strong> {{card.availableCredit | currencyFormat}}</div><div class="col-md-3"><strong>Outstanding:</strong> {{card.outstandingAmount | currencyFormat}}</div><div class="col-md-3"><strong>Monthly Spend:</strong> {{card.monthlySpend | currencyFormat}}</div></div></div></div></div>
