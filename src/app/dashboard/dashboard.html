<div class="dashboard-container">
<h2>Credit Card Dashboard</h2>
<div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="vm.kpis && !vm.loading" class="row">
<div class="col-md-3 col-sm-6">
<kpi-widget title="'Monthly Spend'" value="vm.kpis.monthlySpend" icon="'glyphicon-credit-card'" color="'primary'"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget title="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" icon="'glyphicon-list-alt'" color="'success'"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget title="'Available Credit'" value="vm.kpis.availableCredit" icon="'glyphicon-ok-circle'" color="'info'"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget title="'Outstanding Amount'" value="vm.kpis.outstandingAmount" icon="'glyphicon-exclamation-sign'" color="'warning'"></kpi-widget>
</div>
</div>
<div ng-if="vm.kpis" class="text-muted text-right"><small>Last updated: {{vm.kpis.lastUpdated | date:'medium'}}</small></div>
</div>
