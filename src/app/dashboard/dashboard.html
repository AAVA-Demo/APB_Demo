<div class="dashboard-container">
  <div class="page-header">
    <h1>Dashboard <button class="btn btn-sm btn-primary pull-right" ng-click="vm.refreshData()" ng-disabled="vm.loading"><i class="glyphicon glyphicon-refresh"></i> Refresh</button></h1>
  </div>
  <div ng-if="vm.loading" class="text-center"><h3>Loading dashboard...</h3></div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error" class="row kpi-row">
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card kpi-name="Monthly Spend" kpi-value="vm.kpis.monthlySpend" kpi-icon="glyphicon-shopping-cart"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card kpi-name="Total Credit Limit" kpi-value="vm.kpis.totalCreditLimit" kpi-icon="glyphicon-credit-card"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card kpi-name="Available Credit" kpi-value="vm.kpis.availableCredit" kpi-icon="glyphicon-ok-circle"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card kpi-name="Outstanding Amount" kpi-value="vm.kpis.outstandingAmount" kpi-icon="glyphicon-exclamation-sign"></kpi-card>
    </div>
  </div>
</div>
