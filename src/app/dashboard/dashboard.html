<div ng-controller="dashboardController as vm">
  <div class="error-banner" ng-if="vm.errorMessage">{{vm.errorMessage}}</div>
  <div ng-if="vm.loading" class="text-center"><h3>Loading dashboard...</h3></div>
  <div ng-if="!vm.loading && vm.kpis">
    <div class="row">
      <div class="col-md-3 col-sm-6">
        <kpi-widget title="Monthly Spend" value="vm.kpis.monthlySpend" format="currency"></kpi-widget>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-widget title="Total Credit Limit" value="vm.kpis.totalCreditLimit" format="currency"></kpi-widget>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-widget title="Available Credit" value="vm.kpis.availableCredit" format="currency"></kpi-widget>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-widget title="Outstanding Amount" value="vm.kpis.outstandingAmount" format="currency"></kpi-widget>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <p class="text-muted text-center">Last updated: {{vm.kpis.lastUpdated | date:'medium'}}</p>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <a href="#!/cards" class="btn btn-primary btn-block">View My Cards</a>
      </div>
      <div class="col-md-6">
        <a href="#!/analytics" class="btn btn-success btn-block">View Spending Analytics</a>
      </div>
    </div>
  </div>
</div>
