<div class="row">
  <div class="col-md-12">
    <h2>Credit Card Dashboard</h2>
    <p class="text-muted">Consolidated view of all your credit cards and key financial metrics</p>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Monthly Spend" value="{{vm.kpis.monthlySpend | currency:'₹'}}" icon="glyphicon-shopping-cart"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Total Credit Limit" value="{{vm.kpis.totalCreditLimit | currency:'₹'}}" icon="glyphicon-credit-card"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Available Credit" value="{{vm.kpis.availableCredit | currency:'₹'}}" icon="glyphicon-ok-circle"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Outstanding Amount" value="{{vm.kpis.outstandingAmount | currency:'₹'}}" icon="glyphicon-exclamation-sign"></kpi-card>
  </div>
</div>
<div class="row" ng-if="vm.loading">
  <div class="col-md-12 text-center">
    <p><span class="glyphicon glyphicon-refresh glyphicon-spin"></span> Loading dashboard...</p>
  </div>
</div>
