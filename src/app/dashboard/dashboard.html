<div class="row">
  <div class="col-md-12">
    <h2>Dashboard Overview</h2>
    <div ng-if="vm.loading" class="alert alert-info">Loading dashboard data...</div>
    <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  </div>
</div>
<div class="row" ng-if="vm.kpis && !vm.loading">
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" format="currency"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" format="currency"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Available Credit" value="vm.kpis.availableCredit" format="currency"></kpi-card>
  </div>
  <div class="col-xs-12 col-sm-6 col-md-3">
    <kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount" format="currency"></kpi-card>
  </div>
</div>
<div class="row" ng-if="vm.kpis && !vm.loading">
  <div class="col-md-12">
    <p class="text-muted text-right"><small>Last updated: {{vm.kpis.lastUpdated | date:'short'}}</small></p>
  </div>
</div>
