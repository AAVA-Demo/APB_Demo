<div class="row"><div class="col-md-12"><h2>Financial Overview Dashboard<button class="btn btn-primary pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading"><span ng-if="!vm.loading">Refresh</span><span ng-if="vm.loading">Loading...</span></button></h2><hr></div></div><div ng-if="vm.loading" class="text-center"><h3>Loading dashboard data...</h3></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-3"><kpi-card label="Monthly Spend" value="vm.kpiData.monthlySpend" format="currency"></kpi-card></div><div class="col-md-3"><kpi-card label="Total Credit Limit" value="vm.kpiData.totalCreditLimit" format="currency"></kpi-card></div><div class="col-md-3"><kpi-card label="Available Credit" value="vm.kpiData.availableCredit" format="currency"></kpi-card></div><div class="col-md-3"><kpi-card label="Total Outstanding" value="vm.kpiData.totalOutstanding" format="currency"></kpi-card></div></div><div class="row"><div class="col-md-12"><p class="text-muted text-right" style="margin-top:20px;">Last updated: {{vm.kpiData.lastUpdated | date:'medium'}}</p></div></div></div>
