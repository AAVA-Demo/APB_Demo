<div class="row">
<div class="col-md-12">
<h2>Credit Card Dashboard</h2>
<div ng-if="vm.loading" class="loading-spinner">
<i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...
</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error">
<div class="row">
<div class="col-md-3">
<kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" format="currency"></kpi-card>
</div>
<div class="col-md-3">
<kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" format="currency"></kpi-card>
</div>
<div class="col-md-3">
<kpi-card label="Available Credit" value="vm.kpis.totalAvailableCredit" format="currency"></kpi-card>
</div>
<div class="col-md-3">
<kpi-card label="Outstanding Amount" value="vm.kpis.totalOutstandingAmount" format="currency"></kpi-card>
</div>
</div>
<div class="row">
<div class="col-md-12">
<h3>Your Credit Cards ({{vm.kpis.cardCount}})</h3>
<div class="row">
<div class="col-md-4" ng-repeat="card in vm.cards track by card.cardId">
<div class="card-summary">
<h4>{{card.cardType}}</h4>
<p><strong>Limit:</strong> ${{card.creditLimit | number:2}}</p>
<p><strong>Available:</strong> ${{card.availableCredit | number:2}}</p>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
