<div class="dashboard-container">
<div class="page-header">
<h1>Dashboard <button class="btn btn-sm btn-default pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading"><span class="glyphicon glyphicon-refresh"></span> Refresh</button></h1>
</div>
<div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error" class="row">
<div class="col-md-3 col-sm-6">
<kpi-card title="'Monthly Spend'" value="vm.kpis.monthlySpend" icon="'glyphicon-credit-card'" format="'currency'"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" icon="'glyphicon-list-alt'" format="'currency'"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="'Available Credit'" value="vm.kpis.availableCredit" icon="'glyphicon-ok-circle'" format="'currency'"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="'Outstanding Amount'" value="vm.kpis.outstandingAmount" icon="'glyphicon-exclamation-sign'" format="'currency'"></kpi-card>
</div>
</div>
<div ng-if="!vm.loading && !vm.error" class="row" style="margin-top:20px;">
<div class="col-md-12">
<p class="text-muted">Last updated: {{vm.kpis.lastUpdated | date:'medium'}}</p>
</div>
</div>
</div>
