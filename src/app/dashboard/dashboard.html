<div class="dashboard-container"><h2>Dashboard Overview</h2><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="vm.error" class="alert alert-danger alert-custom">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error" class="row"><div class="col-md-3 col-sm-6"><kpi-card title="'Monthly Spend'" value="vm.formatCurrency(vm.kpiData.monthlySpend)" icon="'glyphicon-credit-card'"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card title="'Total Credit Limit'" value="vm.formatCurrency(vm.kpiData.totalCreditLimit)" icon="'glyphicon-stats'"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card title="'Available Credit'" value="vm.formatCurrency(vm.kpiData.availableCredit)" icon="'glyphicon-ok-circle'"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card title="'Outstanding Amount'" value="vm.formatCurrency(vm.kpiData.outstandingAmount)" icon="'glyphicon-warning-sign'"></kpi-card></div></div><div ng-if="!vm.loading&&!vm.error" class="row"><div class="col-md-12"><p class="text-muted">Last updated: {{vm.kpiData.lastUpdated|date:'short'}}</p></div></div></div>
