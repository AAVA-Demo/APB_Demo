<div class="dashboard-container">
  <div class="page-header">
    <h1>Credit Card Dashboard <small>Financial Overview</small></h1>
    <button class="btn btn-primary pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading">
      <span ng-if="!vm.loading">Refresh</span>
      <span ng-if="vm.loading">Loading...</span>
    </button>
  </div>
  <div class="alert alert-danger" ng-if="vm.error">{{vm.error}}</div>
  <div class="row" ng-if="!vm.loading">
    <div class="col-md-3 col-sm-6">
      <kpi-widget label="Monthly Spend" value="vm.kpiData.monthlySpend" format="currency"></kpi-widget>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-widget label="Total Credit Limit" value="vm.kpiData.totalCreditLimit" format="currency"></kpi-widget>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-widget label="Available Credit" value="vm.kpiData.availableCredit" format="currency"></kpi-widget>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-widget label="Outstanding Amount" value="vm.kpiData.outstandingAmount" format="currency"></kpi-widget>
    </div>
  </div>
  <div class="row" ng-if="!vm.loading">
    <div class="col-md-12">
      <p class="text-muted text-right"><small>Last updated: {{vm.lastUpdated | date:'medium'}}</small></p>
    </div>
  </div>
  <div class="row" ng-if="vm.loading">
    <div class="col-md-12 text-center">
      <div class="spinner">Loading dashboard...</div>
    </div>
  </div>
</div>
