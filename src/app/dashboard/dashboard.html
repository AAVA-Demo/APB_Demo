<div><h2>Dashboard</h2><div ng-if="vm.isLoading" class="loading">Loading dashboard...</div><div ng-if="vm.error" class="error">{{vm.error}}</div><div ng-if="!vm.isLoading&&!vm.error"><div class="row"><div class="col-md-3 col-sm-6"><kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" format="currency"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" format="currency"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Available Credit" value="vm.kpis.availableCredit" format="currency"></kpi-card></div><div class="col-md-3 col-sm-6"><kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount" format="currency"></kpi-card></div></div><p style="text-align:center;color:#999;margin-top:20px">Last updated: {{vm.lastUpdated|date:'short'}}</p></div></div>
