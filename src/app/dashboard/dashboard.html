<div class="dashboard-container">
<h2>Financial Overview</h2>
<div ng-if="vm.loading" class="loading">Loading dashboard...</div>
<div ng-if="vm.error" class="error-message">{{vm.error}}</div>
<div ng-if="!vm.loading&&!vm.error">
<div class="row">
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card label="'Monthly Spend'" value="vm.kpis.monthlySpend" icon="'₹'" format="'currency'"></kpi-card>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card label="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" icon="'₹'" format="'currency'"></kpi-card>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card label="'Available Credit'" value="vm.kpis.availableCredit" icon="'₹'" format="'currency'"></kpi-card>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-card label="'Outstanding Amount'" value="vm.kpis.outstandingAmount" icon="'₹'" format="'currency'"></kpi-card>
</div>
</div>
<div class="row">
<div class="col-xs-12">
<p class="text-muted text-right">Last updated: {{vm.kpis.lastUpdated|date:'medium'}}</p>
</div>
</div>
</div>
</div>
