<div ng-if="vm.loading && vm.transactions.length === 0" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading transactions...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading || vm.transactions.length > 0"><h2>Transaction History</h2><p class="text-muted">Showing {{vm.transactions.length}} of {{vm.totalCount}} transactions</p><div ng-repeat="transaction in vm.transactions"><transaction-card transaction="transaction" on-select="vm.selectTransaction(transactionId)"></transaction-card></div><div class="text-center" ng-if="vm.transactions.length < vm.totalCount"><button class="btn btn-primary" ng-click="vm.loadMore()" ng-disabled="vm.loading"><span ng-if="vm.loading"><i class="fa fa-spinner fa-spin"></i> Loading...</span><span ng-if="!vm.loading">Load More</span></button></div></div>
