<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Date</th>
        <th>Merchant</th>
        <th>Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="txn in transactions" ng-click="onSelect({transaction: txn})" class="transaction-row">
        <td>{{txn.transactionDate | date:'short'}}</td>
        <td>{{txn.merchantName}}</td>
        <td>{{txn.amount | currency}}</td>
        <td><span class="label" ng-class="{'label-success': txn.status === 'posted', 'label-warning': txn.status === 'pending'}">{{txn.status}}</span></td>
      </tr>
    </tbody>
  </table>
</div>
