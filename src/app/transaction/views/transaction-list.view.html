<div ng-controller="TransactionListController as vm"><h2>Transactions</h2><div ng-if="vm.error" class="alert alert-danger alert-banner">{{vm.error}}</div><transaction-filter cards="vm.cards" filters="vm.filters" on-apply="vm.applyFilters()"></transaction-filter><div ng-if="vm.loading" class="text-center"><p>Loading transactions...</p></div><div ng-if="!vm.loading" class="transaction-table"><table class="table table-striped table-hover"><thead><tr><th>Date</th><th>Merchant</th><th>Card</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr ng-repeat="txn in vm.transactions track by txn.transactionId" class="transaction-row" ng-click="vm.viewDetail(txn.transactionId)"><td>{{txn.transactionDate | date:'short'}}</td><td>{{txn.merchantName}}</td><td>{{txn.cardName}}</td><td>{{txn.category}}</td><td>{{txn.amount | currency}}</td><td><span class="label" ng-class="{'label-success':txn.status==='posted','label-warning':txn.status==='pending'}">{{txn.status}}</span></td></tr></tbody></table><uib-pagination total-items="vm.totalCount" ng-model="vm.filters.pageNumber" items-per-page="vm.filters.pageSize" ng-change="vm.pageChanged()" class="pagination-sm"></uib-pagination></div></div>
