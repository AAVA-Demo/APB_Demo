<div class="row">
  <div class="col-md-12">
    <h2>Transaction History</h2>
    <div ng-if="vm.error" class="error-message">
      {{vm.error}}
      <button class="btn btn-sm btn-primary pull-right" ng-click="vm.applyFilters()">Retry</button>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="filter-panel">
      <form class="form-inline">
        <div class="form-group">
          <label>Search:</label>
          <input type="text" class="form-control" ng-model="vm.filters.searchTerm" placeholder="Merchant name...">
        </div>
        <div class="form-group">
          <label>From:</label>
          <input type="date" class="form-control" ng-model="vm.filters.startDate">
        </div>
        <div class="form-group">
          <label>To:</label>
          <input type="date" class="form-control" ng-model="vm.filters.endDate">
        </div>
        <button type="button" class="btn btn-primary" ng-click="vm.applyFilters()">Apply</button>
        <button type="button" class="btn btn-default" ng-click="vm.clearFilters()">Clear</button>
      </form>
    </div>
  </div>
</div>
<div class="row" ng-if="vm.loading">
  <div class="col-md-12">
    <div class="loading-spinner">
      <i class="glyphicon glyphicon-refresh spinning"></i> Loading transactions...
    </div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-12">
    <div class="transaction-table">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Date</th>
            <th>Merchant</th>
            <th>Card</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="txn in vm.transactions" class="transaction-row" ng-click="vm.viewDetails(txn.transactionId)">
            <td>{{txn.transactionDate | date:'short'}}</td>
            <td>{{txn.merchantName}}</td>
            <td>{{txn.cardName}}</td>
            <td>{{txn.category}}</td>
            <td>{{txn.amount | currency}}</td>
            <td><span class="label" ng-class="{'label-success': txn.status === 'posted', 'label-warning': txn.status === 'pending'}">{{txn.status}}</span></td>
          </tr>
          <tr ng-if="vm.transactions.length === 0">
            <td colspan="6" class="text-center">No transactions found.</td>
          </tr>
        </tbody>
      </table>
      <div class="text-center" ng-if="vm.pagination.totalPages > 1">
        <uib-pagination total-items="vm.pagination.totalRecords" ng-model="vm.currentPage" items-per-page="vm.pageSize" max-size="5" boundary-links="true" ng-change="vm.pageChanged()"></uib-pagination>
      </div>
    </div>
  </div>
</div>
