<div><div class="page-header"><h2>Transaction History</h2></div><div class="filter-panel"><div class="row"><div class="col-md-3"><label>Card Filter</label><select class="form-control" ng-model="vm.selectedCard" ng-change="vm.onCardFilterChange()"><option value="">All Cards</option><option ng-repeat="card in vm.cards track by card.cardId" value="{{card.cardId}}">{{card.cardName}}</option></select></div><div class="col-md-2"><label>Category</label><input type="text" class="form-control" ng-model="vm.filters.category" placeholder="Category"></div><div class="col-md-2"><label>Start Date</label><input type="date" class="form-control" ng-model="vm.filters.startDate"></div><div class="col-md-2"><label>End Date</label><input type="date" class="form-control" ng-model="vm.filters.endDate"></div><div class="col-md-3" style="padding-top: 25px;"><button class="btn btn-primary" ng-click="vm.applyFilters()">Apply</button> <button class="btn btn-default" ng-click="vm.clearFilters()">Clear</button></div></div></div><div ng-if="vm.error" class="alert alert-danger alert-dismissible"><button type="button" class="close" ng-click="vm.error=null">&times;</button>{{vm.error}} <button class="btn btn-sm btn-default" ng-click="vm.loadTransactions()">Retry</button></div><div ng-if="vm.loading" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading transactions...</p></div><div ng-if="!vm.loading"><div ng-if="vm.transactions.length === 0" class="alert alert-info">No transactions found.</div><div ng-if="vm.transactions.length > 0"><transaction-card ng-repeat="transaction in vm.transactions track by transaction.transactionId" transaction="transaction" ng-click="vm.goToDetail(transaction.transactionId)" style="cursor: pointer;"></transaction-card><div class="text-center" style="margin-top: 20px;"><ul class="pagination"><li ng-class="{disabled: vm.paginationState.currentPage === 1}"><a ng-click="vm.prevPage()">&laquo;</a></li><li ng-repeat="page in [] | range:1:vm.paginationState.totalPages" ng-class="{active: page === vm.paginationState.currentPage}"><a ng-click="vm.goToPage(page)">{{page}}</a></li><li ng-class="{disabled: vm.paginationState.currentPage === vm.paginationState.totalPages}"><a ng-click="vm.nextPage()">&raquo;</a></li></ul><p>Page {{vm.paginationState.currentPage}} of {{vm.paginationState.totalPages}} ({{vm.paginationState.totalRecords}} total records)</p></div></div></div></div>
