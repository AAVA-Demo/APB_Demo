<div ng-if="vm.loading" class="loading-spinner">
  <i class="glyphicon glyphicon-refresh spinning"></i> Loading cards...
</div>
<div ng-if="vm.error" class="error-message">
  <i class="glyphicon glyphicon-exclamation-sign"></i> {{vm.error}}
</div>
<div ng-if="!vm.loading && !vm.error">
  <h2>My Credit Cards</h2>
  <div class="row">
    <div class="col-md-4">
      <card-list cards="vm.cards" selected-card="vm.selectedCard" on-select="vm.selectCard(card)"></card-list>
    </div>
    <div class="col-md-8" ng-controller="CardSelectorController as selector">
      <card-detail card="selector.selectedCard" analytics="selector.analytics"></card-detail>
    </div>
  </div>
</div>
