<div><h2>Spending Analytics</h2><div ng-if="vm.loading" class="text-center"><p>Loading analytics...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error&&vm.analyticsData"><category-filter filter="vm.filter" on-apply="vm.applyFilter()"></category-filter><category-breakdown category-data="vm.analyticsData.categorySpending"></category-breakdown><trend-chart trend-data="vm.analyticsData.monthlyTrends"></trend-chart></div><div style="margin-top:20px"><a href="#!/dashboard" class="btn btn-default">Back to Dashboard</a></div></div>
