<div><div class="page-header"><h2>Spending Analytics & Insights</h2></div><div class="filter-panel"><h4>Filters</h4><div class="row"><div class="col-md-3"><label>Start Date</label><input type="date" class="form-control" ng-model="vm.filter.startDate"></div><div class="col-md-3"><label>End Date</label><input type="date" class="form-control" ng-model="vm.filter.endDate"></div><div class="col-md-4"><category-filter selected-categories="vm.filter.categories"></category-filter></div><div class="col-md-2" style="padding-top: 25px;"><button class="btn btn-primary" ng-click="vm.applyFilter()">Apply</button> <button class="btn btn-default" ng-click="vm.clearFilter()">Clear</button></div></div></div><div ng-if="vm.error" class="alert alert-danger alert-dismissible"><button type="button" class="close" ng-click="vm.error=null">&times;</button>{{vm.error}} <button class="btn btn-sm btn-default" ng-click="vm.loadAnalytics()">Retry</button></div><div ng-if="vm.loading" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading analytics...</p></div><div ng-if="!vm.loading"><div class="row"><div class="col-md-6"><div class="chart-container"><h4>Category-wise Spending</h4><spending-chart chart-data="vm.pieChartConfig" chart-type="pie"></spending-chart></div></div><div class="col-md-6"><div class="chart-container"><h4>Monthly Spend Trends</h4><spending-chart chart-data="vm.lineChartConfig" chart-type="line"></spending-chart></div></div></div><div class="row"><div class="col-md-12"><div class="chart-container"><h4>Card-wise Spending</h4><spending-chart chart-data="vm.barChartConfig" chart-type="bar"></spending-chart></div></div></div><div ng-if="vm.categorySpendData.length === 0" class="alert alert-info">No spending data available for the selected filters.</div></div></div>
