<div ng-controller="AnalyticsController as vm"><h2>Spending Analytics</h2><div ng-if="vm.error" class="alert alert-danger alert-banner">{{vm.error}}</div><category-filter cards="vm.cards" filters="vm.filters" on-apply="vm.applyFilters()"></category-filter><div ng-if="vm.loading" class="text-center"><p>Loading analytics...</p></div><div ng-if="!vm.loading"><div class="row"><div class="col-md-6"><spending-chart chart-data="vm.analyticsData.categorySpending" chart-type="pie" chart-title="Category-Wise Spending"></spending-chart></div><div class="col-md-6"><spending-chart chart-data="vm.analyticsData.cardWiseSpending" chart-type="bar" chart-title="Card-Wise Spending"></spending-chart></div></div><div class="row"><div class="col-md-12"><spending-chart chart-data="vm.analyticsData.monthlyTrends" chart-type="line" chart-title="Monthly Spending Trends"></spending-chart></div></div></div></div>
