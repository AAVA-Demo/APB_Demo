<div><h2>Analytics Insights</h2><div class="filter-panel"><div class="row"><div class="col-md-4"><label>Date Range</label><p>Last 12 months</p></div><div class="col-md-2"><button class="btn btn-primary" ng-click="vm.applyFilters()">Refresh</button></div></div></div><div ng-if="vm.loading" class="text-center"><p>Loading insights...</p></div><div ng-if="!vm.loading"><div class="row"><div class="col-md-6"><div class="panel panel-default"><div class="panel-heading"><h4>Category-Wise Spending</h4></div><div class="panel-body"><spending-chart labels="vm.categoryLabels" data="vm.categoryValues" on-click="vm.onChartClick(points,evt)"></spending-chart></div></div></div><div class="col-md-6"><div class="panel panel-default"><div class="panel-heading"><h4>Monthly Trends</h4></div><div class="panel-body"><canvas class="chart chart-line" chart-data="[vm.monthValues]" chart-labels="vm.monthLabels" chart-series="['Monthly Spend']"></canvas></div></div></div></div><div class="row"><div class="col-md-12"><div class="panel panel-default"><div class="panel-heading"><h4>Card-Wise Spending</h4></div><div class="panel-body"><table class="table table-striped"><thead><tr><th>Card</th><th>Total Spend</th></tr></thead><tbody><tr ng-repeat="card in vm.analyticsData.cardWiseAnalytics"><td>{{card.cardName}}</td><td>{{card.totalSpend|currency:'₹':0}}</td></tr></tbody></table></div></div></div></div></div></div>
