<div class="row"><div class="col-md-12"><h2>Spending Analytics & Insights</h2></div></div><div class="filter-panel"><div class="row"><div class="col-md-4"><label>Date From</label><input type="date" class="form-control" ng-model="vm.filters.dateRange.from" ng-change="vm.applyFilter()"></div><div class="col-md-4"><label>Date To</label><input type="date" class="form-control" ng-model="vm.filters.dateRange.to" ng-change="vm.applyFilter()"></div><div class="col-md-4"><label>Card Filter</label><select class="form-control" ng-model="vm.filters.cardIds" ng-change="vm.applyFilter()" multiple><option value="card1">Card 1</option><option value="card2">Card 2</option></select></div></div></div><div ng-if="vm.loading" class="text-center"><p>Loading analytics...</p></div><div ng-if="!vm.loading"><div class="row"><div class="col-md-6"><h3>Category-Wise Spending</h3><spending-chart data="vm.analyticsData" type="pie"></spending-chart></div><div class="col-md-6"><h3>Monthly Trends</h3><spending-chart data="vm.analyticsData" type="line"></spending-chart></div></div><div class="row"><div class="col-md-12"><h3>Card-Wise Spend Analysis</h3><table class="table table-striped"><thead><tr><th>Card</th><th>Total Spend</th></tr></thead><tbody><tr ng-repeat="card in vm.analyticsData.cardWiseSpend"><td>{{card.cardName}}</td><td>${{card.totalSpend|number:2}}</td></tr></tbody></table></div></div></div>
