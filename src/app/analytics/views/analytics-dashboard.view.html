<h2>Analytics & Spending Insights</h2><div class="card-filter"><div class="row"><div class="col-sm-3"><label>Start Date</label><input type="date" class="form-control" ng-model="vm.filters.startDate" ng-change="vm.onFilterChange()"></div><div class="col-sm-3"><label>End Date</label><input type="date" class="form-control" ng-model="vm.filters.endDate" ng-change="vm.onFilterChange()"></div><div class="col-sm-3"><label>Card ID</label><input type="text" class="form-control" ng-model="vm.filters.cardId" ng-change="vm.onFilterChange()" placeholder="Enter card ID"></div><div class="col-sm-3"><label>Category</label><select class="form-control" ng-model="vm.filters.category" ng-change="vm.onFilterChange()"><option value="">All Categories</option><option value="Food and Dining">Food and Dining</option><option value="Fuel">Fuel</option><option value="Shopping">Shopping</option><option value="Travel">Travel</option><option value="Entertainment">Entertainment</option><option value="Utilities">Utilities</option><option value="Healthcare">Healthcare</option><option value="Education">Education</option><option value="Miscellaneous">Miscellaneous</option></select></div></div></div><div ng-if="vm.loading" class="text-center"><h3>Loading analytics...</h3></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><div class="row"><div class="col-md-6"><category-chart data="vm.categoryData"></category-chart></div><div class="col-md-6"><trend-chart data="vm.trendData"></trend-chart></div></div><div class="alert alert-info" style="margin-top:20px"><strong>Total Transactions Analyzed:</strong> {{vm.totalTransactions}}</div></div>
