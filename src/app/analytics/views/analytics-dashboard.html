<div class="row"><div class="col-md-12"><h1 class="page-header">Spending Analytics</h1></div></div><div ng-if="vm.loading" class="loading-spinner"><i class="fa fa-spinner fa-spin"></i> Loading...</div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-6"><h3>Category-wise Spending</h3><spending-chart data="vm.analytics.categorySpend" type="pie"></spending-chart></div><div class="col-md-6"><h3>Card-wise Spending</h3><spending-chart data="vm.analytics.cardWiseSpend" type="bar"></spending-chart></div></div><div class="row"><div class="col-md-12"><h3>Monthly Spend Trends</h3><trend-chart data="vm.analytics.monthlyTrend"></trend-chart></div></div><div class="row" ng-if="vm.selectedCategory"><div class="col-md-12"><h3>{{vm.selectedCategory}} Transactions</h3><div class="transaction-card" ng-repeat="txn in vm.categoryDetails"><span class="merchant">{{txn.merchant}}</span><span class="amount">${{txn.amount | number:2}}</span><div class="date">{{txn.date | date:'MMM dd, yyyy'}}</div></div></div></div></div>
