<div class="analytics-view"><div class="row"><div class="col-md-12"><h1>Spending Analytics & Insights</h1></div></div><div class="row"><div class="col-md-12"><div class="panel panel-default"><div class="panel-body"><form class="form-inline"><div class="form-group"><label>Start Date:</label><input type="date" class="form-control" ng-model="vm.dateRange.startDate"></div><div class="form-group" style="margin-left:15px"><label>End Date:</label><input type="date" class="form-control" ng-model="vm.dateRange.endDate"></div><button type="button" class="btn btn-primary" ng-click="vm.updateDateRange()" style="margin-left:15px">Update</button></form></div></div></div></div><div ng-if="vm.loading" class="loading-overlay"><div class="spinner"></div></div><div ng-if="vm.error" class="error-message">{{vm.error}}</div><div ng-if="vm.analyticsData && !vm.loading"><div class="row"><div class="col-md-12"><div class="kpi-card"><h3>Total Spend</h3><div class="value">{{vm.analyticsData.totalSpend|currency}}</div></div></div></div><div class="row"><div class="col-md-6"><category-spending-chart data="vm.analyticsData.categorySpending"></category-spending-chart></div><div class="col-md-6"><trend-analysis-chart data="vm.analyticsData.monthlyTrends"></trend-analysis-chart></div></div><div class="row"><div class="col-md-12"><div class="chart-container"><h3>Category Breakdown</h3><table class="table"><thead><tr><th>Category</th><th>Amount</th><th>Transactions</th><th>Percentage</th></tr></thead><tbody><tr ng-repeat="category in vm.analyticsData.categorySpending"><td>{{category.category}}</td><td>{{category.totalAmount|currency}}</td><td>{{category.transactionCount}}</td><td>{{category.percentage}}%</td></tr></tbody></table></div></div></div></div></div>
