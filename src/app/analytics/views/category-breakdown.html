<div class="category-breakdown-container"><h2>Category: {{vm.selectedCategory}}</h2><div class="chart-container"><h4>Transactions</h4><table class="table table-striped"><thead><tr><th>Date</th><th>Card</th><th>Merchant</th><th>Description</th><th>Amount</th></tr></thead><tbody><tr ng-repeat="txn in vm.transactions"><td>{{txn.date|date:'short'}}</td><td>{{txn.cardId}}</td><td>{{txn.merchantName}}</td><td>{{txn.description}}</td><td>${{txn.amount|number:2}}</td></tr></tbody></table></div><div class="text-center"><a href="#!/analytics" class="btn btn-primary">Back to Analytics Dashboard</a></div></div>
