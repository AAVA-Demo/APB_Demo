<div class="analytics-container"><h2>Spending Analytics</h2><div ng-if="vm.loading" class="text-center"><p>Loading analytics...</p></div><div ng-if="vm.error" class="alert alert-danger alert-custom">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><div class="row"><div class="col-md-12"><category-filter categories="vm.allCategories" selected="vm.selectedCategories" on-change="vm.applyFilter()"></category-filter></div></div><div class="row"><div class="col-md-6"><div class="chart-container"><h3>Category-Wise Spending</h3><canvas id="categoryChart" height="300"></canvas></div></div><div class="col-md-6"><div class="chart-container"><h3>Monthly Spend Trends (12 Months)</h3><canvas id="trendChart" height="300"></canvas></div></div></div><div class="row" style="margin-top:20px;"><div class="col-md-12"><div class="kpi-card"><h3>Total Spend ({{vm.spendingData.period}})</h3><div class="kpi-value">{{vm.formatCurrency(vm.spendingData.totalSpend)}}</div></div></div></div></div></div>
