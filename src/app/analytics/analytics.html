<div class="row">
  <div class="col-md-12">
    <h2>Spending Analytics</h2>
    <div class="alert alert-danger" ng-if="vm.error">{{vm.error}}</div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-12">
    <div class="filter-panel">
      <h4>Filters</h4>
      <div class="row">
        <div class="col-md-3">
          <div class="form-group">
            <label>From Date</label>
            <input type="date" class="form-control" ng-model="vm.filters.dateFrom">
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-group">
            <label>To Date</label>
            <input type="date" class="form-control" ng-model="vm.filters.dateTo">
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-group">
            <label>Card</label>
            <select class="form-control" ng-model="vm.filters.cardId">
              <option value="">All Cards</option>
              <option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardId}}</option>
            </select>
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-group">
            <label>&nbsp;</label><br>
            <button class="btn btn-primary" ng-click="vm.applyFilters()">Apply</button>
            <button class="btn btn-default" ng-click="vm.clearFilters()">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-12">
    <div class="chart-container">
      <h4>Category-Wise Spending</h4>
      <spending-chart chart-data="vm.analyticsData.categorySpend" chart-type="'pie'" chart-id="'categoryChart'"></spending-chart>
    </div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-12">
    <div class="chart-container">
      <h4>Monthly Spend Trends</h4>
      <spending-chart chart-data="vm.analyticsData.monthlyTrends" chart-type="'line'" chart-id="'monthlyChart'"></spending-chart>
    </div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-12">
    <div class="chart-container">
      <h4>Card-Wise Spending</h4>
      <spending-chart chart-data="vm.analyticsData.cardWiseSpend" chart-type="'bar'" chart-id="'cardChart'"></spending-chart>
    </div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-12">
    <div class="kpi-card">
      <h4>Total Spending: <strong>{{vm.analyticsData.totalSpend | currency}}</strong></h4>
    </div>
  </div>
</div>
<div class="row" ng-if="vm.loading">
  <div class="col-md-12 text-center">
    <p>Loading analytics data...</p>
  </div>
</div>
