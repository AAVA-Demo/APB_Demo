<div class="row">
  <div class="col-md-12">
    <h2>Spending Analytics</h2>
    <p class="text-muted">Interactive insights into your spending patterns</p>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-6">
    <category-chart data="vm.categoryData"></category-chart>
  </div>
  <div class="col-md-6">
    <trend-analysis data="vm.trendData"></trend-analysis>
  </div>
</div>
<div class="row" ng-if="vm.loading">
  <div class="col-md-12 text-center">
    <p><span class="glyphicon glyphicon-refresh glyphicon-spin"></span> Loading analytics...</p>
  </div>
</div>
