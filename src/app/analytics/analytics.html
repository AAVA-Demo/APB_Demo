<div>
  <h2>Spending Analytics & Insights</h2>
  <div class="filter-panel">
    <div class="row">
      <div class="col-md-4">
        <label>Date Range</label>
        <select class="form-control" ng-model="vm.filters.dateRange.months" ng-change="vm.applyFilters()">
          <option value="3">Last 3 Months</option>
          <option value="6">Last 6 Months</option>
          <option value="12" selected>Last 12 Months</option>
        </select>
      </div>
      <div class="col-md-4">
        <label>Card</label>
        <select class="form-control" ng-model="vm.filters.selectedCard" ng-change="vm.applyFilters()">
          <option value="">All Cards</option>
          <option value="1">Visa Platinum</option>
          <option value="2">MasterCard Gold</option>
          <option value="3">Amex Blue</option>
        </select>
      </div>
    </div>
  </div>
  <div ng-if="vm.errorMessage" class="error-banner">
    {{vm.errorMessage}}
  </div>
  <div ng-if="vm.loading" class="loading-spinner">
    <i class="glyphicon glyphicon-refresh spinning"></i> Loading analytics...
  </div>
  <div ng-if="!vm.loading">
    <div class="row">
      <div class="col-md-6">
        <h3>Category-wise Spending</h3>
        <chart data="vm.analyticsData.categoryBreakdown" type="pie"></chart>
      </div>
      <div class="col-md-6">
        <h3>Monthly Spend Trends</h3>
        <chart data="vm.analyticsData.monthlyTrends" type="bar"></chart>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <h3>Card-wise Spend Analysis</h3>
        <chart data="vm.analyticsData.cardWiseSpend" type="bar"></chart>
      </div>
    </div>
  </div>
</div>
