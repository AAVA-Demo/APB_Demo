<div><h2>Analytics & Spending Insights</h2><div ng-if="vm.isLoading" class="loading">Loading analytics...</div><div ng-if="vm.error" class="error">{{vm.error}}</div><div ng-if="!vm.isLoading&&!vm.error"><div class="chart-container"><h3>Category-Wise Spending</h3><div chart-directive chart-type="pie" chart-data="vm.categoryBreakdown" on-select="vm.filterByCategory(category)"></div></div><div class="chart-container"><h3>Monthly Spend Trends</h3><div chart-directive chart-type="line" chart-data="vm.monthlyTrends"></div></div><div ng-if="vm.selectedCategory" style="margin-top:20px"><button class="btn btn-primary" ng-click="vm.clearFilter()">Clear Filter</button><p>Filtered by: {{vm.selectedCategory}}</p></div></div></div>
