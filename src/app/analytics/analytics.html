<div class="row">
<div class="col-md-12">
<h2>Spending Analytics</h2>
<div ng-if="vm.loading" class="loading-spinner">
<i class="glyphicon glyphicon-refresh spinning"></i> Loading analytics...
</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error">
<div class="filter-panel">
<h4>Filter Analytics</h4>
<div class="row">
<div class="col-md-4">
<label>Date From</label>
<input type="date" class="form-control" ng-model="vm.dateFrom">
</div>
<div class="col-md-4">
<label>Date To</label>
<input type="date" class="form-control" ng-model="vm.dateTo">
</div>
<div class="col-md-4">
<label>&nbsp;</label>
<button class="btn btn-primary btn-block" ng-click="vm.applyFilter()">Apply Filter</button>
</div>
</div>
</div>
<div class="row">
<div class="col-md-12">
<h3>Monthly Spend Trends</h3>
<spend-chart chart-type="monthlyTrend" chart-data="vm.analyticsData"></spend-chart>
</div>
</div>
<div class="row">
<div class="col-md-6">
<h3>Card-wise Spending</h3>
<spend-chart chart-type="cardWise" chart-data="vm.analyticsData"></spend-chart>
</div>
<div class="col-md-6">
<h3>Category-wise Spending</h3>
<spend-chart chart-type="category" chart-data="vm.analyticsData"></spend-chart>
</div>
</div>
</div>
</div>
</div>
