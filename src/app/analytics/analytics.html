<div class="analytics-container">
  <h2>Spending Analytics</h2>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading analytics...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="row">
      <div class="col-md-6">
        <h3>Category-Wise Spending</h3>
        <div spending-chart data="vm.categorySpending" on-drill-down="vm.drillDown"></div>
      </div>
      <div class="col-md-6">
        <h3>Monthly Spend Trends</h3>
        <div trend-chart data="vm.monthlyTrends"></div>
      </div>
    </div>
    <div ng-if="vm.selectedCategory" class="row" style="margin-top: 20px;">
      <div class="col-md-12">
        <h3>Transactions in {{vm.selectedCategory}} <button class="btn btn-sm btn-default" ng-click="vm.clearDrillDown()">Clear</button></h3>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Amount</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="txn in vm.drillDownTransactions">
              <td>{{txn.transactionDate | date:'short'}}</td>
              <td>{{txn.merchant}}</td>
              <td>{{txn.amount | currency}}</td>
              <td>{{txn.description}}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
