<div class="transaction-table">
<h4>Transactions <span ng-if="selectedCategory">({{selectedCategory}})</span></h4>
<div ng-if="transactions.length===0">
<p class="text-muted">No transactions found.</p>
</div>
<div ng-if="transactions.length>0">
<table class="table table-striped table-hover">
<thead>
<tr>
<th>Date</th>
<th>Merchant</th>
<th>Category</th>
<th>Amount</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr ng-repeat="tx in getPageTransactions() track by tx.transactionId">
<td>{{tx.transactionDate|date:'short'}}</td>
<td>{{tx.merchantName}}</td>
<td>{{tx.category}}</td>
<td>₹{{tx.amount|number:2}}</td>
<td>{{tx.description}}</td>
</tr>
</tbody>
</table>
<div class="text-center">
<button class="btn btn-default" ng-click="prevPage()" ng-disabled="currentPage===0">Previous</button>
<span class="pagination-info">Page {{currentPage+1}} of {{getTotalPages()}}</span>
<button class="btn btn-default" ng-click="nextPage()" ng-disabled="currentPage>=getTotalPages()-1">Next</button>
</div>
</div>
</div>
