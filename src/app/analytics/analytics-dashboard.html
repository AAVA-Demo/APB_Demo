<div ng-controller="analyticsController as vm">
  <h2>Spending Analytics</h2>
  <div class="error-banner" ng-if="vm.error">{{vm.error}}</div>
  <div ng-if="vm.loading" class="text-center"><h3>Loading analytics...</h3></div>
  <div ng-if="!vm.loading && vm.analyticsData">
    <div class="form-group">
      <label>Select Month:</label>
      <select class="form-control" ng-model="vm.selectedMonth" ng-change="vm.onMonthChange()" ng-options="month for month in vm.months"></select>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="chart-container">
          <h3>Category-Wise Spending</h3>
          <spending-chart categories="vm.analyticsData.categories"></spending-chart>
        </div>
      </div>
      <div class="col-md-6">
        <category-breakdown categories="vm.analyticsData.categories" on-category-click="vm.filterByCategory(category)"></category-breakdown>
      </div>
    </div>
    <div class="row" ng-if="vm.analyticsData.previousMonths && vm.analyticsData.previousMonths.length > 0">
      <div class="col-md-12">
        <div class="chart-container">
          <h3>Monthly Spend Trends</h3>
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Month</th>
                <th>Total Spend</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="trend in vm.analyticsData.previousMonths track by trend.month">
                <td>{{trend.month}}</td>
                <td>{{trend.totalSpend | currency}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="row" ng-if="vm.selectedCategory && vm.categoryTransactions.length > 0">
      <div class="col-md-12">
        <div class="chart-container">
          <h3>{{vm.selectedCategory}} Transactions</h3>
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Date</th>
                <th>Merchant</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="txn in vm.categoryTransactions track by txn.transactionId">
                <td>{{txn.date | date:'short'}}</td>
                <td>{{txn.merchant}}</td>
                <td>{{txn.amount | currency}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
