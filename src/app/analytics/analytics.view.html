<div ng-if="vm.loading" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading analytics...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><h2>Spending Analytics & Insights</h2><div class="filter-panel"><h4>Filters</h4><div class="row"><div class="col-md-3"><label>Start Date</label><input type="date" class="form-control" ng-model="vm.filters.startDate"></div><div class="col-md-3"><label>End Date</label><input type="date" class="form-control" ng-model="vm.filters.endDate"></div><div class="col-md-2"><label>Category</label><select class="form-control" ng-model="vm.filters.category"><option value="">All</option><option value="Food & Dining">Food & Dining</option><option value="Fuel">Fuel</option><option value="Shopping">Shopping</option><option value="Travel">Travel</option><option value="Entertainment">Entertainment</option><option value="Utilities">Utilities</option><option value="Healthcare">Healthcare</option><option value="Education">Education</option><option value="Miscellaneous">Miscellaneous</option></select></div><div class="col-md-2"><label>&nbsp;</label><button class="btn btn-primary btn-block" ng-click="vm.applyFilter()">Apply</button></div><div class="col-md-2"><label>&nbsp;</label><button class="btn btn-default btn-block" ng-click="vm.clearFilters()">Clear</button></div></div></div><ul class="nav nav-tabs"><li ng-class="{active: vm.activeTab === 'category'}"><a ng-click="vm.setActiveTab('category')">Category-wise</a></li><li ng-class="{active: vm.activeTab === 'trends'}"><a ng-click="vm.setActiveTab('trends')">Monthly Trends</a></li><li ng-class="{active: vm.activeTab === 'cardwise'}"><a ng-click="vm.setActiveTab('cardwise')">Card-wise</a></li></ul><div ng-if="vm.activeTab === 'category'"><category-chart data="vm.analytics.categorySpending"></category-chart></div><div ng-if="vm.activeTab === 'trends'"><trend-chart data="vm.analytics.monthlyTrends"></trend-chart></div><div ng-if="vm.activeTab === 'cardwise'"><card-wise-chart data="vm.analytics.cardWiseSpending"></card-wise-chart></div></div>
