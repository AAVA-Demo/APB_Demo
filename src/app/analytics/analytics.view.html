<div class="row"><div class="col-md-12"><h2>Spending Analytics</h2></div></div><div ng-if="vm.loading" class="row"><div class="col-md-12"><p>Loading analytics...</p></div></div><div ng-if="vm.error" class="row"><div class="col-md-12"><div class="alert alert-danger">{{vm.error}}</div></div></div><div ng-if="!vm.loading && vm.analyticsData" class="row"><div class="col-md-6"><div class="chart-container"><h3>Category-Wise Spending</h3><category-chart chart-data="vm.categoryChartData"></category-chart></div></div><div class="col-md-6"><div class="chart-container"><h3>Monthly Spend Trends</h3><trend-chart chart-data="vm.trendChartData"></trend-chart></div></div></div><div ng-if="!vm.loading && vm.analyticsData" class="row"><div class="col-md-12"><div class="card-item"><h3>Total Spend: ${{vm.analyticsData.totalSpend | number:2}}</h3><p>Date Range: {{vm.analyticsData.dateRange.startDate | date:'short'}} - {{vm.analyticsData.dateRange.endDate | date:'short'}}</p></div></div></div>
