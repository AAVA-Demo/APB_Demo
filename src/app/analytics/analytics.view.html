<div class="row"><div class="col-md-12"><h2>Spending Analytics</h2><div ng-if="vm.loading"><p>Loading analytics...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error && vm.analyticsData"><div class="filter-panel"><h4>Filter Analytics</h4><div class="row"><div class="col-md-4"><label>Card ID</label><input type="text" class="form-control" ng-model="vm.filter.cardId" placeholder="Filter by card"></div><div class="col-md-4"><label>Date From</label><input type="date" class="form-control" ng-model="vm.filter.dateFrom"></div><div class="col-md-4"><label>Date To</label><input type="date" class="form-control" ng-model="vm.filter.dateTo"></div></div><div class="row" style="margin-top:10px"><div class="col-md-12"><button class="btn btn-primary" ng-click="vm.applyFilter()">Apply Filter</button></div></div></div><div class="row"><div class="col-md-12"><spend-chart data="vm.analyticsData.monthlyTrends" chart-type="line" title="Monthly Spend Trends"></spend-chart></div></div><div class="row"><div class="col-md-6"><spend-chart data="vm.analyticsData.cardWiseSpend" chart-type="bar" title="Card-wise Spending"></spend-chart></div><div class="col-md-6"><spend-chart data="vm.analyticsData.categoryWiseSpend" chart-type="pie" title="Category-wise Spending"></spend-chart></div></div></div></div></div>
