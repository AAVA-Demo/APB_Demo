<div class="row">
  <div class="col-xs-12">
    <a href="#/analytics" class="btn btn-default btn-sm"><span class="glyphicon glyphicon-arrow-left"></span> Back to Analytics</a>
    <h2>Transaction History</h2>
    <hr>
  </div>
</div>
<div class="row">
  <div class="col-xs-12 col-md-6">
    <input type="text" class="form-control" placeholder="Search transactions..." ng-model="vm.searchText">
  </div>
  <div class="col-xs-12 col-md-6">
    <select class="form-control" ng-model="vm.selectedCategory">
      <option value="">All Categories</option>
      <option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option>
    </select>
  </div>
</div>
<div class="row" style="margin-top: 20px;">
  <div class="col-xs-12">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Date</th>
          <th>Merchant</th>
          <th>Category</th>
          <th class="text-right">Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="txn in vm.getFilteredTransactions() | limitTo:50" class="transaction-row">
          <td>{{txn.transactionDate | date:'short'}}</td>
          <td>{{txn.merchantName}}</td>
          <td><span class="category-badge">{{txn.category}}</span></td>
          <td class="text-right">₹{{txn.amount | number:2}}</td>
          <td>{{txn.status}}</td>
        </tr>
      </tbody>
    </table>
    <p ng-if="vm.getFilteredTransactions().length === 0" class="text-muted">No transactions found.</p>
    <p ng-if="vm.getFilteredTransactions().length > 50" class="text-muted">Showing first 50 transactions. Use filters to narrow results.</p>
  </div>
</div>
