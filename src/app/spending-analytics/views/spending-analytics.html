<div class="row"><div class="col-md-12"><h2>Spending Analytics and Category Insights</h2></div></div><div class="filter-panel"><div class="row"><div class="col-md-4"><label>Date From</label><input type="date" class="form-control" ng-model="vm.filters.dateRange.from" ng-change="vm.applyFilter()"></div><div class="col-md-4"><label>Date To</label><input type="date" class="form-control" ng-model="vm.filters.dateRange.to" ng-change="vm.applyFilter()"></div><div class="col-md-4"><label>Categories</label><select class="form-control" ng-model="vm.filters.categories" ng-change="vm.applyFilter()" multiple><option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option></select></div></div></div><div ng-if="vm.loading" class="text-center"><p>Loading spending analytics...</p></div><div ng-if="!vm.loading"><div class="row"><div class="col-md-6"><h3>Category-Wise Spending</h3><category-chart data="vm.analyticsData" type="pie"></category-chart></div><div class="col-md-6"><h3>Monthly Spend Trends</h3><category-chart data="vm.analyticsData" type="line"></category-chart></div></div><div class="row"><div class="col-md-12"><h3>Category Breakdown</h3><table class="table table-striped"><thead><tr><th>Category</th><th>Total Amount</th><th>Transaction Count</th><th>% of Total</th></tr></thead><tbody><tr ng-repeat="cat in vm.analyticsData.categories" ng-click="vm.drillDownCategory(cat)" style="cursor:pointer"><td>{{cat.categoryName}}</td><td>${{cat.totalAmount|number:2}}</td><td>{{cat.transactionCount}}</td><td>{{cat.percentageOfTotal}}%</td></tr></tbody></table></div></div></div>
