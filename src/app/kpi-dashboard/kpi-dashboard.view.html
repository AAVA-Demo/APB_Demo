<div class="row">
  <div class="col-md-12">
    <h2>KPI Dashboard</h2>
    <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-3 col-sm-6">
    <kpi-widget kpi="vm.kpiData.monthlySpend"></kpi-widget>
  </div>
  <div class="col-md-3 col-sm-6">
    <kpi-widget kpi="vm.kpiData.totalCreditLimit"></kpi-widget>
  </div>
  <div class="col-md-3 col-sm-6">
    <kpi-widget kpi="vm.kpiData.availableCredit"></kpi-widget>
  </div>
  <div class="col-md-3 col-sm-6">
    <kpi-widget kpi="vm.kpiData.outstandingAmount"></kpi-widget>
  </div>
</div>
<div ng-if="vm.loading" class="text-center" style="padding:50px;">
  <i class="fa fa-spinner fa-spin fa-3x"></i>
</div>
