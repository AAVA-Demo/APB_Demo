<div class="row"><div class="col-md-12"><h2>KPI Dashboard</h2></div></div><div ng-if="vm.loading" class="text-center"><p>Loading KPI dashboard...</p></div><div ng-if="!vm.loading" class="row"><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Monthly Spend" value="vm.kpiData.monthlySpend" icon="glyphicon-usd"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Total Credit Limit" value="vm.kpiData.totalCreditLimit" icon="glyphicon-credit-card"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Available Credit" value="vm.kpiData.totalAvailableCredit" icon="glyphicon-ok-circle"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget title="Total Outstanding" value="vm.kpiData.totalOutstanding" icon="glyphicon-exclamation-sign"></kpi-widget></div></div><div ng-if="!vm.loading" class="row"><div class="col-md-12"><p class="text-muted">Last updated: {{vm.kpiData.lastUpdated|date:'short'}}</p></div></div>
