<div class="analytics-container">
  <div class="page-header">
    <h1>Spending Analytics</h1>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <i class="glyphicon glyphicon-refresh spinning"></i> Loading analytics...
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{ vm.error }}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="panel panel-default filter-panel">
      <div class="panel-body">
        <div class="row">
          <div class="col-md-3">
            <label>Time Period</label>
            <select class="form-control" ng-model="vm.selectedMonths" ng-change="vm.updateDateRange()">
              <option value="3">Last 3 Months</option>
              <option value="6">Last 6 Months</option>
              <option value="12">Last 12 Months</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h4>Category-wise Spending</h4>
          </div>
          <div class="panel-body">
            <chart-canvas ng-if="vm.categoryChartData" chart-data="vm.categoryChartData" chart-type="pie"></chart-canvas>
            <p ng-if="!vm.categoryChartData" class="text-center text-muted">No category data available.</p>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h4>Card-wise Spending</h4>
          </div>
          <div class="panel-body">
            <chart-canvas ng-if="vm.cardWiseChartData" chart-data="vm.cardWiseChartData" chart-type="bar"></chart-canvas>
            <p ng-if="!vm.cardWiseChartData" class="text-center text-muted">No card data available.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h4>Monthly Spending Trend</h4>
          </div>
          <div class="panel-body">
            <chart-canvas ng-if="vm.monthlyChartData" chart-data="vm.monthlyChartData" chart-type="line"></chart-canvas>
            <p ng-if="!vm.monthlyChartData" class="text-center text-muted">No monthly trend data available.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
