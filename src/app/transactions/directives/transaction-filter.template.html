<div class="transaction-filter panel panel-default"><div class="panel-body"><form class="form-inline"><div class="form-group"><label>Search:</label><input type="text" class="form-control" ng-model="filter.searchText" placeholder="Merchant or description"></div><div class="form-group"><label>Card:</label><select class="form-control" ng-model="filter.cardId"><option value="">All Cards</option></select></div><div class="form-group"><label>Start Date:</label><input type="date" class="form-control" ng-model="filter.startDate"></div><div class="form-group"><label>End Date:</label><input type="date" class="form-control" ng-model="filter.endDate"></div><div class="form-group"><label>Category:</label><select class="form-control" ng-model="filter.category"><option value="">All Categories</option><option value="Food & Dining">Food & Dining</option><option value="Fuel">Fuel</option><option value="Shopping">Shopping</option><option value="Travel">Travel</option><option value="Entertainment">Entertainment</option><option value="Utilities">Utilities</option><option value="Healthcare">Healthcare</option><option value="Education">Education</option><option value="Miscellaneous">Miscellaneous</option></select></div><button type="button" class="btn btn-primary" ng-click="onApply()">Apply Filter</button></form></div></div>
