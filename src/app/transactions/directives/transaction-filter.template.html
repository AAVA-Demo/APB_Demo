<div class="filter-panel">
<h4>Filter Transactions</h4>
<form>
<div class="row">
<div class="col-xs-12 col-sm-6 col-md-3">
<div class="form-group">
<label>Search</label>
<input type="text" class="form-control" ng-model="filters.searchTerm" ng-model-options="{debounce:300}" placeholder="Merchant name...">
</div>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<div class="form-group">
<label>Start Date</label>
<input type="date" class="form-control" ng-model="filters.startDate">
</div>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<div class="form-group">
<label>End Date</label>
<input type="date" class="form-control" ng-model="filters.endDate">
</div>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<div class="form-group">
<label>Category</label>
<select class="form-control" ng-model="filters.category">
<option value="">All Categories</option>
<option value="Food & Dining">Food & Dining</option>
<option value="Fuel">Fuel</option>
<option value="Shopping">Shopping</option>
<option value="Travel">Travel</option>
<option value="Entertainment">Entertainment</option>
<option value="Utilities">Utilities</option>
<option value="Healthcare">Healthcare</option>
<option value="Education">Education</option>
<option value="Miscellaneous">Miscellaneous</option>
</select>
</div>
</div>
</div>
<div class="row">
<div class="col-xs-12">
<button type="button" class="btn btn-primary" ng-click="applyFilter()">Apply Filter</button>
<button type="button" class="btn btn-default" ng-click="resetFilter()">Reset</button>
</div>
</div>
</form>
</div>
