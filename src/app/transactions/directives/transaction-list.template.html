<div class="transaction-list"><table class="table table-striped table-hover"><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Amount</th><th>Card</th><th>Status</th><th>Action</th></tr></thead><tbody><tr ng-repeat="txn in transactions"><td>{{txn.transactionDate | date:'short'}}</td><td>{{txn.merchantName}}</td><td>{{txn.category}}</td><td>{{txn.amount | currencyFormat:txn.currency}}</td><td>{{txn.cardName}}</td><td><span class="label" ng-class="{'label-success': txn.status === 'Posted', 'label-warning': txn.status === 'Pending'}">{{txn.status}}</span></td><td><button class="btn btn-xs btn-info" ng-click="onSelect({transaction: txn})">View</button></td></tr></tbody></table></div>
