<div class="row"><div class="col-md-12"><h2>Transactions</h2><div ng-if="vm.loading"><p>Loading transactions...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="filter-panel"><h4>Filter Transactions</h4><div class="row"><div class="col-md-3"><label>Date From</label><input type="date" class="form-control" ng-model="vm.filter.dateFrom"></div><div class="col-md-3"><label>Date To</label><input type="date" class="form-control" ng-model="vm.filter.dateTo"></div><div class="col-md-3"><label>Merchant</label><input type="text" class="form-control" ng-model="vm.filter.merchant" placeholder="Search merchant"></div><div class="col-md-3"><label>Category</label><input type="text" class="form-control" ng-model="vm.filter.category" placeholder="Category"></div></div><div class="row" style="margin-top:10px"><div class="col-md-12"><button class="btn btn-primary" ng-click="vm.applyFilter()">Apply Filter</button> <button class="btn btn-default" ng-click="vm.clearFilter()">Clear</button></div></div></div><div class="transaction-table"><transaction-table transactions="vm.filteredTransactions" page-size="vm.pageSize" current-page="vm.currentPage"></transaction-table></div></div></div></div>
