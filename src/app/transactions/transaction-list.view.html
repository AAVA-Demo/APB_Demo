<div class="row"><div class="col-md-12"><h2>Transactions</h2></div></div><div class="row"><div class="col-md-3"><transaction-filter filters="vm.filters" on-apply="vm.applyFilters()"></transaction-filter></div><div class="col-md-9"><div ng-if="vm.loading"><p>Loading transactions...</p></div><div ng-if="vm.error"><div class="alert alert-danger">{{vm.error}}</div></div><div ng-if="!vm.loading && vm.transactions.length > 0"><div class="transaction-row" ng-repeat="txn in vm.transactions | limitTo:vm.itemsPerPage:(vm.currentPage-1)*vm.itemsPerPage" ng-click="vm.viewTransactionDetail(txn.transactionId)"><div class="row"><div class="col-xs-6"><strong>{{txn.merchantName}}</strong><br><small>{{txn.transactionDate | date:'short'}}</small></div><div class="col-xs-3"><span class="label label-info">{{txn.category}}</span></div><div class="col-xs-3 text-right"><strong>${{txn.amount | number:2}}</strong></div></div></div></div><div ng-if="!vm.loading && vm.transactions.length === 0"><p>No transactions found.</p></div></div></div>
