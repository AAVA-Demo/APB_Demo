<div class="transactions-container"><h2>Transaction Management</h2><transaction-filter filter="vm.filter" on-apply="vm.applyFilter()"></transaction-filter><div ng-if="vm.loading" class="text-center"><p>Loading transactions...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && vm.transactions.length > 0"><transaction-list transactions="vm.transactions" on-select="vm.viewDetail(transaction)"></transaction-list><div class="text-center" ng-if="vm.paginatedData"><p>Showing {{vm.paginatedData.transactions.length}} of {{vm.paginatedData.totalCount}} transactions</p></div></div><div ng-if="!vm.loading && vm.transactions.length === 0" class="alert alert-info">No transactions found</div><transaction-detail transaction="vm.selectedTransaction" on-close="vm.closeDetail()"></transaction-detail></div>
