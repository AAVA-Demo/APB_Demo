<div>
  <h2>Transaction History</h2>
  <search-filter filters="vm.filters" on-search-change="vm.onSearchChange()" on-filter-change="vm.onFilterChange()"></search-filter>
  <div ng-if="vm.errorMessage" class="error-banner">
    {{vm.errorMessage}}
    <button class="btn btn-sm btn-danger pull-right" ng-click="vm.loadTransactions()">Retry</button>
  </div>
  <div ng-if="vm.loading" class="loading-spinner">
    <i class="glyphicon glyphicon-refresh spinning"></i> Loading transactions...
  </div>
  <div ng-if="!vm.loading">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Date</th>
          <th>Card</th>
          <th>Merchant</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="txn in vm.transactions track by txn.transactionId" class="transaction-row" ng-click="vm.openTransactionDetail(txn)">
          <td>{{txn.date | date:'dd MMM yyyy'}}</td>
          <td>{{txn.cardName}}</td>
          <td>{{txn.merchant}}</td>
          <td>{{txn.category}}</td>
          <td>₹{{txn.amount | number:0}}</td>
          <td><span class="label" ng-class="{'label-success': txn.status === 'Posted', 'label-warning': txn.status === 'Pending'}">{{txn.status}}</span></td>
        </tr>
      </tbody>
    </table>
    <div class="text-center" ng-if="vm.pagination.totalPages > 1">
      <ul class="pagination">
        <li ng-class="{disabled: !vm.pagination.hasPrev}"><a ng-click="vm.changePage(vm.currentPage - 1)">&laquo;</a></li>
        <li ng-repeat="page in [] | range:1:vm.pagination.totalPages" ng-class="{active: page === vm.currentPage}"><a ng-click="vm.changePage(page)">{{page}}</a></li>
        <li ng-class="{disabled: !vm.pagination.hasNext}"><a ng-click="vm.changePage(vm.currentPage + 1)">&raquo;</a></li>
      </ul>
    </div>
  </div>
</div>
