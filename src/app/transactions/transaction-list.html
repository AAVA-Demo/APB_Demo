<div ng-if="vm.loading" class="text-center">
  <i class="fa fa-spinner fa-spin fa-3x"></i>
  <p>Loading transactions...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">
  <strong>Error:</strong> {{vm.error}}
</div>
<div ng-if="!vm.loading && !vm.error">
  <h2>Transaction Management</h2>
  <transaction-filter cards="vm.cards" filters="vm.filters" on-apply="vm.applyFilter()"></transaction-filter>
  <transaction-list transactions="vm.transactions" on-select="vm.viewDetail(transactionId)"></transaction-list>
</div>
