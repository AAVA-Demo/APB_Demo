<div class="row"><div class="col-md-12"><h2>Transaction Detail</h2></div></div><div class="row" ng-if="!vm.loading&&vm.transaction"><div class="col-md-6"><dl class="dl-horizontal"><dt>Merchant:</dt><dd>{{vm.transaction.merchantName}}</dd><dt>Amount:</dt><dd>{{vm.transaction.amount|currency}}</dd><dt>Date:</dt><dd>{{vm.transaction.transactionDate|date:"medium"}}</dd><dt>Card:</dt><dd>{{vm.transaction.cardNumber}}</dd><dt>Category:</dt><dd>{{vm.transaction.category}}</dd><dt>Status:</dt><dd>{{vm.transaction.status}}</dd></dl></div></div><div class="row" ng-if="vm.loading"><div class="col-md-12 text-center"><p>Loading transaction details...</p></div></div>
