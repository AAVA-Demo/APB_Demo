<div class="transaction-container">
  <div class="row">
    <div class="col-md-12">
      <h2>Transaction History</h2>
      <a href="#!/dashboard" class="btn btn-default">Back to Dashboard</a>
    </div>
  </div>
  <div class="row" style="margin-top:20px;">
    <div class="col-md-4">
      <label>Filter by Card:</label>
      <select class="form-control" ng-model="vm.selectedCard" ng-change="vm.filterByCard()">
        <option value="">All Cards</option>
        <option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardName}} (****{{card.lastFourDigits}})</option>
      </select>
    </div>
  </div>
  <div class="row" ng-if="vm.loading" style="margin-top:20px;">
    <div class="col-md-12 text-center">
      <p>Loading transactions...</p>
    </div>
  </div>
  <div class="row" ng-if="!vm.loading" style="margin-top:20px;">
    <div class="col-md-12">
      <table class="table table-striped table-bordered table-responsive">
        <thead>
          <tr>
            <th>Date</th>
            <th>Merchant</th>
            <th>Category</th>
            <th>Card</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="txn in vm.transactions track by txn.transactionId">
            <td>{{txn.date | date:'dd-MMM-yyyy'}}</td>
            <td>{{txn.merchant}}</td>
            <td>{{txn.category}}</td>
            <td>{{txn.cardName}} (****{{txn.lastFourDigits}})</td>
            <td>₹{{txn.amount | number:2}}</td>
          </tr>
        </tbody>
      </table>
      <pagination current-page="vm.currentPage" total-pages="vm.totalPages" on-page-change="vm.updatePage(page)"></pagination>
    </div>
  </div>
</div>
