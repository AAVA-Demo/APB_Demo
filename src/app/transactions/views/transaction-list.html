<div class="transaction-container">
  <h2>Transaction Management</h2>
  <transaction-filter filter-criteria="vm.filterCriteria" cards="vm.cards" on-filter="vm.applyFilter()"></transaction-filter>
  <div ng-if="vm.loading" class="text-center"><h4>Loading transactions...</h4></div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error" class="transaction-table">
    <table class="table table-striped table-responsive">
      <thead>
        <tr>
          <th>Date</th>
          <th>Card</th>
          <th>Merchant</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="txn in vm.transactions track by txn.transactionId">
          <td>{{txn.date | date:'MM/dd/yyyy'}}</td>
          <td>{{txn.cardName}}</td>
          <td>{{txn.merchant}}</td>
          <td>{{txn.category}}</td>
          <td>{{txn.currency}} {{txn.amount | number:2}}</td>
        </tr>
        <tr ng-if="!vm.transactions.length">
          <td colspan="5" class="text-center">No transactions found</td>
        </tr>
      </tbody>
    </table>
    <transaction-pagination pagination="vm.pagination" on-page-change="vm.changePage(page)"></transaction-pagination>
  </div>
</div>
