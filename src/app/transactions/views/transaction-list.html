<div class="row"><div class="col-md-12"><h2>Transactions</h2></div></div><div class="row"><div class="col-md-4"><label>Filter by Card:</label><select class="form-control" ng-model="vm.selectedCardId" ng-change="vm.applyCardFilter(vm.selectedCardId)"><option value="">All Cards</option><option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardType}} - {{card.cardNumber}}</option></select></div></div><div class="row" ng-if="!vm.loading"><div class="col-md-12"><transaction-list-item ng-repeat="txn in vm.transactions track by txn.transactionId" transaction="txn"></transaction-list-item></div></div><div class="row" ng-if="vm.loading"><div class="col-md-12 text-center"><p>Loading transactions...</p></div></div>
