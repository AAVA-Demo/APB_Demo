<div ng-if="vm.loading" class="text-center"><h3>Loading transactions...</h3></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error">
  <h2>Credit Card Transactions</h2>
  <div class="filter-panel">
    <div class="row">
      <div class="col-sm-6">
        <label>Search</label>
        <input type="text" class="form-control" ng-model="vm.searchTerm" ng-change="vm.onSearchChange()" placeholder="Search by merchant or description">
      </div>
      <div class="col-sm-3">
        <label>Date From</label>
        <input type="date" class="form-control" ng-model="vm.filters.dateRange.from">
      </div>
      <div class="col-sm-3">
        <label>Date To</label>
        <input type="date" class="form-control" ng-model="vm.filters.dateRange.to">
      </div>
    </div>
    <div class="row" style="margin-top: 10px;">
      <div class="col-sm-6">
        <label>Category</label>
        <select class="form-control" ng-model="vm.filters.category">
          <option value="">All Categories</option>
          <option value="Food & Dining">Food & Dining</option>
          <option value="Fuel">Fuel</option>
          <option value="Shopping">Shopping</option>
          <option value="Travel">Travel</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Utilities">Utilities</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Education">Education</option>
          <option value="Miscellaneous">Miscellaneous</option>
        </select>
      </div>
      <div class="col-sm-6" style="padding-top: 25px;">
        <button class="btn btn-primary" ng-click="vm.applyFilters()">Apply Filters</button>
      </div>
    </div>
  </div>
  <div ng-if="vm.transactions.length === 0" class="alert alert-info">No transactions found.</div>
  <div ng-if="vm.transactions.length > 0">
    <div class="transaction-item" ng-repeat="txn in vm.transactions track by txn.transactionId" ng-click="vm.viewDetail(txn.transactionId)" style="cursor: pointer;">
      <div class="row">
        <div class="col-xs-8">
          <strong>{{txn.merchantName}}</strong><br>
          <small>{{txn.cardName}} | {{txn.category}}</small>
        </div>
        <div class="col-xs-4 text-right">
          <strong>{{txn.currency}} {{txn.amount | number:2}}</strong><br>
          <small>{{txn.transactionDate | date:"short"}}</small>
        </div>
      </div>
    </div>
    <p class="text-muted">Total: {{vm.totalCount}} transactions</p>
  </div>
</div>
