<div ng-controller="TransactionListController as vm">
  <div class="row">
    <div class="col-md-12">
      <h2>Transaction Management</h2>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Filters</h4>
        </div>
        <div class="panel-body">
          <form class="form-inline">
            <div class="form-group">
              <label>Start Date:</label>
              <input type="date" class="form-control" ng-model="vm.filters.startDate">
            </div>
            <div class="form-group">
              <label>End Date:</label>
              <input type="date" class="form-control" ng-model="vm.filters.endDate">
            </div>
            <div class="form-group">
              <label>Category:</label>
              <select class="form-control" ng-model="vm.filters.category">
                <option value="">All Categories</option>
                <option value="Food & Dining">Food & Dining</option>
                <option value="Fuel">Fuel</option>
                <option value="Shopping">Shopping</option>
                <option value="Travel">Travel</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Miscellaneous">Miscellaneous</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary" ng-click="vm.applyFilters()">Apply</button>
            <button type="button" class="btn btn-default" ng-click="vm.clearFilters()">Clear</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="row" ng-if="!vm.loading">
    <div class="col-md-12">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Transactions ({{vm.totalCount}} total)</h4>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Date</th>
                <th>Merchant</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Card</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr transaction-row transaction="txn" on-click="vm.viewDetail(txn.transactionId)" ng-repeat="txn in vm.transactions"></tr>
            </tbody>
          </table>
        </div>
        <div class="panel-footer">
          <uib-pagination total-items="vm.totalCount" ng-model="vm.currentPage" items-per-page="vm.pageSize" 
                          max-size="5" boundary-links="true" ng-change="vm.pageChanged()"></uib-pagination>
        </div>
      </div>
    </div>
  </div>
  <div class="row" ng-if="vm.loading">
    <div class="col-md-12 text-center">
      <i class="glyphicon glyphicon-refresh glyphicon-spin" style="font-size: 48px; color: #3498db;"></i>
      <p>Loading transactions...</p>
    </div>
  </div>
</div>
