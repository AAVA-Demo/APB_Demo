<div class="transaction-list-container">
  <h2>Transaction History</h2>
  <div class="panel panel-default">
    <div class="panel-heading">
      <h4>Search and Filter</h4>
    </div>
    <div class="panel-body">
      <div class="row">
        <div class="col-xs-12 col-md-4">
          <div class="form-group">
            <label>Search Merchant</label>
            <input type="text" class="form-control" ng-model="vm.searchText" ng-change="vm.onSearchChange()" placeholder="Enter merchant name">
          </div>
        </div>
        <div class="col-xs-12 col-md-4">
          <div class="form-group">
            <label>Card</label>
            <select class="form-control" ng-model="vm.filters.cardId">
              <option value="">All Cards</option>
              <option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardType}} - {{card.cardNumber}}</option>
            </select>
          </div>
        </div>
        <div class="col-xs-12 col-md-4">
          <div class="form-group">
            <label>Category</label>
            <select class="form-control" ng-model="vm.filters.category">
              <option value="">All Categories</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Fuel">Fuel</option>
              <option value="Shopping">Shopping</option>
              <option value="Travel">Travel</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Utilities">Utilities</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Miscellaneous">Miscellaneous</option>
            </select>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-xs-12 col-md-3">
          <div class="form-group">
            <label>Date From</label>
            <input type="date" class="form-control" ng-model="vm.filters.dateFrom">
          </div>
        </div>
        <div class="col-xs-12 col-md-3">
          <div class="form-group">
            <label>Date To</label>
            <input type="date" class="form-control" ng-model="vm.filters.dateTo">
          </div>
        </div>
        <div class="col-xs-12 col-md-2">
          <div class="form-group">
            <label>Min Amount</label>
            <input type="number" class="form-control" ng-model="vm.filters.minAmount" placeholder="0">
          </div>
        </div>
        <div class="col-xs-12 col-md-2">
          <div class="form-group">
            <label>Max Amount</label>
            <input type="number" class="form-control" ng-model="vm.filters.maxAmount" placeholder="0">
          </div>
        </div>
        <div class="col-xs-12 col-md-2">
          <div class="form-group">
            <label>&nbsp;</label>
            <button class="btn btn-primary btn-block" ng-click="vm.applyFilters()">Apply</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-xs-12">
          <button class="btn btn-default" ng-click="vm.clearFilters()">Clear Filters</button>
        </div>
      </div>
    </div>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading transactions...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="row">
      <div class="col-xs-12">
        <p><strong>{{vm.transactions.length}}</strong> transactions found</p>
      </div>
    </div>
    <div class="row">
      <div class="col-xs-12" ng-repeat="transaction in vm.transactions track by transaction.transactionId">
        <transaction-card transaction="transaction"></transaction-card>
      </div>
    </div>
    <div ng-if="vm.transactions.length === 0" class="text-center">
      <p>No transactions found matching your criteria.</p>
    </div>
  </div>
</div>
