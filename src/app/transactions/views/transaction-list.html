<div class="row"><div class="col-md-12"><h1 class="page-header">Transaction History</h1></div></div><div class="row"><div class="col-md-12"><div class="filter-panel"><form class="form-inline"><div class="form-group"><input type="text" class="form-control" placeholder="Search merchant or description" ng-model="vm.filter.searchTerm" ng-change="vm.updateFilter()"></div><div class="form-group"><select class="form-control" ng-model="vm.filter.category" ng-change="vm.updateFilter()"><option value="">All Categories</option><option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option></select></div><button type="button" class="btn btn-default" ng-click="vm.clearFilter()">Clear Filters</button></form></div></div></div><div ng-if="vm.loading" class="loading-spinner"><i class="fa fa-spinner fa-spin"></i> Loading...</div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-12"><transaction-card ng-repeat="txn in vm.transactions" transaction="txn"></transaction-card><div ng-if="vm.transactions.length === 0" class="alert alert-info">No transactions found.</div></div></div></div>
