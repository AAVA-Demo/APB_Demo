<div><h2>Transaction History</h2><div class="filter-panel"><div class="row"><div class="col-md-3"><label>Search</label><input type="text" class="form-control" ng-model="vm.filters.searchTerm" ng-change="vm.onSearchChange()" placeholder="Search merchant or description"></div><div class="col-md-3"><label>Card</label><select class="form-control" ng-model="vm.filters.cardIds" multiple><option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardName}}</option></select></div><div class="col-md-2"><label>&nbsp;</label><br><button class="btn btn-primary" ng-click="vm.applyFilters()">Apply Filters</button></div></div></div><div ng-if="vm.loading" class="text-center"><p>Loading transactions...</p></div><div ng-if="!vm.loading"><transaction-list transactions="vm.transactions"></transaction-list><div class="text-center" style="margin-top:20px"><uib-pagination total-items="vm.pagination.totalRecords" ng-model="vm.pagination.currentPage" items-per-page="vm.pagination.pageSize" ng-change="vm.pageChanged()" max-size="5" boundary-links="true"></uib-pagination></div></div></div>
