<div class="row"><div class="col-md-12"><h2>Transaction History</h2></div></div><div class="filter-panel"><div class="row"><div class="col-md-3"><label>Card</label><select class="form-control" ng-model="vm.filters.cardIds" ng-change="vm.applyFilter()" multiple><option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardName}}</option></select></div><div class="col-md-3"><label>Date From</label><input type="date" class="form-control" ng-model="vm.filters.dateFrom" ng-change="vm.applyFilter()"></div><div class="col-md-3"><label>Date To</label><input type="date" class="form-control" ng-model="vm.filters.dateTo" ng-change="vm.applyFilter()"></div><div class="col-md-3"><label>Search</label><input type="text" class="form-control" ng-model="vm.filters.searchTerm" ng-change="vm.applyFilter()" placeholder="Merchant name..."></div></div></div><div ng-if="vm.loading" class="text-center"><p>Loading transactions...</p></div><div ng-if="!vm.loading"><transaction-list transactions="vm.transactions" pagination="vm.pagination"></transaction-list><div class="text-center"><ul class="pagination"><li ng-class="{disabled:vm.pagination.currentPage===1}"><a ng-click="vm.changePage(vm.pagination.currentPage-1)">&laquo;</a></li><li ng-repeat="page in [] | range:1:vm.pagination.totalPages" ng-class="{active:page===vm.pagination.currentPage}"><a ng-click="vm.changePage(page)">{{page}}</a></li><li ng-class="{disabled:vm.pagination.currentPage===vm.pagination.totalPages}"><a ng-click="vm.changePage(vm.pagination.currentPage+1)">&raquo;</a></li></ul></div></div>
