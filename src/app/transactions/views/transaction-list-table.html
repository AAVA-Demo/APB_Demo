<table class="table table-striped transaction-table"><thead><tr><th>Date</th><th>Merchant</th><th>Card</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr ng-repeat="txn in transactions"><td>{{txn.transactionDate|date:'short'}}</td><td>{{txn.merchantName}}</td><td>{{txn.cardName}}</td><td>{{txn.category}}</td><td>${{txn.amount|number:2}}</td><td><span class="label" ng-class="{'label-success':txn.status==='Posted','label-warning':txn.status==='Pending'}">{{txn.status}}</span></td></tr><tr ng-if="transactions.length===0"><td colspan="6" class="text-center">No transactions found</td></tr></tbody></table>
