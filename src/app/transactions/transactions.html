<div class="card-panel">
<h2>Transaction History</h2>
<div ng-if="vm.loading" class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading transactions...</p></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading&&!vm.error">
<div class="filter-section">
<div class="row">
<div class="col-md-4">
<label>Filter by Card:</label>
<select class="form-control" ng-model="vm.selectedCardId" ng-change="vm.filterByCard()">
<option value="">All Cards</option>
<option ng-repeat="card in vm.cards" value="{{card.cardId}}">{{card.cardType}} {{card.cardNumber}}</option>
</select>
</div>
<div class="col-md-4">
<label>Search:</label>
<input type="text" class="form-control" ng-model="vm.searchText" placeholder="Search by merchant or description">
</div>
</div>
</div>
<transaction-list transactions="vm.transactions" search-text="vm.searchText"></transaction-list>
</div>
</div>
