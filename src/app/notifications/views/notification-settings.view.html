<div class="row"><div class="col-md-8 col-md-offset-2"><div class="panel panel-default"><div class="panel-heading"><h3 class="panel-title">Notification Preferences</h3></div><div class="panel-body"><div ng-if="vm.loading" class="text-center"><p>Loading preferences...</p></div><form ng-if="!vm.loading" ng-submit="vm.savePreferences()"><div class="preference-toggle"><label><input type="checkbox" ng-model="vm.preferences.pushEnabled"> Enable Push Notifications</label></div><div class="preference-toggle"><label><input type="checkbox" ng-model="vm.preferences.smsEnabled"> Enable SMS Alerts</label></div><div class="preference-toggle"><label><input type="checkbox" ng-model="vm.preferences.emailEnabled"> Enable Email Alerts</label></div><div class="preference-toggle"><label><input type="checkbox" ng-model="vm.preferences.inAppEnabled"> Enable In-App Notifications</label></div><div class="form-group"><label for="preferredChannel">Preferred Channel</label><select id="preferredChannel" class="form-control" ng-model="vm.preferences.preferredChannel"><option value="push">Push</option><option value="sms">SMS</option><option value="email">Email</option><option value="in-app">In-App</option></select></div><div class="preference-toggle"><label><input type="checkbox" ng-model="vm.preferences.securityOverride" disabled> Security Override (Critical alerts use all channels)</label><p class="help-block">This setting is managed by your security policy and cannot be changed.</p></div><button type="submit" class="btn btn-primary" ng-disabled="vm.saving">{{vm.saving?'Saving...':'Save Preferences'}}</button></form></div></div></div></div>
