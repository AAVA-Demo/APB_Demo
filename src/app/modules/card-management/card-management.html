<div class="card-management-container">
  <h2>My Credit Cards</h2>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading cards...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-md-4">
      <cc-card-list cards="vm.cards" on-select="vm.selectCard(card)"></cc-card-list>
    </div>
    <div class="col-md-8">
      <cc-card-detail card="vm.selectedCard" ng-if="vm.selectedCard"></cc-card-detail>
    </div>
  </div>
</div>
