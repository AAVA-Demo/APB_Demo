<div ng-if="vm.loading" class="text-center"><h3>Loading...</h3></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><h2>My Credit Cards</h2><p class="text-muted">Manage and compare your {{vm.cards.length}} credit cards</p><div class="row"><div class="col-xs-12" ng-repeat="cardData in vm.cards track by cardData.card.cardId"><card-summary card="cardData" analysis="cardData.analysis" on-select="vm.selectCard(cardData)"></card-summary></div></div><div ng-if="vm.cards.length===0" class="alert alert-info">No credit cards found. Add your first card to get started.</div></div>
