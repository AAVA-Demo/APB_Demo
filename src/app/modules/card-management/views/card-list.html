<div class="card-list">
  <h2>My Credit Cards</h2>
  <div ng-if="vm.loading" class="loading-spinner">
    <p>Loading cards...</p>
  </div>
  <div ng-if="vm.error" class="error-message">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="filter-section">
      <div class="row">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Search cards..." ng-model="vm.filterText">
        </div>
        <div class="col-md-3">
          <select class="form-control" ng-model="vm.selectedStatus">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4" ng-repeat="card in vm.cards | filter:vm.filterCards track by card.cardId">
        <card-tile card="card" on-click="vm.viewCardDetails(cardId)"></card-tile>
      </div>
    </div>
    <div ng-if="(vm.cards | filter:vm.filterCards).length === 0" class="text-center" style="padding: 40px;">
      <p class="text-muted">No cards found matching your criteria.</p>
    </div>
  </div>
</div>
