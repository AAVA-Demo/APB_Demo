<div class="card-management-container"><h2>My Credit Cards</h2><div ng-if="vm.loading" class="text-center"><p>Loading cards...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-4 col-sm-6" ng-repeat="card in vm.cards"><div class="card-tile" ng-class="{selected:card.cardId===vm.selectedCardId}" ng-click="vm.selectCard(card.cardId)"><div class="card-number">{{card.getMaskedNumber()}}</div><div><strong>{{card.cardType}}</strong></div><div style="margin-top:10px"><small>Limit:</small> <strong>{{card.creditLimit | currency}}</strong></div><div><small>Outstanding:</small> <strong>{{card.outstandingBalance | currency}}</strong></div><div><small>Available:</small> <strong>{{card.availableCredit | currency}}</strong></div><div style="margin-top:10px"><span class="card-status" ng-class="{'status-active':card.isActive(),'status-blocked':!card.isActive()}">{{card.status}}</span></div></div></div></div></div></div>
