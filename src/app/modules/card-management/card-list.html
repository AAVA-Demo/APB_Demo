<div class="card-list-container">
<h2>My Credit Cards</h2>
<div ng-if="vm.loading" class="text-center">
<p>Loading cards...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">
{{vm.error}}
</div>
<div ng-if="!vm.loading && vm.cards.length === 0" class="alert alert-info">
No credit cards found.
</div>
<div ng-if="!vm.loading && vm.cards.length > 0">
<div class="form-group">
<input type="text" class="form-control" ng-model="vm.filterText" placeholder="Filter cards...">
</div>
<div class="row">
<div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in vm.cards | cardFilter:vm.filterText track by card.cardId">
<card-item card="card" on-select="vm.selectCard(card.cardId)"></card-item>
</div>
</div>
</div>
</div>
