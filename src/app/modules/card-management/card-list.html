<div class="row">
  <div class="col-md-12">
    <h2>My Credit Cards</h2>
    <p class="text-muted">View and manage all your credit cards</p>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-4" ng-repeat="card in vm.cards">
    <card-tile card="card" on-select="vm.selectCard(card)"></card-tile>
  </div>
</div>
<div class="row" ng-if="vm.loading">
  <div class="col-md-12 text-center">
    <p>Loading cards...</p>
  </div>
</div>
<div class="row" ng-if="!vm.loading && vm.cards.length === 0">
  <div class="col-md-12 text-center">
    <p>No credit cards found.</p>
  </div>
</div>
