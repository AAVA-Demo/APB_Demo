<div class="row">
  <div class="col-md-12">
    <h2>Fraud Alert Dashboard</h2>
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title">Test Transaction Processing</h3>
      </div>
      <div class="panel-body">
        <button class="btn btn-primary" ng-click="vm.processTestTransaction()">Process Test Transaction</button>
        <p class="text-muted" style="margin-top: 10px;">Simulates a transaction event for risk evaluation and alert creation</p>
      </div>
    </div>
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title">Active Alerts</h3>
        <button class="btn btn-sm btn-default pull-right" ng-click="vm.loadAlerts()" style="margin-top: -5px;">
          <span class="glyphicon glyphicon-refresh"></span> Refresh
        </button>
      </div>
      <div class="panel-body">
        <div ng-if="vm.loading" class="text-center">
          <p>Loading alerts...</p>
        </div>
        <div ng-if="!vm.loading && vm.alerts.length === 0" class="text-center text-muted">
          <p>No active alerts</p>
        </div>
        <alert-list alerts="vm.alerts" ng-if="!vm.loading && vm.alerts.length > 0"></alert-list>
      </div>
    </div>
  </div>
</div>
