<div class="portfolio-container">
  <div class="page-header">
    <h1>Portfolio <small>Manage Your Credit Cards</small></h1>
    <button class="btn btn-primary pull-right" ng-click="vm.openAddCardModal()" style="margin-top: -40px;">Add Card</button>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner"><i class="glyphicon glyphicon-refresh spinning"></i> Loading...</div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div ng-if="!vm.selectedCard">
      <card-list cards="vm.cards" metrics="vm.cardMetrics" on-select="vm.selectCard(card)"></card-list>
    </div>
    <div ng-if="vm.selectedCard">
      <button class="btn btn-default" ng-click="vm.selectedCard = null">&larr; Back to Portfolio</button>
      <card-detail card="vm.selectedCard" metrics="vm.cardMetrics[vm.selectedCard.cardId]"></card-detail>
    </div>
  </div>
  <div ng-if="vm.showAddCardModal" class="modal-backdrop fade in"></div>
  <div ng-if="vm.showAddCardModal" class="modal fade in" style="display: block;" role="dialog">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" ng-click="vm.closeAddCardModal()">&times;</button>
          <h4 class="modal-title">Add New Credit Card</h4>
        </div>
        <form name="vm.addCardForm" ng-submit="vm.addCard()">
          <div class="modal-body">
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" class="form-control" ng-model="vm.newCard.cardNumber" required ng-pattern="/^[0-9]{16}$/">
            </div>
            <div class="form-group">
              <label>Card Holder Name</label>
              <input type="text" class="form-control" ng-model="vm.newCard.cardHolderName" required>
            </div>
            <div class="form-group">
              <label>Card Type</label>
              <select class="form-control" ng-model="vm.newCard.cardType" required>
                <option value="">Select Type</option>
                <option value="Visa">Visa</option>
                <option value="MasterCard">MasterCard</option>
                <option value="Amex">American Express</option>
              </select>
            </div>
            <div class="form-group">
              <label>Issuer</label>
              <input type="text" class="form-control" ng-model="vm.newCard.issuer" required>
            </div>
            <div class="form-group">
              <label>Credit Limit</label>
              <input type="number" class="form-control" ng-model="vm.newCard.creditLimit" required>
            </div>
            <div class="form-group">
              <label>Expiry Date (MM/YY)</label>
              <input type="text" class="form-control" ng-model="vm.newCard.expiryDate" required ng-pattern="/^(0[1-9]|1[0-2])\/[0-9]{2}$/">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" ng-click="vm.closeAddCardModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" ng-disabled="vm.addCardForm.$invalid">Add Card</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
