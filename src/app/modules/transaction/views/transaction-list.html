<div class="transaction-container"><h2>Transaction History</h2><transaction-filter on-filter="vm.updateFilter(criteria)"></transaction-filter><div class="transaction-list"><div class="loading-spinner" ng-show="vm.loading">Loading transactions...</div><table class="table table-striped" ng-hide="vm.loading"><thead><tr><th>Date</th><th>Card</th><th>Merchant</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr ng-repeat="txn in vm.transactions track by txn.transactionId"><td>{{txn.date | date:'short'}}</td><td>{{txn.cardName}}</td><td>{{txn.merchant}}</td><td>{{txn.category}}</td><td>{{txn.amount | currency}}</td><td><span class="label" ng-class="{'label-success': txn.status === 'posted', 'label-warning': txn.status === 'pending'}">{{txn.status}}</span></td></tr><tr ng-if="vm.transactions.length === 0"><td colspan="6" class="text-center">No transactions found</td></tr></tbody></table><uib-pagination ng-hide="vm.loading" total-items="vm.pagination.totalRecords" ng-model="vm.pagination.page" items-per-page="vm.pagination.pageSize" ng-change="vm.pageChanged()" class="pagination-sm"></uib-pagination></div></div>
