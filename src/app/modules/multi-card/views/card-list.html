<div class="row">
  <div class="col-md-12">
    <h2>My Credit Cards</h2>
    <div ng-if="vm.loading" class="text-center"><p>Loading cards...</p></div>
    <div ng-if="vm.error" class="alert alert-danger alert-inline">{{vm.error}} <button class="btn btn-sm btn-primary" ng-click="vm.retry()">Retry</button></div>
    <div ng-if="!vm.loading && !vm.error">
      <div class="row">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Filter by card number, type, issuer, or status" ng-model="vm.filterText">
        </div>
        <div class="col-md-6 text-right">
          <p><strong>Total Cards:</strong> {{vm.portfolio.cardCount}} | <strong>Total Credit Limit:</strong> {{vm.portfolio.totalCreditLimit | currency}} | <strong>Total Available:</strong> {{vm.portfolio.totalAvailableCredit | currency}}</p>
        </div>
      </div>
      <div class="row" style="margin-top: 20px;">
        <div class="col-md-12">
          <card-list-item ng-repeat="card in vm.portfolio.cards | cardFilter:vm.filterText" card="card" on-select="vm.toggleCardSelection(card)" is-selected="vm.isSelected(card)"></card-list-item>
        </div>
      </div>
      <div class="row" ng-if="vm.showComparison">
        <div class="col-md-12">
          <card-comparison cards="vm.selectedCards"></card-comparison>
        </div>
      </div>
    </div>
  </div>
</div>
