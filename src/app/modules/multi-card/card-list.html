<div class="card-list-container">
<div class="page-header">
<h1>My Credit Cards</h1>
<button class="btn btn-primary" ng-click="vm.compareCards()" ng-disabled="vm.selectedCards.length<2">Compare Selected ({{vm.selectedCards.length}})</button>
</div>
<div ng-if="vm.loading" class="text-center">
<p>Loading cards...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="vm.portfolio" class="row">
<div class="col-md-4" ng-repeat="card in vm.portfolio.cards">
<card-tile card="card" on-select="vm.selectCard(card)" on-view="vm.viewCardDetail(card.cardId)"></card-tile>
</div>
</div>
<div ng-if="vm.portfolio" class="panel panel-default">
<div class="panel-heading">Portfolio Summary</div>
<div class="panel-body">
<div class="row">
<div class="col-md-3">
<strong>Total Cards:</strong> {{vm.portfolio.cardCount}}
</div>
<div class="col-md-3">
<strong>Total Credit Limit:</strong> {{vm.portfolio.totalCreditLimit|currency}}
</div>
<div class="col-md-3">
<strong>Available Credit:</strong> {{vm.portfolio.totalAvailableCredit|currency}}
</div>
<div class="col-md-3">
<strong>Total Outstanding:</strong> {{vm.portfolio.totalOutstanding|currency}}
</div>
</div>
</div>
</div>
</div>
