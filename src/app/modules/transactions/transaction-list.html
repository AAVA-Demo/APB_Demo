<div class="transaction-list-container">
  <div ng-if="vm.loading" class="text-center">
    <h3>Loading Transactions...</h3>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <h2>Transaction Management</h2>
    <div class="panel panel-default">
      <div class="panel-heading">
        <h4>Search and Filter</h4>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="col-md-3">
            <input type="text" class="form-control" placeholder="Search transactions..." ng-model="vm.filters.searchTerm" ng-change="vm.applyFilters()" ng-model-options="{debounce: 300}">
          </div>
          <div class="col-md-3">
            <input type="date" class="form-control" placeholder="From Date" ng-model="vm.filters.dateFrom" ng-change="vm.applyFilters()">
          </div>
          <div class="col-md-3">
            <input type="date" class="form-control" placeholder="To Date" ng-model="vm.filters.dateTo" ng-change="vm.applyFilters()">
          </div>
          <div class="col-md-3">
            <select class="form-control" ng-model="vm.filters.category" ng-change="vm.applyFilters()">
              <option value="">All Categories</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Fuel">Fuel</option>
              <option value="Shopping">Shopping</option>
              <option value="Travel">Travel</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Utilities">Utilities</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Miscellaneous">Miscellaneous</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Date</th>
            <th>Card</th>
            <th>Merchant</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="txn in vm.filteredTransactions">
            <td>{{txn.transactionDate | date:'MM/dd/yyyy'}}</td>
            <td>{{txn.cardName}}</td>
            <td>{{txn.merchantName}}</td>
            <td>{{txn.category}}</td>
            <td>${{txn.amount | number:2}}</td>
            <td><span class="label" ng-class="{'label-success': txn.status === 'Posted', 'label-warning': txn.status === 'Pending'}">{{txn.status}}</span></td>
            <td><button class="btn btn-sm btn-primary" ng-click="vm.viewDetail(txn.transactionId)">View</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <pagination current-page="vm.pagination.currentPage" total-pages="vm.pagination.totalPages" on-page-change="vm.changePage(page)"></pagination>
  </div>
</div>
