<div ng-if="vm.loading" class="text-center"><h3>Loading...</h3></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading&&!vm.error">
<h2>Transaction Management</h2>
<div class="filter-section">
<h4>Filter Transactions</h4>
<div class="row">
<div class="col-md-3">
<label>Start Date</label>
<input type="date" class="form-control" ng-model="vm.filterCriteria.startDate">
</div>
<div class="col-md-3">
<label>End Date</label>
<input type="date" class="form-control" ng-model="vm.filterCriteria.endDate">
</div>
<div class="col-md-3">
<label>Merchant</label>
<input type="text" class="form-control" ng-model="vm.filterCriteria.merchantName" placeholder="Search merchant">
</div>
<div class="col-md-3">
<label>Category</label>
<select class="form-control" ng-model="vm.filterCriteria.category">
<option value="">All Categories</option>
<option value="Food & Dining">Food & Dining</option>
<option value="Fuel">Fuel</option>
<option value="Shopping">Shopping</option>
<option value="Travel">Travel</option>
<option value="Entertainment">Entertainment</option>
<option value="Utilities">Utilities</option>
<option value="Healthcare">Healthcare</option>
<option value="Education">Education</option>
<option value="Miscellaneous">Miscellaneous</option>
</select>
</div>
</div>
<div class="row" style="margin-top:10px">
<div class="col-md-12">
<button class="btn btn-primary" ng-click="vm.applyFilters()">Apply Filters</button>
<button class="btn btn-default" ng-click="vm.clearFilters()">Clear Filters</button>
</div>
</div>
</div>
<div class="transaction-table">
<transaction-list transactions="vm.displayedTransactions"></transaction-list>
<div class="text-center" style="margin-top:20px">
<button class="btn btn-default" ng-click="vm.prevPage()" ng-disabled="vm.pagination.currentPage===1">Previous</button>
<span style="margin:0 15px">Page {{vm.pagination.currentPage}} of {{vm.pagination.totalPages}}</span>
<button class="btn btn-default" ng-click="vm.nextPage()" ng-disabled="vm.pagination.currentPage===vm.pagination.totalPages">Next</button>
</div>
</div>
</div>
