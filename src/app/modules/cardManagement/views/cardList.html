<div class="card-management-container">
  <div class="page-header">
    <h1>My Credit Cards</h1>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner">
      <span class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></span>
      <p>Loading credit cards...</p>
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="card-list">
    <div ng-if="vm.cards.length === 0" class="alert alert-info">
      <p>No credit cards found. Please add a credit card to get started.</p>
    </div>
    <card-list-item ng-repeat="card in vm.cards track by card.cardId" card="card" on-select="vm.selectCard(cardId)"></card-list-item>
  </div>
</div>
