<div class="card-management-container">
<h2>My Credit Cards</h2>
<div ng-if="vm.loading" class="text-center"><p>Loading cards...</p></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="vm.cards.length>0" class="row">
<div class="col-md-4">
<card-list cards="vm.cards" on-select="vm.selectCard(cardId)"></card-list>
</div>
<div class="col-md-8">
<card-detail card="vm.selectedCard" ng-if="vm.selectedCard"></card-detail>
</div>
</div>
</div>
