<div class="analytics-container"><h2>Spending Analytics</h2><div class="row"><div class="col-md-12"><div class="form-inline" style="margin-bottom: 20px;"><div class="form-group"><label>Start Date:</label><input type="date" class="form-control" ng-model="vm.filter.startDate"></div><div class="form-group"><label>End Date:</label><input type="date" class="form-control" ng-model="vm.filter.endDate"></div><div class="form-group"><label>Categories:</label><select class="form-control" ng-model="vm.filter.categories" multiple><option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option></select></div><button class="btn btn-primary" ng-click="vm.updateFilter()">Update</button></div></div></div><div class="loading-spinner" ng-show="vm.loading">Loading analytics...</div><div ng-hide="vm.loading"><div class="row"><div class="col-md-6"><div class="chart-container"><h3>Category-Wise Spending</h3><category-chart data="vm.categoryData"></category-chart></div></div><div class="col-md-6"><div class="chart-container"><h3>Monthly Spend Trends</h3><trend-chart data="vm.trendData"></trend-chart></div></div></div></div></div>
