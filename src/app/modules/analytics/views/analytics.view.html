<div ng-cloak>
  <h2>Spending Analytics & Insights</h2>
  <date-range-picker date-range="vm.dateRange" on-change="vm.updateDateRange()"></date-range-picker>
  <div ng-if="vm.loading" class="text-center" style="margin-top: 20px;">
    <i class="fa fa-spinner fa-spin fa-3x"></i>
    <p>Loading analytics...</p>
  </div>
  <div ng-if="vm.error && !vm.loading" class="alert alert-danger" style="margin-top: 20px;">
    {{vm.error}}
    <button class="btn btn-sm btn-primary" ng-click="vm.retry()">Retry</button>
  </div>
  <div ng-if="!vm.loading && vm.analyticsData" style="margin-top: 30px;">
    <div class="row">
      <div class="col-md-6">
        <spending-chart data="vm.analyticsData"></spending-chart>
      </div>
      <div class="col-md-6">
        <trend-chart data="vm.analyticsData"></trend-chart>
      </div>
    </div>
    <div class="row" style="margin-top: 30px;">
      <div class="col-md-12">
        <div class="chart-container">
          <h3>Category Breakdown</h3>
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Category</th>
                <th>Amount</th>
                <th>Percentage</th>
                <th>Transactions</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="cat in vm.analyticsData.categorySpending">
                <td>{{cat.category}}</td>
                <td>{{cat.amount | currency}}</td>
                <td>{{cat.percentage}}%</td>
                <td>{{cat.transactionCount}}</td>
              </tr>
            </tbody>
          </table>
          <p><strong>Total Spend:</strong> {{vm.analyticsData.totalSpend | currency}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
