<div class="row">
<div class="col-xs-12">
<h2>Spending Analytics</h2>
</div>
</div>
<div class="row">
<div class="col-xs-12 col-sm-6 col-md-4">
<div class="form-group">
<label>Date Range</label>
<select class="form-control" ng-model="vm.dateRange">
<option value="1M">Last Month</option>
<option value="3M">Last 3 Months</option>
<option value="6M">Last 6 Months</option>
<option value="1Y">Last Year</option>
</select>
</div>
</div>
<div class="col-xs-12 col-sm-6 col-md-4">
<div class="form-group">
<label>Filter by Card</label>
<input type="text" class="form-control" ng-model="vm.selectedCard" ng-change="vm.filterByCard()" placeholder="Card ID">
</div>
</div>
</div>
<div class="row" ng-if="vm.loading">
<div class="col-xs-12 text-center">
<p>Loading analytics...</p>
</div>
</div>
<div class="row" ng-if="vm.error">
<div class="col-xs-12">
<div class="alert alert-danger">{{vm.error}}</div>
</div>
</div>
<div class="row" ng-if="!vm.loading&&vm.analyticsData">
<div class="col-xs-12 col-md-6">
<h3>Category-wise Spending</h3>
<spending-chart chart-data="vm.analyticsData" chart-type="pie"></spending-chart>
</div>
<div class="col-xs-12 col-md-6">
<h3>Card-wise Spend</h3>
<spending-chart chart-data="vm.analyticsData" chart-type="bar"></spending-chart>
</div>
</div>
<div class="row" ng-if="!vm.loading&&vm.analyticsData">
<div class="col-xs-12">
<h3>Monthly Spend Trends</h3>
<spending-chart chart-data="vm.analyticsData" chart-type="line"></spending-chart>
</div>
</div>
<div class="row" ng-if="!vm.loading&&vm.analyticsData">
<div class="col-xs-12">
<h3>Category Breakdown</h3>
<table class="table table-striped">
<thead>
<tr>
<th>Category</th>
<th>Amount</th>
<th>Percentage</th>
</tr>
</thead>
<tbody>
<tr ng-repeat="cat in vm.analyticsData.categoryBreakdown">
<td>{{cat.category}}</td>
<td>{{cat.amount | currency}}</td>
<td>{{cat.percentage}}%</td>
</tr>
</tbody>
</table>
</div>
</div>
