<div class="analytics-container"><h2>Spending Analytics</h2><div class="filter-bar"><label>Period:</label><select ng-model="vm.period" ng-change="vm.applyFilter(vm.period)" class="form-control" style="width:200px;display:inline-block;margin-left:10px"><option value="3months">Last 3 Months</option><option value="6months">Last 6 Months</option><option value="12months">Last 12 Months</option></select></div><div ng-if="vm.loading" class="text-center"><p>Loading analytics...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-6"><category-chart config="vm.categoryChartConfig"></category-chart></div><div class="col-md-6"><card-spend-chart config="vm.cardSpendChartConfig"></card-spend-chart></div></div><div class="row" style="margin-top:20px"><div class="col-md-12"><trend-chart config="vm.trendChartConfig"></trend-chart></div></div></div></div>
