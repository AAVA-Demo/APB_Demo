<div class="analytics-container">
  <div class="page-header">
    <h1>Spending Analytics & Insights</h1>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner">
      <span class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></span>
      <p>Loading analytics...</p>
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="analytics-content">
    <div class="row">
      <div class="col-md-6">
        <div class="panel panel-primary">
          <div class="panel-heading">
            <h3 class="panel-title">Category-Wise Spending</h3>
          </div>
          <div class="panel-body" style="height: 400px;">
            <spending-chart data="vm.categorySpending"></spending-chart>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel panel-info">
          <div class="panel-heading">
            <h3 class="panel-title">Monthly Spend Trends</h3>
          </div>
          <div class="panel-body" style="height: 400px;">
            <trend-chart data="vm.monthlyTrends"></trend-chart>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">Category Breakdown Details</h3>
          </div>
          <div class="panel-body">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Category</th>
                  <th class="text-right">Total Amount</th>
                  <th class="text-right">Transactions</th>
                  <th class="text-right">Percentage</th>
                </tr>
              </thead>
              <tbody>
                <tr ng-repeat="cat in vm.categorySpending">
                  <td><strong>{{cat.category}}</strong></td>
                  <td class="text-right">${{cat.totalAmount | number:2}}</td>
                  <td class="text-right">{{cat.transactionCount}}</td>
                  <td class="text-right">{{cat.percentage}}%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
