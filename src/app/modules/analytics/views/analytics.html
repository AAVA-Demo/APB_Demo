<div class="analytics-container">
<h2>Spending Analytics</h2>
<div ng-if="vm.loading" class="text-center"><p>Loading...</p></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && !vm.error">
<div class="row">
<div class="col-md-6">
<h3>Category-Wise Spending</h3>
<category-chart data="vm.categorySpend"></category-chart>
<table class="table table-striped">
<thead><tr><th>Category</th><th>Amount</th><th>Transactions</th><th>%</th></tr></thead>
<tbody>
<tr ng-repeat="cat in vm.categorySpend">
<td>{{cat.category}}</td>
<td>{{cat.totalAmount|currency}}</td>
<td>{{cat.transactionCount}}</td>
<td>{{cat.percentage}}%</td>
</tr>
</tbody>
</table>
</div>
<div class="col-md-6">
<h3>Monthly Spend Trends</h3>
<trend-chart data="vm.monthlyTrends"></trend-chart>
</div>
</div>
</div>
</div>
