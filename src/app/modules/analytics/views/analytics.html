<div ng-if="vm.loading" class="text-center"><h3>Loading...</h3></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><h2>Transaction Analytics</h2><div class="filter-section"><button ng-if="vm.selectedMonth" class="btn btn-sm btn-warning" ng-click="vm.clearFilter()">Clear Filter ({{vm.selectedMonth}})</button></div><div class="row"><div class="col-xs-12 col-md-6"><div class="chart-container"><h3>Monthly Spend Trends</h3><trend-chart config="vm.trendChartConfig" on-select="vm.filterByMonth(month)"></trend-chart></div></div><div class="col-xs-12 col-md-6"><div class="chart-container"><h3>Category-wise Spending</h3><category-chart config="vm.categoryChartConfig"></category-chart></div></div></div><div class="row"><div class="col-xs-12"><div class="chart-container"><h3>Category Breakdown</h3><ul class="category-list"><li class="category-item" ng-repeat="cat in vm.categorySpend|orderBy:'-totalAmount'"><span class="category-name">{{cat.category}}</span><span class="category-amount">${{cat.totalAmount|number:2}} ({{cat.percentage|number:1}}%)</span></li></ul></div></div></div></div>
