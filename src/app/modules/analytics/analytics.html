<div class="analytics-container">
<h2>Spending Analytics & Insights</h2>
<div ng-if="vm.loading" class="loading">
<p>Loading analytics...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger error-alert">
<strong>Error:</strong> {{vm.error}}
<button class="btn btn-sm btn-primary" ng-click="vm.retry()">Retry</button>
</div>
<div ng-if="!vm.loading&&!vm.error">
<div class="row">
<div class="col-xs-12">
<h3>Monthly Spend Trends</h3>
<div class="chart-container">
<canvas class="chart chart-line" chart-data="vm.monthlyTrendData.data" chart-labels="vm.monthlyTrendData.labels" chart-series="vm.monthlyTrendData.series" chart-options="vm.monthlyTrendData.options"></canvas>
</div>
</div>
</div>
<div class="row">
<div class="col-xs-12 col-md-6">
<h3>Card-wise Spend Analysis</h3>
<div class="chart-container">
<canvas class="chart chart-bar" chart-data="vm.cardWiseData.data" chart-labels="vm.cardWiseData.labels" chart-series="vm.cardWiseData.series" chart-options="vm.cardWiseData.options"></canvas>
</div>
</div>
<div class="col-xs-12 col-md-6">
<h3>Category-wise Spending Breakdown</h3>
<div class="chart-container category-chart">
<canvas class="chart chart-pie" chart-data="vm.categoryWiseData.data" chart-labels="vm.categoryWiseData.labels" chart-options="vm.categoryWiseData.options"></canvas>
</div>
</div>
</div>
</div>
</div>
