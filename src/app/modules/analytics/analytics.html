<div ng-if="vm.loading" class="loading-spinner"><i class="glyphicon glyphicon-refresh spinning"></i> Loading analytics...</div>
<div ng-if="vm.error" class="error-banner">{{vm.error}}</div>
<div ng-if="!vm.loading">
<h2>Spending Analytics</h2>
<div class="filter-panel">
<h4>Date Range Filter</h4>
<div class="row">
<div class="col-md-3">
<label>Start Date</label>
<input type="date" class="form-control" ng-model="vm.dateRange.startDate">
</div>
<div class="col-md-3">
<label>End Date</label>
<input type="date" class="form-control" ng-model="vm.dateRange.endDate">
</div>
<div class="col-md-3" style="padding-top:25px;">
<button class="btn btn-primary" ng-click="vm.applyDateFilter()">Apply Filter</button>
</div>
</div>
</div>
<div class="row">
<div class="col-md-6">
<spending-chart data="vm.categoryBreakdown" chart-type="category" title="Category-wise Spending"></spending-chart>
</div>
<div class="col-md-6">
<spending-chart data="vm.cardWiseSpend" chart-type="cardwise" title="Card-wise Spend Analysis"></spending-chart>
</div>
</div>
<div class="row">
<div class="col-md-12">
<spending-chart data="vm.monthlyTrend" chart-type="monthly" title="Monthly Spend Trend"></spending-chart>
</div>
</div>
</div>
