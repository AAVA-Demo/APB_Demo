<div class="analytics-container">
  <h2>Spending Analytics</h2>
  <div class="btn-group" role="group">
    <button type="button" class="btn btn-default" ng-class="{active: vm.viewMode === 'category'}" ng-click="vm.switchView('category')">Category-Wise</button>
    <button type="button" class="btn btn-default" ng-class="{active: vm.viewMode === 'trend'}" ng-click="vm.switchView('trend')">Monthly Trends</button>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading analytics...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div ng-if="vm.viewMode === 'category'">
      <h3>Category-Wise Spending</h3>
      <chart-directive chart-data="vm.categoryData" chart-type="'pie'"></chart-directive>
    </div>
    <div ng-if="vm.viewMode === 'trend'">
      <h3>Monthly Spend Trends</h3>
      <chart-directive chart-data="vm.trendData" chart-type="'line'"></chart-directive>
    </div>
  </div>
</div>
