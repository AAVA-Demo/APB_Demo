<div class="analytics-container">
  <div class="page-header">
    <h1>Analytics <small>Spending Insights</small></h1>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner"><i class="glyphicon glyphicon-refresh spinning"></i> Loading...</div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="row">
      <div class="col-xs-12 col-md-6">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">Category-wise Spending</h3>
          </div>
          <div class="panel-body">
            <chart-directive chart-data="vm.categorySpend" chart-type="pie" on-click="vm.onCategoryClick(category)"></chart-directive>
          </div>
        </div>
      </div>
      <div class="col-xs-12 col-md-6">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">Monthly Spend Trends</h3>
          </div>
          <div class="panel-body">
            <chart-directive chart-data="vm.monthlyTrends" chart-type="line"></chart-directive>
          </div>
        </div>
      </div>
    </div>
    <div ng-if="vm.selectedCategory" class="row">
      <div class="col-xs-12">
        <div class="panel panel-info">
          <div class="panel-heading">
            <h3 class="panel-title">Transactions in {{vm.selectedCategory}} <button class="btn btn-xs btn-default pull-right" ng-click="vm.clearCategoryFilter()">Clear Filter</button></h3>
          </div>
          <div class="panel-body">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Merchant</th>
                  <th>Description</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody>
                <tr ng-repeat="txn in vm.filteredTransactions">
                  <td>{{txn.transactionDate | date:'short'}}</td>
                  <td>{{txn.merchantName}}</td>
                  <td>{{txn.description}}</td>
                  <td>{{txn.amount | currency}}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
