<div class="dashboard-container">
  <h2 class="mb-4">Credit Card Dashboard</h2>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="vm.kpis && !vm.loading" class="row">
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Monthly Spend" value="vm.kpis.monthlySpend" icon="fas fa-credit-card"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="fas fa-wallet"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Available Credit" value="vm.kpis.availableCredit" icon="fas fa-money-bill-wave"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card label="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="fas fa-exclamation-circle"></kpi-card>
    </div>
  </div>
  <div ng-if="vm.kpis && !vm.loading" class="row mt-4">
    <div class="col-12">
      <div class="card p-3">
        <h5>Overall Utilization</h5>
        <div class="progress" style="height: 25px;">
          <div class="progress-bar" role="progressbar" 
               ng-style="{width: vm.kpis.overallUtilization + '%'}" 
               aria-valuenow="{{vm.kpis.overallUtilization}}" 
               aria-valuemin="0" 
               aria-valuemax="100">
            {{vm.kpis.overallUtilization}}%
          </div>
        </div>
        <small class="text-muted mt-2">Last updated: {{vm.kpis.lastUpdated | date:'short'}}</small>
      </div>
    </div>
  </div>
</div>
