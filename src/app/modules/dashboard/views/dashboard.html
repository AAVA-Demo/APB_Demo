<div class="dashboard-container">
<h2>Credit Card Dashboard</h2>
<div ng-if="vm.loading" class="text-center">
<p>Loading dashboard...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">
{{vm.error}}
</div>
<div ng-if="vm.dashboardData && !vm.loading" class="row kpi-row">
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-widget kpi="vm.dashboardData.monthlySpend"></kpi-widget>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-widget kpi="vm.dashboardData.totalCreditLimit"></kpi-widget>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-widget kpi="vm.dashboardData.availableCredit"></kpi-widget>
</div>
<div class="col-xs-12 col-sm-6 col-md-3">
<kpi-widget kpi="vm.dashboardData.outstandingAmount"></kpi-widget>
</div>
</div>
<div ng-if="vm.dashboardData" class="text-muted small text-right">
Last updated: {{vm.dashboardData.lastUpdated | date:'short'}}
</div>
</div>
