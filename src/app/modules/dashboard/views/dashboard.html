<div class="dashboard-container"><div class="loading-spinner" ng-show="vm.loading"><i class="glyphicon glyphicon-refresh spinning"></i> Loading...</div><div ng-hide="vm.loading"><div class="row"><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget label="Monthly Spend" kpi-data="vm.kpis.monthlySpend"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget label="Total Credit Limit" kpi-data="vm.kpis.totalCreditLimit"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget label="Available Credit" kpi-data="vm.kpis.availableCredit"></kpi-widget></div><div class="col-md-3 col-sm-6 col-xs-12"><kpi-widget label="Outstanding Amount" kpi-data="vm.kpis.outstandingAmount"></kpi-widget></div></div><div class="row"><div class="col-md-12"><h3>Your Credit Cards</h3><div ng-repeat="card in vm.cards" class="card-overview"><h4>{{card.cardName}} - {{card.cardNumber}}</h4><p>Credit Limit: {{card.creditLimit | currency}} | Available: {{card.availableCredit | currency}} | Outstanding: {{card.outstandingAmount | currency}}</p><span class="label" ng-class="{'label-success': card.status === 'active', 'label-danger': card.status === 'blocked'}">{{card.status}}</span></div></div></div></div></div>
