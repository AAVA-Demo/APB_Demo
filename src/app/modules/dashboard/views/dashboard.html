<div class="dashboard-container">
<h1>Credit Card Dashboard</h1>
<div ng-if="vm.loading" class="text-center">
<p>Loading KPIs...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">
{{vm.error}}
<button class="btn btn-sm btn-primary" ng-click="vm.loadKPIs()">Retry</button>
</div>
<div ng-if="!vm.loading && !vm.error" class="row kpi-row">
<div class="col-md-3 col-sm-6">
<kpi-card title="Monthly Spend" value="vm.kpis.monthlySpend" icon="glyphicon-credit-card"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="glyphicon-piggy-bank"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="Available Credit" value="vm.kpis.availableCredit" icon="glyphicon-ok-circle"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="glyphicon-exclamation-sign"></kpi-card>
</div>
</div>
<div ng-if="!vm.loading && !vm.error" class="text-muted text-right">
<small>Last updated: {{vm.kpis.lastUpdated | date:'short'}}</small>
</div>
</div>
