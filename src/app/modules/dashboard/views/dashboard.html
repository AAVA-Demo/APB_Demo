<div class="dashboard-container">
  <div class="page-header">
    <h1>Credit Card Dashboard <small>Overview of your financial health</small></h1>
    <button class="btn btn-primary pull-right" ng-click="vm.refreshKpis()" ng-disabled="vm.loading">
      <span class="glyphicon glyphicon-refresh" ng-class="{'glyphicon-refresh-animate': vm.loading}"></span> Refresh
    </button>
  </div>
  <div class="alert alert-danger" ng-if="vm.error">{{vm.error}}</div>
  <div class="row" ng-if="!vm.loading">
    <div class="col-md-3 col-sm-6">
      <kpi-card title="Monthly Spend" value="vm.kpis.monthlySpend" icon="glyphicon-shopping-cart" color="panel-primary"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card title="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="glyphicon-credit-card" color="panel-success"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card title="Available Credit" value="vm.kpis.availableCredit" icon="glyphicon-ok-circle" color="panel-info"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card title="Outstanding Amount" value="vm.kpis.outstandingAmount" icon="glyphicon-exclamation-sign" color="panel-warning"></kpi-card>
    </div>
  </div>
  <div class="text-center" ng-if="vm.loading">
    <div class="spinner"><i class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></i> Loading dashboard...</div>
  </div>
  <div class="last-refreshed" ng-if="vm.lastRefreshed">
    <small class="text-muted">Last refreshed: {{vm.lastRefreshed | date:'medium'}}</small>
  </div>
</div>
