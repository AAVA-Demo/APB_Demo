<div ng-if="vm.loading" class="text-center"><h3>Loading...</h3></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading&&!vm.error"><div class="row"><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card label="Monthly Spend" value="${{vm.kpis.monthlySpend|number:2}}"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card label="Total Credit Limit" value="${{vm.kpis.totalCreditLimit|number:2}}"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card label="Available Credit" value="${{vm.kpis.totalAvailableCredit|number:2}}"></kpi-card></div><div class="col-xs-12 col-sm-6 col-md-3"><kpi-card label="Outstanding Amount" value="${{vm.kpis.totalOutstandingAmount|number:2}}"></kpi-card></div></div><div class="row"><div class="col-xs-12"><div class="kpi-card"><p><strong>Total Cards:</strong> {{vm.kpis.cardCount}}</p><p><strong>Utilization Rate:</strong> {{vm.kpis.utilizationRate}}%</p><p><small>Last Updated: {{vm.kpis.lastUpdated|date:'short'}}</small></p></div></div></div><div class="row"><div class="col-xs-12 col-sm-6"><a href="#/cards" class="btn btn-primary btn-block">Manage Cards</a></div><div class="col-xs-12 col-sm-6"><a href="#/analytics" class="btn btn-info btn-block">View Analytics</a></div></div></div>
