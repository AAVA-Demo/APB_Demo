<div class="dashboard-container">
  <h2>Credit Card Dashboard</h2>
  <div ng-if="vm.loading" class="alert alert-info">Loading dashboard data...</div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="vm.kpis && !vm.loading">
    <div class="row">
      <div class="col-md-3 col-sm-6">
        <kpi-card title="Monthly Spend" value="vm.kpis.monthlySpend" icon="credit-card"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-card title="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="list-alt"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-card title="Available Credit" value="vm.kpis.totalAvailableCredit" icon="ok-circle"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-card title="Outstanding Amount" value="vm.kpis.totalOutstanding" icon="exclamation-sign"></kpi-card>
      </div>
    </div>
    <div class="row" style="margin-top: 30px;">
      <div class="col-md-12">
        <h3>Card Summary</h3>
        <card-summary cards="vm.kpis.cards"></card-summary>
      </div>
    </div>
  </div>
</div>
