<div class="dashboard-container">
<div class="page-header">
<h1>Credit Card Dashboard <small ng-if="vm.lastUpdated">Last updated: {{vm.lastUpdated | date:'short'}}</small></h1>
<button class="btn btn-primary pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading">Refresh</button>
</div>
<div ng-if="vm.loading" class="text-center">
<i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...
</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="vm.kpis && !vm.loading" class="kpi-grid">
<div class="row">
<div class="col-md-3 col-sm-6">
<kpi-card title="Monthly Spend" value="₹{{vm.kpis.monthlySpend | number:0}}" icon="glyphicon-shopping-cart"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="Total Credit Limit" value="₹{{vm.kpis.totalCreditLimit | number:0}}" icon="glyphicon-credit-card"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="Available Credit" value="₹{{vm.kpis.availableCredit | number:0}}" icon="glyphicon-ok-circle"></kpi-card>
</div>
<div class="col-md-3 col-sm-6">
<kpi-card title="Outstanding Amount" value="₹{{vm.kpis.outstandingAmount | number:0}}" icon="glyphicon-exclamation-sign"></kpi-card>
</div>
</div>
<div class="row" style="margin-top:20px;">
<div class="col-md-12">
<div class="panel panel-info">
<div class="panel-heading"><h3 class="panel-title">Portfolio Summary</h3></div>
<div class="panel-body">
<p><strong>Total Cards:</strong> {{vm.kpis.cardCount}}</p>
<p><strong>Credit Utilization:</strong> {{((vm.kpis.outstandingAmount / vm.kpis.totalCreditLimit) * 100).toFixed(1)}}%</p>
</div>
</div>
</div>
</div>
</div>
</div>
