<div ng-controller="DashboardController as vm">
<div class="row">
<div class="col-md-12">
<h2>Credit Card Dashboard</h2>
<button class="btn btn-primary btn-refresh" ng-click="vm.refresh()">Refresh Dashboard</button>
</div>
</div>
<div ng-if="vm.loading">
<p>Loading dashboard...</p>
</div>
<div ng-if="!vm.loading && vm.kpis">
<div class="row">
<div class="col-md-3 col-sm-6">
<kpi-widget label="Monthly Spend" value="vm.kpis.totalMonthlySpend" icon="💳"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget label="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="💰"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget label="Available Credit" value="vm.kpis.totalAvailableCredit" icon="✓"></kpi-widget>
</div>
<div class="col-md-3 col-sm-6">
<kpi-widget label="Outstanding Amount" value="vm.kpis.totalOutstanding" icon="⚠"></kpi-widget>
</div>
</div>
<div class="row">
<div class="col-md-12">
<h3>Your Credit Cards ({{vm.kpis.cardCount}})</h3>
</div>
</div>
<div class="row">
<div class="col-md-6" ng-repeat="card in vm.kpis.cards">
<credit-card-summary card="card"></credit-card-summary>
</div>
</div>
</div>
</div>
