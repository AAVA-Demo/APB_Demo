<div class="dashboard-container"><h2>Credit Card Dashboard</h2><div ng-if="vm.loading" class="text-center"><p>Loading dashboard...</p></div><div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div><div ng-if="!vm.loading && !vm.error"><div class="row"><div class="col-md-3 col-sm-6"><kpi-widget title="Monthly Spend" value="{{vm.kpis.monthlySpend | currency}}"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget title="Total Credit Limit" value="{{vm.kpis.totalCreditLimit | currency}}"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget title="Available Credit" value="{{vm.kpis.totalAvailableCredit | currency}}"></kpi-widget></div><div class="col-md-3 col-sm-6"><kpi-widget title="Outstanding Amount" value="{{vm.kpis.totalOutstanding | currency}}"></kpi-widget></div></div><div class="row" style="margin-top:20px"><div class="col-md-12"><div class="panel panel-default"><div class="panel-heading"><h4>Card Overview</h4></div><div class="panel-body"><table class="table table-striped"><thead><tr><th>Card</th><th>Credit Limit</th><th>Outstanding</th><th>Available</th></tr></thead><tbody><tr ng-repeat="card in vm.kpis.cards"><td>****{{card.cardId.slice(-4)}}</td><td>{{card.creditLimit | currency}}</td><td>{{card.outstanding | currency}}</td><td>{{card.availableCredit | currency}}</td></tr></tbody></table></div></div></div></div><div class="text-muted" style="margin-top:10px;font-size:12px">Last updated: {{vm.kpis.lastUpdated | date:'short'}}</div></div></div>
