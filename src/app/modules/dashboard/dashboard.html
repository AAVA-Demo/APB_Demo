<div ng-if="vm.loading" class="text-center"><h3>Loading...</h3></div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading&&!vm.error">
<h2>Dashboard Overview</h2>
<div class="row">
<div class="col-md-3 col-sm-6 col-xs-12">
<kpi-card label="'Monthly Spend'" value="vm.kpis.monthlySpend" format="'currency'"></kpi-card>
</div>
<div class="col-md-3 col-sm-6 col-xs-12">
<kpi-card label="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" format="'currency'"></kpi-card>
</div>
<div class="col-md-3 col-sm-6 col-xs-12">
<kpi-card label="'Available Credit'" value="vm.kpis.totalAvailableCredit" format="'currency'"></kpi-card>
</div>
<div class="col-md-3 col-sm-6 col-xs-12">
<kpi-card label="'Outstanding Amount'" value="vm.kpis.totalOutstanding" format="'currency'"></kpi-card>
</div>
</div>
<h3>Your Credit Cards</h3>
<div class="row">
<div class="col-md-4 col-sm-6 col-xs-12" ng-repeat="card in vm.cards track by card.cardId">
<div class="card-item">
<h4>{{card.cardType}}</h4>
<div class="card-number">{{card.cardNumber}}</div>
<div class="card-detail">
<span><strong>Credit Limit:</strong> ${{card.creditLimit|number:2}}</span>
</div>
<div class="card-detail">
<span><strong>Available:</strong> ${{card.availableCredit|number:2}}</span>
<span><strong>Outstanding:</strong> ${{card.outstandingAmount|number:2}}</span>
</div>
</div>
</div>
</div>
</div>
