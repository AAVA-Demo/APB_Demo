<div class="dashboard-container">
  <div ng-if="vm.loading" class="text-center">
    <h3>Loading Dashboard...</h3>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error">
    <h2>Credit Card Dashboard</h2>
    <div class="row kpi-section">
      <div class="col-md-3 col-sm-6">
        <kpi-widget label="'Monthly Spend'" value="vm.kpis.monthlySpend" format="'currency'"></kpi-widget>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-widget label="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" format="'currency'"></kpi-widget>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-widget label="'Available Credit'" value="vm.kpis.totalAvailableCredit" format="'currency'"></kpi-widget>
      </div>
      <div class="col-md-3 col-sm-6">
        <kpi-widget label="'Total Outstanding'" value="vm.kpis.totalOutstanding" format="'currency'"></kpi-widget>
      </div>
    </div>
    <div class="row card-section">
      <h3>Your Credit Cards</h3>
      <div class="col-md-4 col-sm-6" ng-repeat="card in vm.cards">
        <card-tile card="card"></card-tile>
      </div>
    </div>
  </div>
</div>
