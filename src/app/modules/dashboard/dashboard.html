<div class="dashboard-container">
  <div class="page-header">
    <h1>Dashboard <small>Credit Card Overview</small></h1>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <div class="spinner"><i class="glyphicon glyphicon-refresh spinning"></i> Loading...</div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    <strong>Error:</strong> {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card icon="glyphicon-shopping-cart" label="Monthly Spend" value="{{vm.kpiData.monthlySpend | currency}}" color="primary"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card icon="glyphicon-credit-card" label="Total Credit Limit" value="{{vm.kpiData.totalCreditLimit | currency}}" color="success"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card icon="glyphicon-ok-circle" label="Available Credit" value="{{vm.kpiData.totalAvailableCredit | currency}}" color="info"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card icon="glyphicon-exclamation-sign" label="Outstanding Amount" value="{{vm.kpiData.totalOutstanding | currency}}" color="warning"></kpi-card>
    </div>
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row" style="margin-top: 20px;">
    <div class="col-xs-12">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h3 class="panel-title">Credit Utilization</h3>
        </div>
        <div class="panel-body">
          <div class="progress">
            <div class="progress-bar" role="progressbar" ng-style="{'width': vm.kpiData.creditUtilization + '%'}" aria-valuenow="{{vm.kpiData.creditUtilization}}" aria-valuemin="0" aria-valuemax="100">
              {{vm.kpiData.creditUtilization | number:1}}%
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
