<div class="dashboard-container">
  <div class="row">
    <div class="col-md-12">
      <h2>Credit Card Dashboard
        <button class="btn btn-sm btn-primary pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading">
          <span ng-if="!vm.loading">Refresh</span>
          <span ng-if="vm.loading">Loading...</span>
        </button>
      </h2>
      <hr>
    </div>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="vm.loading && !vm.kpis" class="text-center">
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.kpis">
    <div class="row">
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="'Monthly Spend'" value="vm.kpis.monthlySpend" format="'currency'"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="'Total Credit Limit'" value="vm.kpis.totalCreditLimit" format="'currency'"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="'Available Credit'" value="vm.kpis.availableCredit" format="'currency'"></kpi-card>
      </div>
      <div class="col-xs-12 col-sm-6 col-md-3">
        <kpi-card title="'Outstanding Amount'" value="vm.kpis.outstandingAmount" format="'currency'"></kpi-card>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <h3>Your Credit Cards</h3>
        <div class="card-item" ng-repeat="card in vm.kpis.cards">
          <h4>{{card.name}} - ****{{card.lastFourDigits}}</h4>
          <div class="row">
            <div class="col-sm-4">
              <strong>Credit Limit:</strong> {{card.creditLimit | currency}}
            </div>
            <div class="col-sm-4">
              <strong>Current Balance:</strong> {{card.currentBalance | currency}}
            </div>
            <div class="col-sm-4">
              <strong>Available Credit:</strong> {{card.availableCredit | currency}}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
