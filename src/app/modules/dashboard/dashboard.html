<div class="dashboard-container">
  <h2>Financial Overview</h2>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-xs-12 col-sm-6 col-md-3">
      <div class="kpi-card">
        <h4>Monthly Spend</h4>
        <p class="kpi-value">{{vm.kpis.monthlySpend | currency}}</p>
      </div>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <div class="kpi-card">
        <h4>Total Credit Limit</h4>
        <p class="kpi-value">{{vm.kpis.totalCreditLimit | currency}}</p>
      </div>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <div class="kpi-card">
        <h4>Available Credit</h4>
        <p class="kpi-value">{{vm.kpis.totalAvailableCredit | currency}}</p>
      </div>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <div class="kpi-card">
        <h4>Outstanding Amount</h4>
        <p class="kpi-value">{{vm.kpis.totalOutstanding | currency}}</p>
      </div>
    </div>
  </div>
</div>
