<div class="dashboard-container">
  <div class="row">
    <div class="col-xs-12">
      <h2>Credit Card Dashboard</h2>
      <button class="btn btn-primary pull-right" ng-click="vm.refresh()" ng-disabled="vm.loading">Refresh</button>
    </div>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row kpi-row">
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Monthly Spend" value="vm.kpiData.monthlySpend" icon="glyphicon glyphicon-credit-card"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Total Credit Limit" value="vm.kpiData.totalCreditLimit" icon="glyphicon glyphicon-piggy-bank"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Available Credit" value="vm.kpiData.availableCredit" icon="glyphicon glyphicon-ok-circle"></kpi-card>
    </div>
    <div class="col-xs-12 col-sm-6 col-md-3">
      <kpi-card title="Outstanding Amount" value="vm.kpiData.outstandingAmount" icon="glyphicon glyphicon-warning-sign"></kpi-card>
    </div>
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-xs-12">
      <p class="text-muted">Last updated: {{vm.kpiData.lastUpdated | date:'medium'}}</p>
    </div>
  </div>
</div>
