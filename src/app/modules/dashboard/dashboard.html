<div class="dashboard-container">
<div class="page-header">
<h1>Credit Card Dashboard</h1>
</div>
<div ng-if="vm.loading" class="text-center">
<p>Loading dashboard...</p>
</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="vm.kpis" class="row">
<div class="col-lg-3 col-md-6 col-sm-12">
<kpi-widget title="Monthly Spend" value="vm.kpis.monthlySpend" icon="glyphicon-credit-card" color="panel-primary"></kpi-widget>
</div>
<div class="col-lg-3 col-md-6 col-sm-12">
<kpi-widget title="Total Credit Limit" value="vm.kpis.totalCreditLimit" icon="glyphicon-stats" color="panel-success"></kpi-widget>
</div>
<div class="col-lg-3 col-md-6 col-sm-12">
<kpi-widget title="Available Credit" value="vm.kpis.totalAvailableCredit" icon="glyphicon-ok-circle" color="panel-info"></kpi-widget>
</div>
<div class="col-lg-3 col-md-6 col-sm-12">
<kpi-widget title="Outstanding Amount" value="vm.kpis.totalOutstanding" icon="glyphicon-exclamation-sign" color="panel-warning"></kpi-widget>
</div>
</div>
<div ng-if="vm.kpis" class="row">
<div class="col-md-12">
<div class="panel panel-default">
<div class="panel-heading">Credit Utilization</div>
<div class="panel-body">
<div class="progress">
<div class="progress-bar" ng-class="{'progress-bar-success':vm.kpis.utilizationRate<30,'progress-bar-warning':vm.kpis.utilizationRate>=30&&vm.kpis.utilizationRate<70,'progress-bar-danger':vm.kpis.utilizationRate>=70}" role="progressbar" ng-style="{width:vm.kpis.utilizationRate+'%'}">{{vm.kpis.utilizationRate}}%</div>
</div>
</div>
</div>
</div>
</div>
<div ng-if="vm.kpis" class="text-muted text-right">
<small>Last updated: {{vm.kpis.lastRefreshed|date:'medium'}}</small>
</div>
</div>
