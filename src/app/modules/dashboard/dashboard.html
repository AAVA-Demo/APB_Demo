<div class="dashboard-container">
  <h2>Dashboard Overview</h2>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading dashboard...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">
    {{vm.error}}
    <button class="btn btn-sm btn-primary" ng-click="vm.loadKPIs()">Retry</button>
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-md-3 col-sm-6">
      <kpi-card title="'Monthly Spend'" value="vm.kpiMetrics.monthlySpend" icon="'glyphicon-credit-card'"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card title="'Total Credit Limit'" value="vm.kpiMetrics.totalCreditLimit" icon="'glyphicon-stats'"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card title="'Available Credit'" value="vm.kpiMetrics.availableCredit" icon="'glyphicon-ok-circle'"></kpi-card>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-card title="'Outstanding Amount'" value="vm.kpiMetrics.outstandingAmount" icon="'glyphicon-exclamation-sign'"></kpi-card>
    </div>
  </div>
</div>
