<div class="dashboard-container">
  <h2>Financial Overview Dashboard</h2>
  <div ng-if="vm.loading" class="loading-spinner">
    <i class="glyphicon glyphicon-refresh spinning"></i> Loading dashboard...
  </div>
  <div ng-if="vm.error" class="error-message">
    {{ vm.error }}
  </div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-md-3 col-sm-6">
      <kpi-widget kpi-label="'Monthly Spend'" kpi-value="vm.kpis.monthlySpend" kpi-format="'currency'"></kpi-widget>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-widget kpi-label="'Total Credit Limit'" kpi-value="vm.kpis.totalCreditLimit" kpi-format="'currency'"></kpi-widget>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-widget kpi-label="'Available Credit'" kpi-value="vm.kpis.availableCredit" kpi-format="'currency'"></kpi-widget>
    </div>
    <div class="col-md-3 col-sm-6">
      <kpi-widget kpi-label="'Outstanding Amount'" kpi-value="vm.kpis.outstandingAmount" kpi-format="'currency'"></kpi-widget>
    </div>
  </div>
  <div ng-if="!vm.loading && vm.kpis.cards" class="row">
    <div class="col-md-12">
      <div class="panel panel-default">
        <div class="panel-heading"><h4>Credit Card Summary</h4></div>
        <div class="panel-body">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Card</th>
                <th>Balance</th>
                <th>Credit Limit</th>
                <th>Available</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="card in vm.kpis.cards">
                <td>{{ card.cardNumber }}</td>
                <td>{{ vm.formatCurrency(card.balance) }}</td>
                <td>{{ vm.formatCurrency(card.creditLimit) }}</td>
                <td>{{ vm.formatCurrency(card.availableCredit) }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
