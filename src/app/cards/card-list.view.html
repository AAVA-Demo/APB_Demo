<div class="row"><div class="col-md-12"><h2>My Credit Cards</h2></div></div><div ng-if="vm.loading" class="row"><div class="col-md-12"><p>Loading cards...</p></div></div><div ng-if="vm.error" class="row"><div class="col-md-12"><div class="alert alert-danger">{{vm.error}}</div></div></div><div ng-if="!vm.loading && vm.cards.length > 0" class="row"><div class="col-md-12"><button class="btn btn-primary" ng-click="vm.compareCards()" ng-disabled="vm.selectedCards.length < 2">Compare Selected ({{vm.selectedCards.length}})</button></div></div><div ng-if="!vm.loading" class="row"><div class="col-md-4" ng-repeat="card in vm.cards"><div class="card-item" ng-click="vm.viewCardDetail(card.cardId)"><input type="checkbox" ng-click="$event.stopPropagation(); vm.toggleCardSelection(card.cardId)" ng-checked="vm.selectedCards.indexOf(card.cardId) > -1"><h4>{{card.cardType}} - {{card.issuer}}</h4><p>{{card.cardNumber}}</p><p><strong>Limit:</strong> ${{card.creditLimit | number:2}}</p><p><strong>Available:</strong> ${{card.availableCredit | number:2}}</p><p><strong>Outstanding:</strong> ${{card.outstandingAmount | number:2}}</p></div></div></div>
