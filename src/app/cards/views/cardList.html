<div class="card-list-container">
  <h2>My Credit Cards</h2>
  <div ng-if="vm.loading" class="text-center"><p>Loading cards...</p></div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error" class="row">
    <div class="col-xs-12 col-sm-6 col-md-4" ng-repeat="card in vm.cards">
      <card-tile card="card" ng-click="vm.selectCard(card)"></card-tile>
    </div>
  </div>
  <div class="row" style="margin-top:20px;">
    <div class="col-xs-12">
      <button class="btn btn-primary" ui-sref="cardRegistration">Register New Card</button>
    </div>
  </div>
</div>
