.kpi-card h3{margin:0 0 10px;font-size:14px;color:#666;text-transform:uppercase}
.kpi-card .value{font-size:28px;font-weight:bold;color:#333}
.card-item{border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:15px;background:#f9f9f9}
.card-number{font-size:18px;letter-spacing:2px;margin:10px 0}
.transaction-table{margin-top:20px}
.filter-panel{background:#f5f5f5;padding:15px;border-radius:5px;margin-bottom:20px}
