<!DOCTYPE html>
<html ng-app="creditCardApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit Card Dashboard</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style>
body{padding-top:20px;background:#f5f5f5}
.kpi-widget{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.kpi-widget h3{margin-top:0;color:#666;font-size:14px}
.kpi-widget .value{font-size:32px;font-weight:bold;color:#333}
.card-item{background:#fff;border-radius:8px;padding:15px;margin-bottom:15px;cursor:pointer;transition:all .3s;border:2px solid transparent}
.card-item:hover{border-color:#337ab7;box-shadow:0 4px 8px rgba(0,0,0,.15)}
.card-item.selected{border-color:#5cb85c}
.chart-container{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.loading-spinner{text-align:center;padding:40px}
@media(max-width:768px){.kpi-widget .value{font-size:24px}}
</style>
</head>
<body>
<div class="container">
<nav class="navbar navbar-default">
<div class="container-fluid">
<div class="navbar-header">
<button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar">
<span class="icon-bar"></span>
<span class="icon-bar"></span>
<span class="icon-bar"></span>
</button>
<a class="navbar-brand" href="#/">Credit Card Manager</a>
</div>
<div class="collapse navbar-collapse" id="navbar">
<ul class="nav navbar-nav">
<li><a href="#/dashboard">Dashboard</a></li>
<li><a href="#/cards">My Cards</a></li>
<li><a href="#/analytics">Analytics</a></li>
</ul>
</div>
</div>
</nav>
<div ng-view></div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="src/app/app.module.js"></script>
<script src="src/app/app.config.js"></script>
<script src="src/app/services/auth.service.js"></script>
<script src="src/app/services/creditcard-data.service.js"></script>
<script src="src/app/services/kpi.service.js"></script>
<script src="src/app/services/creditcard.service.js"></script>
<script src="src/app/services/userprofile.service.js"></script>
<script src="src/app/services/transaction.service.js"></script>
<script src="src/app/services/transaction-data.service.js"></script>
<script src="src/app/services/analytics-engine.service.js"></script>
<script src="src/app/services/data-aggregation.factory.js"></script>
<script src="src/app/dashboard/dashboard.module.js"></script>
<script src="src/app/dashboard/dashboard.controller.js"></script>
<script src="src/app/dashboard/kpi-widget.directive.js"></script>
<script src="src/app/dashboard/dashboard-layout.directive.js"></script>
<script src="src/app/card-management/card-management.module.js"></script>
<script src="src/app/card-management/card-management.controller.js"></script>
<script src="src/app/card-management/card-list-view.directive.js"></script>
<script src="src/app/card-management/card-details-view.directive.js"></script>
<script src="src/app/analytics/analytics.module.js"></script>
<script src="src/app/analytics/analytics.controller.js"></script>
<script src="src/app/analytics/spending-chart.directive.js"></script>
</body>
</html>
