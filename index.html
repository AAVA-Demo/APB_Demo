<!DOCTYPE html>
<html ng-app="creditCardApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Management</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body { padding-top: 20px; }
    .kpi-card { margin-bottom: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; }
    .kpi-card h3 { margin-top: 0; color: #337ab7; }
    .kpi-card .value { font-size: 28px; font-weight: bold; color: #333; }
    .card-item { margin-bottom: 15px; cursor: pointer; transition: transform 0.2s; }
    .card-item:hover { transform: scale(1.02); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .transaction-row { border-bottom: 1px solid #eee; padding: 10px 0; }
    .chart-container { position: relative; height: 400px; margin-bottom: 30px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-default">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="#/">Credit Card Manager</a>
      </div>
      <div class="collapse navbar-collapse" id="navbar">
        <ul class="nav navbar-nav">
          <li><a href="#/dashboard">Dashboard</a></li>
          <li><a href="#/cards">My Cards</a></li>
          <li><a href="#/analytics">Analytics</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <div ng-view></div>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="src/app/app.module.js"></script>
  <script src="src/app/services/AuthService.js"></script>
  <script src="src/app/modules/dashboard/dashboard.module.js"></script>
  <script src="src/app/modules/dashboard/services/DashboardService.js"></script>
  <script src="src/app/modules/dashboard/controllers/DashboardController.js"></script>
  <script src="src/app/modules/cardManagement/cardManagement.module.js"></script>
  <script src="src/app/modules/cardManagement/services/CardService.js"></script>
  <script src="src/app/modules/cardManagement/services/TransactionService.js"></script>
  <script src="src/app/modules/cardManagement/controllers/CardManagementController.js"></script>
  <script src="src/app/modules/analytics/analytics.module.js"></script>
  <script src="src/app/modules/analytics/services/AnalyticsService.js"></script>
  <script src="src/app/modules/analytics/controllers/AnalyticsController.js"></script>
  <script src="src/app/modules/analytics/directives/spendingChart.directive.js"></script>
</body>
</html>
