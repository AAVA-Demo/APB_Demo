<!DOCTYPE html>
<html ng-app="creditCardApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Analysis Dashboard</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">
<style>
.kpi-card{padding:20px;margin:15px 0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);background:#fff;text-align:center;transition:transform 0.3s;}
.kpi-card:hover{transform:translateY(-5px);}
.kpi-value{font-size:32px;font-weight:bold;color:#2c3e50;}
.kpi-label{font-size:14px;color:#7f8c8d;margin-top:8px;}
.card-item{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:6px;cursor:pointer;transition:all 0.3s;}
.card-item:hover{background:#f8f9fa;border-color:#007bff;}
.card-item.selected{background:#e3f2fd;border-color:#007bff;}
.masked-number{font-family:monospace;font-size:16px;letter-spacing:2px;}
.chart-container{position:relative;height:400px;margin:20px 0;}
.category-badge{display:inline-block;padding:5px 12px;margin:5px;border-radius:20px;font-size:12px;}
.comparison-table{width:100%;margin-top:20px;}
.comparison-table th{background:#007bff;color:#fff;padding:12px;}
.comparison-table td{padding:10px;border-bottom:1px solid #ddd;}
.trend-chart{margin-top:30px;}
.filter-panel{background:#f8f9fa;padding:15px;border-radius:6px;margin-bottom:20px;}
.loading-spinner{text-align:center;padding:50px;}
</style>
</head>
<body>
<nav class="navbar navbar-inverse">
<div class="container-fluid">
<div class="navbar-header">
<a class="navbar-brand" href="#">Credit Card Dashboard</a>
</div>
<ul class="nav navbar-nav">
<li><a href="#!/dashboard">Dashboard</a></li>
<li><a href="#!/cards">My Cards</a></li>
<li><a href="#!/analytics">Analytics</a></li>
</ul>
</div>
</nav>
<div class="container-fluid">
<div ng-view></div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
<script src="src/app/app.module.js"></script>
<script src="src/app/app.config.js"></script>
<script src="src/app/services/auth.service.js"></script>
<script src="src/app/services/credit-card-data.service.js"></script>
<script src="src/app/services/transaction.service.js"></script>
<script src="src/app/services/kpi-calculation.service.js"></script>
<script src="src/app/services/analytics-engine.service.js"></script>
<script src="src/app/services/card-analysis.service.js"></script>
<script src="src/app/services/card-comparison.service.js"></script>
<script src="src/app/services/data-visualization.service.js"></script>
<script src="src/app/services/realtime-refresh.factory.js"></script>
<script src="src/app/kpi-dashboard/kpi-dashboard.module.js"></script>
<script src="src/app/kpi-dashboard/kpi-dashboard.controller.js"></script>
<script src="src/app/card-management/card-management.module.js"></script>
<script src="src/app/card-management/card-management.controller.js"></script>
<script src="src/app/transaction-analytics/transaction-analytics.module.js"></script>
<script src="src/app/transaction-analytics/transaction-analytics.controller.js"></script>
<script src="src/app/directives/kpi-widget.directive.js"></script>
<script src="src/app/directives/card-switcher.directive.js"></script>
<script src="src/app/directives/card-detail.directive.js"></script>
<script src="src/app/directives/card-mask.directive.js"></script>
<script src="src/app/directives/category-chart.directive.js"></script>
<script src="src/app/directives/trend-analysis.directive.js"></script>
<script src="src/app/filters/card-number-mask.filter.js"></script>
</body>
</html>
