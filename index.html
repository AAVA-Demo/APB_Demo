<!DOCTYPE html>
<html ng-app="creditCardApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit Card Analysis Dashboard</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;padding-top:60px}
.navbar-brand{font-weight:700}
.kpi-card{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 4px rgba(0,0,0,.1);text-align:center}
.kpi-card .kpi-value{font-size:32px;font-weight:700;color:#2c3e50;margin:10px 0}
.kpi-card .kpi-label{font-size:14px;color:#7f8c8d;text-transform:uppercase}
.kpi-card .kpi-icon{font-size:40px;color:#3498db;margin-bottom:10px}
.card-item{background:#fff;border-radius:8px;padding:15px;margin-bottom:15px;box-shadow:0 2px 4px rgba(0,0,0,.1);cursor:pointer;transition:all .3s}
.card-item:hover{box-shadow:0 4px 8px rgba(0,0,0,.2);transform:translateY(-2px)}
.card-item.selected{border:2px solid #3498db}
.card-number{font-size:18px;font-weight:700;letter-spacing:2px}
.card-type{color:#7f8c8d;font-size:12px}
.chart-container{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 4px rgba(0,0,0,.1);margin-bottom:20px}
.category-table{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.filter-panel{background:#fff;border-radius:8px;padding:15px;margin-bottom:20px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.loading{text-align:center;padding:40px;font-size:18px;color:#7f8c8d}
</style>
</head>
<body>
<nav class="navbar navbar-inverse navbar-fixed-top">
<div class="container-fluid">
<div class="navbar-header">
<button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
<span class="icon-bar"></span>
<span class="icon-bar"></span>
<span class="icon-bar"></span>
</button>
<a class="navbar-brand" href="#/dashboard">Credit Card Dashboard</a>
</div>
<div class="collapse navbar-collapse" id="myNavbar">
<ul class="nav navbar-nav">
<li><a href="#/dashboard"><i class="fa fa-dashboard"></i> Dashboard</a></li>
<li><a href="#/cards"><i class="fa fa-credit-card"></i> My Cards</a></li>
<li><a href="#/analytics"><i class="fa fa-bar-chart"></i> Analytics</a></li>
</ul>
</div>
</div>
</nav>
<div class="container-fluid">
<div ng-view></div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-animate.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-resource.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
<script src="src/app/app.module.js"></script>
<script src="src/app/app.config.js"></script>
<script src="src/app/services/auth.service.js"></script>
<script src="src/app/services/kpi.service.js"></script>
<script src="src/app/services/data-refresh.service.js"></script>
<script src="src/app/services/card-management.service.js"></script>
<script src="src/app/services/user-profile.factory.js"></script>
<script src="src/app/services/card-issuer.service.js"></script>
<script src="src/app/services/analytics.service.js"></script>
<script src="src/app/services/data-aggregation.service.js"></script>
<script src="src/app/dashboard/dashboard.controller.js"></script>
<script src="src/app/dashboard/kpi-card.directive.js"></script>
<script src="src/app/card-management/card-list.controller.js"></script>
<script src="src/app/card-management/card-detail.controller.js"></script>
<script src="src/app/card-management/card-selector.directive.js"></script>
<script src="src/app/analytics/analytics.controller.js"></script>
<script src="src/app/analytics/spending-chart.directive.js"></script>
<script src="src/app/analytics/category-breakdown.directive.js"></script>
<script src="src/app/analytics/category.filter.js"></script>
</body>
</html>
