<!DOCTYPE html>
<html ng-app="fraudAlertApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Credit Card Fraud Alert System</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">
<style>
.notification-badge{position:absolute;top:-8px;right:-8px;background:#d9534f;color:#fff;border-radius:50%;padding:2px 6px;font-size:10px;font-weight:bold}
.alert-card{margin-bottom:15px;border:1px solid #ddd;border-radius:4px;padding:15px}
.alert-card.critical{border-left:4px solid #d9534f}
.alert-card.high{border-left:4px solid #f0ad4e}
.alert-card.medium{border-left:4px solid #5bc0de}
.alert-card.low{border-left:4px solid #5cb85c}
.notification-list{max-height:400px;overflow-y:auto}
.preference-toggle{margin:10px 0}
</style>
</head>
<body>
<nav class="navbar navbar-inverse">
<div class="container-fluid">
<div class="navbar-header">
<a class="navbar-brand" href="#">Fraud Alert System</a>
</div>
<ul class="nav navbar-nav navbar-right">
<li><a href="#!/notifications"><span class="glyphicon glyphicon-bell"></span> Notifications <span ng-controller="alertNotificationCtrl as vm" ng-if="vm.unreadCount>0" class="notification-badge">{{vm.unreadCount}}</span></a></li>
<li><a href="#!/settings"><span class="glyphicon glyphicon-cog"></span> Settings</a></li>
</ul>
</div>
</nav>
<div class="container-fluid">
<div ng-view></div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular-local-storage/0.7.1/angular-local-storage.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
<script src="src/app/app.module.js"></script>
<script src="src/app/app.config.js"></script>
<script src="src/app/app.routes.js"></script>
<script src="src/app/services/analytics.service.js"></script>
<script src="src/app/services/customer-preference.service.js"></script>
<script src="src/app/services/delivery-status.service.js"></script>
<script src="src/app/services/in-app-queue.service.js"></script>
<script src="src/app/services/notification-orchestrator.service.js"></script>
<script src="src/app/notifications/factories/push-notification.factory.js"></script>
<script src="src/app/notifications/factories/sms-provider.factory.js"></script>
<script src="src/app/notifications/factories/email-provider.factory.js"></script>
<script src="src/app/notifications/controllers/notification-settings.controller.js"></script>
<script src="src/app/notifications/controllers/alert-notification.controller.js"></script>
<script src="src/app/notifications/directives/notification-badge.directive.js"></script>
</body>
</html>
